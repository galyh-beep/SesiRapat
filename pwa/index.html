    <title>SesiRapat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <style>
      :root{
        --indigo-950:#1E1B4B; --indigo:#4F46E5; --indigo-dark:#4338CA; --indigo-soft:#EEF0FE;
        --teal:#0D9488; --teal-dark:#0F766E; --teal-soft:#E6F7F4;
        --bg:#F4F5FA; --surface:#FFFFFF; --surface-2:#ECEEF6; --line:#E2E4EF;
        --ink:#191C2E; --ink-2:#4A4F6B; --ink-3:#7A7F99;
        --green:#15803D; --green-soft:#E7F6EC; --blue:#2563EB; --blue-soft:#E8EFFE;
        --red:#DC2626; --red-soft:#FDECEC; --amber:#B45309; --amber-soft:#FDF3E0;
        --dark-card:#23263B; --dark-soft:#E9EAF2;
        --shadow:0 1px 2px rgba(25,27,75,.06),0 8px 24px -12px rgba(25,27,75,.18);
        --radius:14px;
        color-scheme:light;
      }
      @media (prefers-color-scheme: dark){
        :root{
          --bg:#101020; --surface:#1B1B30; --surface-2:#262640; --line:#33334F;
          --ink:#F1F1F8; --ink-2:#C3C5D9; --ink-3:#8E91AC;
          --indigo-soft:#2B2A55; --teal-soft:#123B37;
          --green-soft:#14301F; --blue-soft:#1B2B52; --red-soft:#3D1D1D; --amber-soft:#3A2C12;
          --dark-card:#262640; --dark-soft:#2C2C48;
          --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
          color-scheme:dark;
        }
      }
      *{box-sizing:border-box}
      html{-webkit-text-size-adjust:100%}
      body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-size:15px;line-height:1.5;padding-bottom:calc(86px + env(safe-area-inset-bottom))}
      h1,h2,h3{margin:0;line-height:1.25}
      button,[role="button"],select,summary,input:not([type="checkbox"],[type="radio"]),textarea{font:inherit}
      button,[role="button"],select,summary,input:not([type="checkbox"],[type="radio"]){min-height:2.25rem}
      a{color:var(--indigo)}
      .wrap{max-width:1060px;margin:0 auto;padding:0 16px}

      /* Header */
      header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
      .top-in{max-width:1060px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
      .brand{display:flex;align-items:center;gap:10px;min-width:0}
      .brand img{width:40px;height:40px;border-radius:11px;flex:none}
      .brand .greet{font-size:12px;color:var(--ink-3);line-height:1.2}
      .brand .bname{font-weight:800;font-size:17px;line-height:1.2}
      .top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
      .icon-btn{width:40px;height:40px;border-radius:11px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-2)}
      .icon-btn:hover{background:var(--surface-2)}
      .icon-btn svg{width:20px;height:20px}

      /* Hero / headings */
      .hero{padding:22px 0 6px}
      .hero h1{font-family:"Fraunces",serif;font-size:clamp(24px,4.6vw,34px);font-weight:700;letter-spacing:-.01em}
      .hero p{color:var(--ink-2);margin:6px 0 0;max-width:56ch}
      .sec-head{display:flex;align-items:baseline;gap:10px;margin:26px 0 12px}
      .sec-head h2{font-size:17px;font-weight:800}
      .sec-head .link{margin-left:auto;font-size:13px;font-weight:700;text-decoration:none}

      /* Role switch */
      .role-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}
      .role-row .lbl{font-size:13px;color:var(--ink-2);font-weight:600}
      .chip-btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink-2);min-height:36px}
      .chip-btn.on{background:var(--indigo);border-color:var(--indigo);color:#fff}
      .role-note{font-size:12.5px;color:var(--ink-3)}

      /* Search */
      .search{width:100%;margin-top:14px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:11px 18px;min-height:46px}
      .search:focus{outline:2px solid var(--indigo);outline-offset:1px}

      /* Cards */
      .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
      .card + .card{margin-top:12px}
      .cta-card{background:var(--indigo-950);color:#fff;border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
      .cta-card h2{font-size:19px}
      .cta-card p{color:#C7C9E8;margin:6px 0 14px;font-size:14px;max-width:52ch}
      .live-card{background:linear-gradient(120deg,var(--teal-dark),var(--teal));color:#fff;border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);cursor:pointer;border:0;width:100%;text-align:left}
      .live-card h2{font-size:18px;margin-top:6px}
      .live-card p{color:#D9F5F0;margin:4px 0 0;font-size:13.5px}
      .paused-card{background:linear-gradient(120deg,#92400E,#B45309)}
      .pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:rgba(255,255,255,.18);padding:4px 10px;border-radius:999px}
      .pill .dot{width:7px;height:7px;border-radius:50%;background:#fff;animation:blink 1.6s infinite}
      @keyframes blink{50%{opacity:.35}}
      @media (prefers-reduced-motion: reduce){.pill .dot{animation:none}}

      /* Buttons */
      .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:11px;border:1px solid transparent;padding:9px 16px;font-weight:700;font-size:14px;cursor:pointer;min-height:42px;text-decoration:none}
      .btn-pri{background:var(--indigo);color:#fff}.btn-pri:hover{background:var(--indigo-dark)}
      .btn-teal{background:var(--teal);color:#fff}.btn-teal:hover{background:var(--teal-dark)}
      .btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
      .btn-ghost:hover{background:var(--surface-2)}
      .btn-soft{background:var(--indigo-soft);color:var(--indigo)}
      .btn-danger{background:var(--red-soft);color:var(--red)}
      .btn-white{background:#fff;color:var(--indigo-950)}
      .btn-sm{min-height:36px;padding:6px 12px;font-size:13px;border-radius:9px}
      .btn[disabled]{opacity:.45;cursor:not-allowed}
      .btn-block{width:100%}

      /* Meeting list rows */
      .mrow{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);cursor:pointer;width:100%;text-align:left}
      .mrow + .mrow{margin-top:10px}
      .mrow .date-box{flex:none;width:52px;text-align:center;background:var(--indigo-soft);color:var(--indigo);border-radius:11px;padding:7px 0}
      .mrow .date-box .d{font-size:19px;font-weight:800;line-height:1}
      .mrow .date-box .m{font-size:11px;font-weight:700;text-transform:uppercase}
      .mrow h3{font-size:15.5px}
      .mrow .meta{font-size:13px;color:var(--ink-2);margin-top:2px}
      .badge{display:inline-block;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px}
      .b-terjadwal{background:var(--blue-soft);color:var(--blue)}
      .b-langsung{background:var(--teal-soft);color:var(--teal-dark)}
      .b-jeda{background:var(--amber-soft);color:var(--amber)}
      .b-selesai{background:var(--dark-soft);color:var(--ink-2)}
      .empty{border:1.5px dashed var(--line);border-radius:var(--radius);padding:26px 18px;text-align:center;color:var(--ink-2);background:var(--surface)}
      .empty h3{color:var(--ink);margin-bottom:4px}

      /* Rekap stat cards */
      .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px}
      .stat{border-radius:12px;padding:12px 10px;text-align:center}
      .stat .n{font-size:24px;font-weight:800;line-height:1.1}
      .stat .l{font-size:12px;font-weight:700}
      .st-hadir{background:var(--green-soft);color:var(--green)}
      .st-belum{background:var(--dark-soft);color:var(--ink)}
      .st-izin{background:var(--blue-soft);color:var(--blue)}
      .st-alpa{background:var(--red-soft);color:var(--red)}
      .st-terlambat{background:var(--amber-soft);color:var(--amber)}

      /* Chips / tags */
      .tag{display:inline-block;background:var(--surface-2);color:var(--ink-2);font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;margin:2px 3px 2px 0}
      .tag-teal{background:var(--teal-soft);color:var(--teal-dark)}
      .st-chip{display:inline-block;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px}
      .sc-hadir{background:var(--green-soft);color:var(--green)}
      .sc-belum{background:var(--dark-soft);color:var(--ink-2)}
      .sc-izin{background:var(--blue-soft);color:var(--blue)}
      .sc-alpa{background:var(--red-soft);color:var(--red)}
      .sc-terlambat{background:var(--amber-soft);color:var(--amber)}

      /* Forms */
      .field{margin-bottom:14px}
      .field label{display:block;font-weight:700;font-size:13.5px;margin-bottom:6px}
      .field .hint{font-size:12.5px;color:var(--ink-3);margin-top:5px}
      .inp,textarea.inp,select.inp{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:11px;padding:10px 12px;min-height:44px}
      textarea.inp{min-height:110px;resize:vertical;line-height:1.55}
      .inp:focus{outline:2px solid var(--indigo);outline-offset:0;border-color:var(--indigo)}
      .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
      .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
      @media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
      label.check{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:11px;cursor:pointer;background:var(--surface)}
      label.check input{width:19px;height:19px;margin-top:2px;flex:none;accent-color:var(--indigo)}
      label.check .t{font-weight:700;font-size:14px}
      label.check .d{font-size:12.5px;color:var(--ink-2)}

      /* Wizard */
      .steps{display:flex;gap:6px;margin:18px 0}
      .steps .s{flex:1;text-align:center;font-size:12px;font-weight:700;color:var(--ink-3);padding-top:8px;border-top:3px solid var(--line)}
      .steps .s.on{color:var(--indigo);border-top-color:var(--indigo)}
      .steps .s.done{color:var(--teal-dark);border-top-color:var(--teal)}
      .wiz-nav{display:flex;gap:10px;margin-top:18px}
      .wiz-nav .sp{flex:1}

      /* Tabs */
      .tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 4px}
      .tab{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 15px;font-weight:700;font-size:13.5px;cursor:pointer;color:var(--ink-2);min-height:38px}
      .tab.on{background:var(--indigo);border-color:var(--indigo);color:#fff}

      /* QR */
      .qr-toggle{width:100%;margin-top:16px}
      .qr-box{text-align:center}
      .qr-box .qrwrap{display:inline-block;background:#fff;padding:14px;border-radius:14px;border:1px solid var(--line)}
      .qr-code{font-family:"JetBrains Mono",monospace;font-size:30px;font-weight:700;letter-spacing:.28em;margin:10px 0 2px;color:var(--ink)}
      .qr-prog{height:5px;background:var(--surface-2);border-radius:99px;overflow:hidden;max-width:280px;margin:8px auto 0}
      .qr-prog i{display:block;height:100%;background:var(--teal);transition:width 1s linear}
      .sig-pad{width:100%;height:150px;border:1.5px dashed var(--line);border-radius:11px;background:var(--surface);touch-action:none;cursor:crosshair}
      .sig-thumb{height:34px;border-radius:6px;background:#fff;border:1px solid var(--line)}

      /* Attendee rows */
      .arow{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
      .arow:last-child{border-bottom:0}
      .arow .who{flex:1;min-width:0}
      .arow .who .nm{font-weight:700}
      .arow .who .sub{font-size:12.5px;color:var(--ink-2)}
      .arow .acts{display:flex;flex-wrap:wrap;gap:6px}

      /* Mic */
      .mic-btn{width:96px;height:96px;border-radius:50%;border:0;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;margin:6px auto;box-shadow:0 10px 24px -8px rgba(220,38,38,.55)}
      .mic-btn svg{width:40px;height:40px}
      .mic-btn.rec{animation:pulse 1.4s infinite}
      @keyframes pulse{50%{transform:scale(1.06)}}
      @media (prefers-reduced-motion: reduce){.mic-btn.rec{animation:none}}
      .meter{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
      .meter i{display:block;height:100%;width:0;background:var(--teal);transition:width .12s}

      /* Tasks */
      .trow{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
      .trow:last-child{border-bottom:0}
      .due-bad{color:var(--red);font-weight:800}
      .due-warn{color:var(--amber);font-weight:800}

      /* Bottom nav */
      nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
      .bottom-in{max-width:1060px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:end}
      .nav-it{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 7px;font-size:11px;font-weight:700;color:var(--ink-3);background:none;border:0;cursor:pointer;min-height:56px;justify-content:flex-end}
      .nav-it svg{width:22px;height:22px}
      .nav-it.on{color:var(--indigo)}
      .fab-cell{display:flex;justify-content:center}
      .fab{width:56px;height:56px;border-radius:50%;background:var(--teal);color:#fff;border:3px solid var(--surface);margin-top:-22px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 8px 20px -6px rgba(13,148,136,.6)}
      .fab svg{width:27px;height:27px}
      .fab-lbl{font-size:11px;font-weight:700;color:var(--ink-3);text-align:center;padding-bottom:7px}

      /* Banner install */
      .install-banner{position:fixed;left:12px;right:12px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:60;background:var(--indigo-950);color:#fff;border-radius:14px;padding:14px 16px;box-shadow:0 16px 40px -12px rgba(0,0,0,.5);display:none}
      .install-banner.show{display:flex;gap:12px;align-items:center}
      .install-banner img{width:44px;height:44px;border-radius:10px}
      .install-banner .t{font-weight:800;font-size:14.5px}
      .install-banner .d{font-size:12.5px;color:#C7C9E8}
      .install-banner .x{background:none;border:0;color:#C7C9E8;font-size:20px;cursor:pointer;padding:6px;min-height:36px}

      /* Modal */
      .modal-bk{position:fixed;inset:0;background:rgba(10,10,30,.55);z-index:80;display:none;align-items:flex-end;justify-content:center}
      .modal-bk.show{display:flex}
      .modal{background:var(--surface);color:var(--ink);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
      @media (min-width:700px){.modal-bk{align-items:center}.modal{border-radius:18px}}
      .modal h2{font-size:18px;margin-bottom:4px}
      .modal .sub{color:var(--ink-2);font-size:13.5px;margin-bottom:14px}

      .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom));z-index:90;background:var(--dark-card);color:#fff;padding:11px 18px;border-radius:999px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);display:none;max-width:92vw;text-align:center}
      .toast.show{display:block}
      .note{border-radius:12px;padding:12px 14px;font-size:13.5px}
      .note-amber{background:var(--amber-soft);color:var(--ink)}
      .note-teal{background:var(--teal-soft);color:var(--ink)}
      .note b{font-weight:800}
      .kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
      .kv:last-child{border-bottom:0}.kv .k{color:var(--ink-2)}.kv .v{font-weight:700;text-align:right}
      .doc-preview{background:#fff;color:#1c1c28;border:1px solid var(--line);border-radius:10px;padding:22px;font-size:13.5px;line-height:1.6;overflow:auto}
      .doc-preview table{border-collapse:collapse;width:100%}
      .doc-preview th,.doc-preview td{border:1px solid #c9c9d4;padding:6px 8px;text-align:left;font-size:12.5px;vertical-align:top}
      .muted{color:var(--ink-2)} .small{font-size:12.5px} .mt{margin-top:14px} .mb{margin-bottom:12px}
      .rowflex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
      .grow{flex:1;min-width:0}
      .hidden{display:none !important}
      @media print{ nav.bottom,header.top,.no-print{display:none !important} body{padding-bottom:0} }
    </style>
  </head>

    /* ---------- Util ---------- */
    function $(s, r){ return (r||document).querySelector(s); }
    function $$(s, r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); }
    function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
    function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
    function pad2(n){ return (n<10?'0':'')+n; }
    function todayStr(d){ d=d||new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
    function nowTime(){ var d=new Date(); return pad2(d.getHours())+':'+pad2(d.getMinutes()); }
    var BULAN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
    var BULAN_S=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
    var HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
    function fmtTgl(s){ if(!s) return '—'; var p=s.split('-'); var d=new Date(+p[0],+p[1]-1,+p[2]); return HARI[d.getDay()]+', '+d.getDate()+' '+BULAN[d.getMonth()]+' '+d.getFullYear(); }
    function fmtTglSingkat(s){ if(!s) return '—'; var p=s.split('-'); return (+p[2])+' '+BULAN_S[+p[1]-1]+' '+p[0]; }
    function dtOf(m){ return new Date(m.tanggal+'T'+(m.mulai||'00:00')+':00'); }
    function addDaysStr(s, n){ var p=s.split('-'); var d=new Date(+p[0],+p[1]-1,+p[2]+n); return todayStr(d); }
    function diffDays(a, b){ var pa=a.split('-'), pb=b.split('-'); var da=new Date(+pa[0],+pa[1]-1,+pa[2]); var db=new Date(+pb[0],+pb[1]-1,+pb[2]); return Math.round((db-da)/86400000); }
    function toast(msg){ var t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(function(){ t.classList.remove('show'); }, 3200); }
    function download(name, content, mime){
      var blob = content instanceof Blob ? content : new Blob([content], {type: mime||'text/plain;charset=utf-8'});
      var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
      document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 400);
    }
    function slugify(s){ return String(s||'dokumen').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40)||'dokumen'; }

    function allGroups(){
      var set = {};
      DB.participants.forEach(function(p){ (p.groups||[]).forEach(function(g){ set[g]=true; }); });

    function attStats(m){
      var s = { hadir:0, belum:0, izin:0, alpa:0, terlambat:0, total:m.attendees.length };
      m.attendees.forEach(function(a){
        if (a.status==='hadir'){ s.hadir++; if (a.late) s.terlambat++; }
        else if (a.status==='izin') s.izin++;
        else if (a.status==='alpa') s.alpa++;
        else s.belum++;
      });
      return s;
    }
    function activeTemplate(kind){
      var t = DB.templates.filter(function(x){ return x.kind===kind && x.active; })[0];
      return t || DB.templates.filter(function(x){ return x.kind===kind; })[0] || null;
    }

    function greeting(){

    function meetingCard(m, showDate){

        stBadge+'</button>';

    function upcomingReminders(){
      var out = []; var t = todayStr(); var R = DB.settings.reminders;
      DB.meetings.forEach(function(m){
        if (m.status==='selesai') return;
        var d = diffDays(t, m.tanggal); var start = dtOf(m); var now = new Date();
        function push(jenis, label, when){ out.push({ m: m, jenis: jenis, label: label, when: when }); }
        if (R.h3 && d===3) push('H-3', '3 hari lagi', m.tanggal);
        if (R.h1 && d===1) push('H-1', 'Besok', m.tanggal);
        if (d===0){
          if (R.morning && now.getHours()<+m.mulai.split(':')[0]) push('Hari-H pagi', 'Hari ini · pengingat pagi 07:00', m.tanggal);
          var msUntil = start - now;
          if (R.h5 && msUntil > 4.5*3600e3 && msUntil < 5.5*3600e3) push('5 jam lagi', 'Mulai '+m.mulai, m.tanggal);
          if (R.h2 && msUntil > 1.5*3600e3 && msUntil < 2.5*3600e3) push('2 jam lagi', 'Mulai '+m.mulai, m.tanggal);
          if (msUntil <= 0 && m.status==='terjadwal') push('Hari ini', 'Sudah waktunya dimulai', m.tanggal);
        }
        if (d>0 && d<3 && !((d===1))) { /* H-2 tidak dipakai */ }
        if (d===2) push('H-2', '2 hari lagi', m.tanggal);
      });
      return out;
    }

      }

      if (rems.length){
        h += '<div class="sec-head"><h2>'+IC.bell.replace('width="20" height="20"','width="17" height="17"')+' Pengingat rapat</h2></div>';
        rems.forEach(function(r){
          h += '<div class="card" style="padding:12px 16px"><div class="rowflex"><span class="badge b-terjadwal">'+esc(r.jenis)+'</span><span class="grow"><b>'+esc(r.m.judul)+'</b><br/><span class="small muted">'+fmtTglSingkat(r.m.tanggal)+' · '+esc(r.m.mulai)+' · '+esc(r.label)+'</span></span><button class="btn btn-soft btn-sm" data-open-meeting="'+r.m.id+'">Buka</button></div></div>';
        });
      }

      if (openTasks.length){
        h += '<div class="sec-head"><h2>Tindak lanjut terbuka</h2><a class="link" href="#" data-go="tugas">Semua tugas</a></div>';
        openTasks.slice(0,3).forEach(function(x){
          var dd = diffDays(t, x.due);
          var dueCls = dd<0?'due-bad':(dd<=3?'due-warn':'');
          var dueTxt = dd<0? 'Lewat tenggat '+(-dd)+' hari' : dd===0? 'Jatuh tempo hari ini' : dd===1? 'Besok' : 'H-'+dd;

          '<div id="wizTamuList" class="mt">'+(wiz.guests||[]).map(function(g,i){ return '<span class="tag" style="font-size:13px;padding:6px 10px">'+esc(g)+' <a href="#" data-wiz-untamu="'+i+'" style="color:var(--red);text-decoration:none;font-weight:800">×</a></span>'; }).join('')+'</div></div></div>';

        '<div class="field"><label>Template notulensi aktif</label><p class="hint" style="margin:0">'+esc(tplOpts.length&&activeTemplate('notulensi')?activeTemplate('notulensi').nama:'—')+' · ganti di Template Studio</p></div></div>'+

        '<div class="kv"><span class="k">Tempat</span><span class="v">'+esc(wiz.tempat||'—')+'</span></div>'+
        '<div class="kv"><span class="k">Pimpinan</span><span class="v">'+esc(wiz.pimpinan||'—')+'</span></div>'+

    function wizCollect(){
      if (!wiz) return;
      if (wiz.step===1){
        wiz.judul = $('#wJudul').value.trim(); wiz.tanggal = $('#wTgl').value || todayStr();
        wiz.mulai = $('#wMulai').value || '09:00'; wiz.selesai = $('#wSelesai').value || '';
        wiz.tempat = $('#wTempat').value.trim(); wiz.pimpinan = $('#wPimpinan').value.trim();
        wiz.notulis = $('#wNotulis').value.trim(); wiz.agenda = $('#wAgenda').value.trim();
      }
      if (wiz.step===3){ wiz.tolerance = Math.max(0, parseInt($('#wTol').value,10)||0); wiz.aiNote = $('#wAi').checked; }

    /* ================= RUANG RAPAT ================= */
    var qrTimer = null, qrVisible = false, kioskFor = null;
    function stopQrTimer(){ if (qrTimer){ clearInterval(qrTimer); qrTimer = null; } }
    function ensureCode(m){
      var now = Date.now();
      if (!m.code || !m.code.exp || now >= m.code.exp){
        var chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; var v = '';
        for (var i=0;i<6;i++) v += chars[Math.floor(Math.random()*chars.length)];
        m.code = { val: v, exp: now + 60000 };
        save();
      }
      return m.code;
    }
    function windowInfo(m){
      var start = dtOf(m); var open = new Date(start.getTime() - 30*60000);
      var onTimeUntil = new Date(start.getTime() + (m.tolerance||15)*60000);
      var endT = m.selesai ? new Date(m.tanggal+'T'+m.selesai+':00') : new Date(start.getTime()+2*3600e3);
      var close = new Date(Math.max(endT.getTime(), onTimeUntil.getTime()) + (DB.settings.graceEnd||60)*60000);
      var now = new Date();
      var status = m.status==='selesai' ? 'Ditutup' : now < open ? 'Belum dibuka' : now <= onTimeUntil ? 'Dibuka · tepat waktu' : now <= close ? 'Dibuka · cap Terlambat' : 'Ditutup';
      return { open: open, onTimeUntil: onTimeUntil, close: close, status: status,
        fmt: function(d){ return pad2(d.getHours())+':'+pad2(d.getMinutes()); } };
    }
    function statusChip(a){
      if (a.status==='hadir') return '<span class="st-chip sc-hadir">Hadir</span>' + (a.late? ' <span class="st-chip sc-terlambat">Terlambat</span>':'') + (a.jam? ' <span class="small muted">'+esc(a.jam)+'</span>':'');
      if (a.status==='izin') return '<span class="st-chip sc-izin">Izin</span>';
      if (a.status==='alpa') return '<span class="st-chip sc-alpa">Alpa</span>';
      return '<span class="st-chip sc-belum">Belum</span>';
    }
    function vRuang(){
      var m = getMeeting(view.meetingId);
      if (!m) return '<div class="empty" style="margin-top:24px"><h3>Rapat tidak ditemukan</h3><button class="btn btn-pri" data-go="rapat">Ke daftar rapat</button></div>';
      var s = attStats(m); var w = windowInfo(m);
      var h = '<section class="hero" style="padding-bottom:0"><p class="muted" style="margin:0 0 4px">'+fmtTgl(m.tanggal)+' · '+esc(m.mulai)+'–'+esc(m.selesai)+'</p>'+
        '<h1 style="font-size:clamp(22px,4vw,28px)">'+esc(m.judul)+'</h1>'+
        '<p>'+esc(m.tempat||'—')+' · Pimpinan: '+esc(m.pimpinan||'—')+' · Notulis: '+esc(m.notulis||'—')+(m.agenda?'<br/>Agenda: '+esc(m.agenda):'')+'</p></section>';
      h += '<div class="rowflex mt">'+
        (m.status==='terjadwal' && canManage() ? '<button class="btn btn-teal" id="btnStart">'+IC.play+' Mulai Rapat</button>' : '')+
        (m.status==='berlangsung' && canManage() ? '<button class="btn btn-ghost" id="btnPause">'+IC.pause+' Jeda</button><button class="btn btn-pri" id="btnEnd">'+IC.stop+' Akhiri Rapat</button>' : '')+
        (m.status==='dijeda' && canManage() ? '<button class="btn btn-teal" id="btnResume">'+IC.play+' Lanjutkan</button><button class="btn btn-pri" id="btnEnd">'+IC.stop+' Akhiri Rapat</button>' : '')+
        '<span class="badge '+(m.status==='berlangsung'?'b-langsung':m.status==='dijeda'?'b-jeda':m.status==='selesai'?'b-selesai':'b-terjadwal')+'">'+
          (m.status==='berlangsung'?'Sedang berlangsung':m.status==='dijeda'?'Dijeda · '+esc(m.pauseReason||''):m.status==='selesai'?'Selesai':'Terjadwal')+'</span>'+
        (canManage() ? '<button class="btn btn-ghost btn-sm" id="btnEditMeeting">'+IC.edit+' Edit</button><button class="btn btn-danger btn-sm" id="btnDelMeeting">'+IC.trash+' Hapus</button>' : '')+
        '</div>';
      if (m.status==='dijeda' && m.pauseLog && m.pauseLog.length){
        h += '<div class="note note-amber mt"><b>Riwayat jeda:</b> '+m.pauseLog.map(function(p){ return esc(p.reason)+' ('+esc(p.from)+(p.to?' – '+esc(p.to):' – …')+')'; }).join(' · ')+'</div>';
      }
      h += '<div class="tabs" role="tablist">'+
        [['presensi','Presensi'],['notulen','Notulen'],['tindaklanjut','Tindak Lanjut'],['dokumen','Dokumen']].map(function(t){
          return '<button class="tab'+(view.tab===t[0]?' on':'')+'" data-room-tab="'+t[0]+'">'+t[1]+'</button>';
        }).join('')+'</div>';
      if (view.tab==='presensi') h += roomPresensi(m, s, w);
      else if (view.tab==='notulen') h += roomNotulen(m);
      else if (view.tab==='tindaklanjut') h += roomTugas(m);
      else h += roomDokumen(m);
      return h;
    }

    function roomPresensi(m, s, w){
      var h = '';
      if (m.status==='berlangsung'){
        h += '<button class="btn btn-pri btn-block qr-toggle" id="btnQrToggle">'+(qrVisible? IC.eyeOff+' Sembunyikan QR Presensi' : IC.eye+' Tampilkan QR Presensi')+'</button>'+
          '<p class="small muted" style="text-align:right;margin:6px 0 0">'+(qrVisible?'QR presensi tampil':'QR presensi tersembunyi')+'</p>';
        if (qrVisible){
          var c = ensureCode(m);
          h += '<div class="card qr-box"><h3>Presensi peserta</h3>'+
            '<p class="small muted">QR berisi ID rapat + kode sesi yang <b>berputar tiap 60 detik</b> di perangkat pengelola ini. Peserta presensi lewat <b>Mode Kios</b> di perangkat ini: pilih nama, isi kode, tanda tangan — tercatat anti-ganda dengan cap Terlambat otomatis. Versi statis tidak punya tautan presensi publik lintas perangkat.</p>'+
            '<div class="qrwrap"><div id="qrCanvas"></div></div>'+
            '<div class="qr-code" id="qrCodeTxt">'+esc(c.val)+'</div>'+
            '<div class="small muted">Kode berganti dalam <b id="qrCount">60</b> detik</div>'+
            '<div class="qr-prog"><i id="qrBar" style="width:100%"></i></div>'+
            '<p class="small muted" style="margin-top:12px">Presensi dibuka '+w.fmt(w.open)+' · tepat waktu sampai '+w.fmt(w.onTimeUntil)+' · ditutup '+w.fmt(w.close)+'<br/>Status jendela: <b>'+w.status+'</b></p>'+

      } else if (m.status==='dijeda'){
        h += '<div class="note note-amber mt"><b>Rapat sedang dijeda</b> ('+esc(m.pauseReason||'')+'). Presensi ditolak selama jeda — lanjutkan rapat untuk membuka presensi lagi.</div>';
      } else if (m.status==='terjadwal'){
        h += '<div class="note note-teal mt">Presensi dibuka setelah rapat dimulai. Jendela: dibuka '+w.fmt(w.open)+', tepat waktu sampai '+w.fmt(w.onTimeUntil)+', ditutup '+w.fmt(w.close)+'.</div>';
      }
      /* Rekap berwarna */
      h += '<div class="card"><h3 style="margin-bottom:12px">Rekap kehadiran</h3><div class="stat-grid">'+
        '<div class="stat st-hadir"><div class="n">'+s.hadir+'</div><div class="l">Hadir</div></div>'+
        '<div class="stat st-belum"><div class="n">'+s.belum+'</div><div class="l">Belum</div></div>'+
        '<div class="stat st-izin"><div class="n">'+s.izin+'</div><div class="l">Izin</div></div>'+
        '<div class="stat st-alpa"><div class="n">'+s.alpa+'</div><div class="l">Alpa</div></div>'+
        (s.terlambat? '<div class="stat st-terlambat"><div class="n">'+s.terlambat+'</div><div class="l">Terlambat</div></div>':'')+
        '</div></div>';
      /* Bagikan undangan */
      h += '<div class="card"><h3>Bagikan Undangan</h3><p class="small muted">'+m.attendees.length+' peserta terundang · '+m.attendees.filter(function(a){return a.sharedAt;}).length+' sudah ditandai dibagikan. SesiRapat versi statis tidak mengirim notifikasi — bagikan teks undangan lewat grup WhatsApp/Telegram Anda.</p>'+
        '<div class="rowflex"><button class="btn btn-teal btn-sm" id="btnShareWA">WhatsApp</button><button class="btn btn-soft btn-sm" id="btnShareTG">Telegram</button><button class="btn btn-ghost btn-sm" id="btnCopyInvite">Salin teks</button><button class="btn btn-ghost btn-sm" id="btnMarkShared">Tandai semua dibagikan</button></div></div>';
      /* Tamu */
      if (m.status==='berlangsung' && canManage()){
        h += '<div class="card"><h3>Presensi Tamu / Peserta Baru</h3><p class="small muted">Untuk peserta yang tidak ada di daftar undangan.</p>'+
          '<div class="grid2"><div class="field"><label for="gNama">Nama *</label><input class="inp" id="gNama"/></div>'+
          '<div class="field"><label for="gNip">NIP (opsional)</label><input class="inp" id="gNip"/></div>'+
          '<div class="field"><label for="gJab">Jabatan (opsional)</label><input class="inp" id="gJab"/></div>'+
          '<div class="field"><label for="gUnit">Unit (opsional)</label><input class="inp" id="gUnit"/></div></div>'+
          '<label class="check mb"><input type="checkbox" id="gSave"/><span><span class="t">Simpan ke Buku Peserta</span></span></label>'+
          '<button class="btn btn-pri" id="btnGuest">Catat Hadir (Tamu)</button></div>';
      }
      /* Papan hadir */

      if (!m.attendees.length) h += '<p class="muted">Belum ada undangan di rapat ini.</p>';

        h += '<div class="arow"><div class="who"><span class="nm">'+esc(a.nama)+'</span> '+(a.guest?'<span class="tag tag-teal">Tamu</span>':'')+'<br/><span class="sub">'+esc(a.jabatan||'')+(a.unit?' · '+esc(a.unit):'')+'</span><br/>'+statusChip(a)+

          ) : '')+
          (canManage() && m.status!=='selesai' ? '<button class="btn btn-soft btn-sm" data-att-izin="'+i+'">Izin</button><button class="btn btn-danger btn-sm" data-att-alpa="'+i+'">Alpa</button>' : '')+
          '</div></div>';
      });

          '<div class="field"><label>Tanda tangan</label><canvas class="sig-pad" id="kSig" width="560" height="150"></canvas><div class="rowflex mt"><button class="btn btn-ghost btn-sm" id="kSigClear">Hapus tanda tangan</button></div></div>'+
          '<div class="rowflex"><button class="btn btn-ghost grow" onclick="closeModal()">Batal</button><button class="btn btn-teal grow" id="kSubmit">Catat Kehadiran</button></div>';
      }
      openModal(h);
      var cv = $('#kSig');
      if (cv){
        var ctx = cv.getContext('2d'); ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.strokeStyle = '#23233a';
        var drawing = false, has = false;
        function pos(e){ var r = cv.getBoundingClientRect(); var t = e.touches? e.touches[0] : e; return { x: (t.clientX-r.left)*(cv.width/r.width), y: (t.clientY-r.top)*(cv.height/r.height) }; }
        function start(e){ drawing = true; var p = pos(e); ctx.beginPath(); ctx.moveTo(p.x,p.y); e.preventDefault(); }
        function move(e){ if (!drawing) return; var p = pos(e); ctx.lineTo(p.x,p.y); ctx.stroke(); has = true; e.preventDefault(); }
        function end(){ drawing = false; }
        cv.addEventListener('pointerdown', start); cv.addEventListener('pointermove', move); window.addEventListener('pointerup', end);
        cv.addEventListener('touchstart', start, {passive:false}); cv.addEventListener('touchmove', move, {passive:false}); cv.addEventListener('touchend', end);
        $('#kSigClear').addEventListener('click', function(){ ctx.clearRect(0,0,cv.width,cv.height); has=false; });
        $('#kSubmit').addEventListener('click', function(){
          var idx = +$('#kNama').value; var a = m.attendees[idx];
          if (!a) return;
          if (a.status==='hadir'){ toast('Peserta ini sudah tercatat hadir (anti-ganda).'); return; }
          var kode = $('#kKode').value.trim().toUpperCase();
          var cur = ensureCode(m);
          if (kode !== cur.val){ toast('Kode salah atau sudah berganti. Minta kode terbaru ke pengelola.'); return; }
          if (!has){ toast('Tanda tangan dulu ya.'); return; }
          recordAttendance(m, a, cv.toDataURL('image/png'));
          closeModal(); toast(a.nama+' tercatat hadir'+(a.late?' (Terlambat '+a.jam+')':' pukul '+a.jam)+'.');
          render();
        });
      }
    }

    function geminiCompose(m, transcript, done){
      var key = DB.settings.geminiKey;
      var models = ['gemini-3.5-flash-lite','gemini-3.1-flash-lite','gemini-3.8-flash'];
      var pref = DB.settings.geminiModel || models[0];
      models = [pref].concat(models.filter(function(x){ return x!==pref; }));
      var prompt = 'Kamu notulis rapat. Rapikan transkrip rapat berikut menjadi notulensi Bahasa Indonesia yang rapi.\nJudul: '+m.judul+'\nAgenda: '+(m.agenda||'-')+'\n\nTRANSKRIP:\n'+transcript+'\n\nBalas HANYA dalam format:\nPEMBAHASAN:\n<isi pembahasan, boleh beberapa paragraf>\nKEPUTUSAN:\n<daftar keputusan, satu per baris diawali "- ">\nTINDAK_LANJUT:\n<daftar tindak lanjut bila ada, format "- Tugas | Penanggung jawab | Tenggat", bila tidak ada tulis "-">';
      function attempt(i){
        if (i>=models.length){ done(null, 'Gemini tidak terjangkau (semua model gagal). Periksa kunci & koneksi, atau susun manual.'); return; }
        fetch('https://generativelanguage.googleapis.com/v1beta/models/'+models[i]+':generateContent', {
          method:'POST', headers:{'Content-Type':'application/json','x-goog-api-key':key},
          body: JSON.stringify({ contents:[{ parts:[{ text: prompt }] }] })
        }).then(function(r){
          if (r.status===503){ return r.json().catch(function(){return{};}).then(function(){ attempt(i); }); }
          if (!r.ok) throw new Error('HTTP '+r.status);
          return r.json();
        }).then(function(j){
          if (!j) return;
          var txt = j && j.candidates && j.candidates[0] && j.candidates[0].content && j.candidates[0].content.parts.map(function(p){ return p.text||''; }).join('') || '';
          if (!txt) throw new Error('kosong');
          done(txt, null, models[i]);
        }).catch(function(){ attempt(i+1); });
      }
      attempt(0);
    }
    function parseAi(txt){
      function grab(tag, next){
        var a = txt.indexOf(tag); if (a<0) return '';
        var s = a + tag.length; var e = next ? txt.indexOf(next, s) : -1;
        return txt.slice(s, e<0? undefined : e).trim();
      }
      return { pembahasan: grab('PEMBAHASAN:', 'KEPUTUSAN:'), keputusan: grab('KEPUTUSAN:', 'TINDAK_LANJUT:'), tl: grab('TINDAK_LANJUT:', null) };
    }

    var importRows = null;
    function parseImport(file){
      var rd = new FileReader();
      rd.onload = function(){
        try {
          var wb = XLSX.read(new Uint8Array(rd.result), { type: 'array' });
          var ws = wb.Sheets[wb.SheetNames[0]];
          var rows = XLSX.utils.sheet_to_json(ws, { defval: '' });
          importRows = rows.map(function(r){
            function pick(){ for (var i=0;i<arguments.length;i++){ for (var k in r){ if (k.toLowerCase().trim()===arguments[i]) return String(r[k]).trim(); } } return ''; }
            return { nama: pick('nama','name','nama lengkap'), nip: pick('nip','nik'), jabatan: pick('jabatan','posisi'), unit: pick('unit','bagian','instansi'), kelompok: pick('kelompok','grup','group') };
          }).filter(function(x){ return x.nama; });
          var pv = $('#importPreview');
          if (!importRows.length){ pv.innerHTML = '<div class="note note-amber">Tidak ada baris dengan kolom Nama yang terbaca.</div>'; return; }
          pv.innerHTML = '<p class="small"><b>'+importRows.length+' baris</b> terbaca. Pratinjau 5 baris pertama:</p>'+
            '<div class="doc-preview" style="padding:10px"><table><thead><tr><th>Nama</th><th>NIP</th><th>Jabatan</th><th>Unit</th><th>Kelompok</th></tr></thead><tbody>'+
            importRows.slice(0,5).map(function(r){ return '<tr><td>'+esc(r.nama)+'</td><td>'+esc(r.nip)+'</td><td>'+esc(r.jabatan)+'</td><td>'+esc(r.unit)+'</td><td>'+esc(r.kelompok)+'</td></tr>'; }).join('')+
            '</tbody></table></div><button class="btn btn-pri mt" id="btnDoImport">Impor '+importRows.length+' peserta</button>';
          $('#btnDoImport').addEventListener('click', function(){
            var added = 0, skipped = 0;
            importRows.forEach(function(r){
              var ex = DB.participants.filter(function(p){ return p.nama.toLowerCase()===r.nama.toLowerCase(); })[0];
              var gs = r.kelompok.split(/[;,]/).map(function(s){ return s.trim(); }).filter(Boolean);
              if (ex){ gs.forEach(function(g){ if ((ex.groups||[]).indexOf(g)<0) ex.groups.push(g); }); skipped++; }
              else { DB.participants.push({ id: uid(), nama: r.nama, nip: r.nip, jabatan: r.jabatan, unit: r.unit, groups: gs }); added++; }
            });
            save(); importRows = null;
            toast('Impor selesai: '+added+' ditambahkan, '+skipped+' nama ganda dilewati (kelompok digabung).');
            render();
          });
        } catch(e){ $('#importPreview').innerHTML = '<div class="note note-amber">Berkas tidak bisa dibaca: '+esc(e.message)+'</div>'; }
      };
      rd.readAsArrayBuffer(file);
    }

    /* ================= BINDING ================= */
    function bindView(){
      $$('[data-go]').forEach(function(b){ b.addEventListener('click', function(e){ e.preventDefault(); var v = b.getAttribute('data-go'); if (v==='buat'){ newWiz(); } go(v); }); });
      $$('[data-open-meeting]').forEach(function(b){ b.addEventListener('click', function(){ go('ruang', { meetingId: b.getAttribute('data-open-meeting'), tab: 'presensi' }); }); });
      $$('[data-role]').forEach(function(b){ b.addEventListener('click', function(){ DB.settings.role = b.getAttribute('data-role'); save(); toast('Peran aktif: '+DB.settings.role); render(); }); });
      $$('[data-share-rekap]').forEach(function(b){ b.addEventListener('click', function(){ shareRekap(getMeeting(b.getAttribute('data-share-rekap'))); }); });
      $$('[data-goto-task]').forEach(function(b){ b.addEventListener('click', function(){ go('tugas'); }); });
      var qs = $('#qSearch');
      if (qs) qs.addEventListener('input', function(){ view.search = qs.value; var pos = qs.selectionStart; render(); var nq = $('#qSearch'); if (nq){ nq.focus(); nq.setSelectionRange(pos,pos); } });

      /* --- Wizard --- */
      if (view.name==='buat' && wiz){
        if (wiz.step===1){
          ['wJudul','wTgl','wMulai','wSelesai','wTempat','wPimpinan','wNotulis','wAgenda'].forEach(function(id){
            var el = $('#'+id); if (el) el.addEventListener('change', wizCollect);
          });
        }
        if (wiz.step===2){
          $$('[data-wiz-pick]').forEach(function(c){ c.addEventListener('change', function(){ if (c.checked) wiz.picked[c.getAttribute('data-wiz-pick')]=true; else delete wiz.picked[c.getAttribute('data-wiz-pick')]; }); });
          $$('[data-wiz-group]').forEach(function(b){ b.addEventListener('click', function(){
            var g = b.getAttribute('data-wiz-group');
            DB.participants.forEach(function(p){ if ((p.groups||[]).indexOf(g)>-1) wiz.picked[p.id]=true; });
            render();
          }); });
          var bt = $('#btnWizTamu');
          if (bt) bt.addEventListener('click', function(){
            var v = $('#wTamu').value.trim(); if (!v) return;
            wiz.guests = wiz.guests||[]; wiz.guests.push(v); render();
          });
          $$('[data-wiz-untamu]').forEach(function(a){ a.addEventListener('click', function(e){ e.preventDefault(); wiz.guests.splice(+a.getAttribute('data-wiz-untamu'),1); render(); }); });
        }
        var nx = $('#wizNext');
        if (nx) nx.addEventListener('click', function(){
          wizCollect();
          if (wiz.step===1 && !wiz.judul){ toast('Judul rapat wajib diisi.'); return; }
          wiz.step++; render();
        });
        var bk = $('#wizBack');
        if (bk) bk.addEventListener('click', function(){ wizCollect(); wiz.step--; render(); });
        var cr = $('#wizCreate');
        if (cr) cr.addEventListener('click', function(){
          wizCollect();
          var atts = [];
          Object.keys(wiz.picked).forEach(function(pid){ var p = getParticipant(pid); if (p) atts.push({ pid: p.id, nama: p.nama, nip: p.nip||'', jabatan: p.jabatan||'', unit: p.unit||'', status: 'belum', late:false, jam:'', sig:'', guest:false, sharedAt:'' }); });
          (wiz.guests||[]).forEach(function(g){ atts.push({ pid:'', nama: g, nip:'', jabatan:'', unit:'', status:'belum', late:false, jam:'', sig:'', guest:true, sharedAt:'' }); });
          var m = { id: uid(), judul: wiz.judul, tanggal: wiz.tanggal, mulai: wiz.mulai, selesai: wiz.selesai, tempat: wiz.tempat, pimpinan: wiz.pimpinan, notulis: wiz.notulis, agenda: wiz.agenda,
            tolerance: wiz.tolerance, status: 'terjadwal', attendees: atts, minutes: { transcript:'', pembahasan:'', keputusan:'', approved:false, approvedBy:'' },
            pauseLog: [], pauseReason: '', code: null, recap: null, createdAt: todayStr() };
          DB.meetings.unshift(m); save(); wiz = null;
          toast('Rapat dibuat: '+m.judul);
          go('ruang', { meetingId: m.id, tab: 'presensi' });
        });
      }

      /* --- Ruang rapat --- */
      if (view.name==='ruang'){
        var m = getMeeting(view.meetingId);
        if (!m) return;
        $$('[data-room-tab]').forEach(function(b){ b.addEventListener('click', function(){ view.tab = b.getAttribute('data-room-tab'); stopQrTimer(); render(); }); });
        var bs = $('#btnStart'); if (bs) bs.addEventListener('click', function(){ m.status='berlangsung'; ensureCode(m); save(); toast('Rapat dimulai. Presensi dibuka.'); render(); });
        var bp = $('#btnPause'); if (bp) bp.addEventListener('click', function(){
          openModal('<h2>Jeda Rapat</h2><div class="sub">Presensi ditolak selama jeda. Pilih alasan:</div>'+
            ['Makan siang','Coffee break','Istirahat','Lainnya'].map(function(r){ return '<button class="btn btn-ghost btn-block" style="margin-bottom:8px" data-pause-reason="'+r+'">'+r+'</button>'; }).join('')+
            '<button class="btn btn-soft btn-block" onclick="closeModal()">Batal</button>');
          $$('[data-pause-reason]').forEach(function(b){ b.addEventListener('click', function(){
            m.status='dijeda'; m.pauseReason=b.getAttribute('data-pause-reason');
            m.pauseLog = m.pauseLog||[]; m.pauseLog.push({ reason: m.pauseReason, from: nowTime(), to: '' });
            save(); closeModal(); render();
          }); });
        });
        var br = $('#btnResume'); if (br) br.addEventListener('click', function(){
          m.status='berlangsung'; if (m.pauseLog&&m.pauseLog.length) m.pauseLog[m.pauseLog.length-1].to = nowTime();
          m.pauseReason=''; save(); render();
        });
        var be = $('#btnEnd'); if (be) be.addEventListener('click', function(){
          askDialog('Akhiri rapat?', 'Peserta yang belum hadir akan dicatat Alpa dan rekap otomatis dibuat. Jendela presensi yang masih terbuka tetap ditutup sekarang.', 'Akhiri & buat rekap', function(){
            endMeeting(m); render();
          });
        });
        var em = $('#btnEditMeeting'); if (em) em.addEventListener('click', function(){ editMeetingModal(m); });
        var dm = $('#btnDelMeeting'); if (dm) dm.addEventListener('click', function(){
          askDialog('Hapus rapat ini?', 'Rapat, presensi, dan notulennya akan dihapus dari perangkat ini. Dokumen terbit tetap ada di Arsip.', 'Hapus rapat', function(){
            DB.meetings = DB.meetings.filter(function(x){ return x.id!==m.id; });
            DB.tasks = DB.tasks.filter(function(x){ return x.meetingId!==m.id; });
            save(); go('rapat');
          });
        });
        /* Presensi tab */
        var qt = $('#btnQrToggle'); if (qt) qt.addEventListener('click', function(){ qrVisible = !qrVisible; render(); });
        if (view.tab==='presensi' && qrVisible && m.status==='berlangsung'){
          var c = ensureCode(m);
          var qEl = $('#qrCanvas');
          if (qEl && typeof qrcode !== 'undefined'){
            try { var qr = qrcode(0, 'M'); qr.addData('SESIRAPAT:'+m.id+':'+c.val); qr.make(); qEl.innerHTML = qr.createSvgTag({ cellSize: 5, margin: 4, scalable: true }); }
            catch(e){ qEl.innerHTML = '<span class="small muted">QR tidak tergambar — gunakan kode di bawah.</span>'; }
          } else if (qEl) {
            qEl.innerHTML = '<span class="small muted">Pustaka QR belum termuat (perlu internet sekali untuk unduh awal) — gunakan kode 6 karakter di bawah.</span>';
          }
          stopQrTimer();
          qrTimer = setInterval(function(){
            var cur = getMeeting(m.id); if (!cur || view.name!=='ruang' || view.tab!=='presensi'){ stopQrTimer(); return; }
            var left = Math.max(0, Math.ceil((cur.code.exp - Date.now())/1000));
            var ct = $('#qrCount'), cb = $('#qrBar'), cd = $('#qrCodeTxt');
            if (ct) ct.textContent = left;
            if (cb) cb.style.width = (left/60*100)+'%';
            if (left<=0){ ensureCode(cur); render(); }
            else if (cd && cd.textContent !== cur.code.val){ cd.textContent = cur.code.val; }
          }, 500);
        }
        var kk = $('#btnKiosk'); if (kk) kk.addEventListener('click', function(){ openKiosk(m); });
        $$('[data-att-hadir]').forEach(function(b){ b.addEventListener('click', function(){ var a = m.attendees[+b.getAttribute('data-att-hadir')]; recordAttendance(m, a, ''); toast(a.nama+' tercatat hadir'+(a.late?' (Terlambat)':'')+'.'); render(); }); });
        $$('[data-att-ulang]').forEach(function(b){ b.addEventListener('click', function(){ var a = m.attendees[+b.getAttribute('data-att-ulang')]; a.status='belum'; a.late=false; a.jam=''; a.sig=''; save(); render(); }); });
        $$('[data-att-izin]').forEach(function(b){ b.addEventListener('click', function(){ var a = m.attendees[+b.getAttribute('data-att-izin')]; if (a.status!=='hadir'){ a.status='izin'; save(); render(); } }); });
        $$('[data-att-alpa]').forEach(function(b){ b.addEventListener('click', function(){ var a = m.attendees[+b.getAttribute('data-att-alpa')]; if (a.status!=='hadir'){ a.status='alpa'; save(); render(); } }); });
        var sw = $('#btnShareWA'); if (sw) sw.addEventListener('click', function(){ window.open('https://wa.me/?text='+encodeURIComponent(inviteText(m)), '_blank'); });

    /* ---------- Dikte & tes mikrofon ---------- */
    function setMicStatus(t){ var el = $('#micStatus'); if (el) el.textContent = t; }
    function startMeter(stream){
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        var src = audioCtx.createMediaStreamSource(stream);
        var an = audioCtx.createAnalyser(); an.fftSize = 256; src.connect(an);
        var data = new Uint8Array(an.frequencyBinCount);
        function tick(){
          an.getByteFrequencyData(data);
          var sum = 0; for (var i=0;i<data.length;i++) sum += data[i];
          var lvl = Math.min(100, Math.round(sum/data.length*2.2));
          var bar = $('#micMeter'); if (bar) bar.style.width = lvl+'%';
          meterRAF = requestAnimationFrame(tick);
        }
        tick();
      } catch(e){ /* meter opsional */ }
    }
    function testMic(){
      var perm = $('#micPerm');
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ toast('Browser ini tidak mendukung akses mikrofon.'); return; }
      navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream){
        if (perm) perm.textContent = 'Izin mic: Diizinkan';
        setMicStatus('Mikrofon terdeteksi — bicara untuk melihat meteran level suara, lalu ketuk Tes selesai otomatis.');
        startMeter(stream);
        setTimeout(function(){ stream.getTracks().forEach(function(t){ t.stop(); }); if (meterRAF) cancelAnimationFrame(meterRAF); if (audioCtx){ audioCtx.close(); audioCtx=null; } var b=$('#micMeter'); if (b) b.style.width='0'; setMicStatus('Tes mikrofon selesai. Ketuk mikrofon besar untuk mulai dikte.'); }, 4000);
      }).catch(function(err){
        if (perm) perm.textContent = 'Izin mic: '+(err && err.name==='NotAllowedError' ? 'Ditolak' : 'Tidak ada mic / error');
        toast('Izin mikrofon ditolak. Buka ikon gembok di bilah alamat › Izin situs › Mikrofon › Izinkan, lalu muat ulang.');
      });
    }
    function toggleDictation(m){
      if (recogOn){ stopRec(); setMicStatus('Dikte berhenti. Transkrip tersimpan — silakan sunting.'); var b=$('#btnMic'); if (b) b.classList.remove('rec'); m.minutes.transcript = $('#nTranscript').value; save(); return; }
      var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR){ toast('Browser ini tidak mendukung dikte suara. Ketik/tempel transkrip secara manual.'); return; }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ toast('Akses mikrofon tidak tersedia di browser ini.'); return; }
      navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream){
        micStream = stream; startMeter(stream);
        var perm = $('#micPerm'); if (perm) perm.textContent = 'Izin mic: Diizinkan';
        recog = new SR(); recog.lang = 'id-ID'; recog.continuous = true; recog.interimResults = true;
        var finalTxt = $('#nTranscript').value ? $('#nTranscript').value.replace(/\s+$/,'')+' ' : '';
        recog.onresult = function(ev){
          var interim = '';
          for (var i=ev.resultIndex;i<ev.results.length;i++){
            if (ev.results[i].isFinal) finalTxt += ev.results[i][0].transcript + ' ';
            else interim += ev.results[i][0].transcript;
          }
          var ta = $('#nTranscript'); if (ta) ta.value = finalTxt + interim;
        };
        recog.onerror = function(ev){
          var msg = { 'not-allowed':'Izin mikrofon ditolak — izinkan lewat ikon gembok › Izin situs › Mikrofon.', 'no-speech':'Tidak ada suara terdeteksi.', 'audio-capture':'Mikrofon tidak ditemukan.', 'network':'Dikte butuh koneksi internet di browser ini.' }[ev.error] || ('Dikte berhenti: '+ev.error);
          setMicStatus(msg); recogOn = false; var b2 = $('#btnMic'); if (b2) b2.classList.remove('rec');
        };
        recog.onend = function(){
          if (recogOn){ try { recog.start(); } catch(e){ recogOn=false; } }
          var ta = $('#nTranscript'); var mm = getMeeting(m.id); if (ta && mm){ mm.minutes.transcript = ta.value; save(); }
        };
        recog.start(); recogOn = true;
        var b = $('#btnMic'); if (b) b.classList.add('rec');
        setMicStatus('Mendengarkan… bicara sekarang. Ketuk lagi untuk berhenti.');
      }).catch(function(){
        toast('Izin mikrofon ditolak. Buka ikon gembok › Izin situs › Mikrofon › Izinkan, lalu coba lagi.');
      });
    }

        var d = diffDays(t, m.tanggal); var now = new Date(); var start = dtOf(m);

    $('#btnHdrSet').innerHTML = IC.gear;
    $('#btnHdrPeserta').addEventListener('click', function(){ if (!canManage() && !isAdmin()){ /* peserta boleh dilihat semua peran */ } go('peserta'); });
    $('#btnHdrTemplate').addEventListener('click', function(){ go('template'); });
    $('#btnHdrSet').addEventListener('click', function(){ go('pengaturan'); });

    $('#navRapat').innerHTML = IC.cal+'<span>Rapat</span>';
    $('#navTugas').innerHTML = IC.list+'<span>Tindak Lanjut</span>';
    $('#navArsip').innerHTML = IC.archive+'<span>Arsip</span>';
    $('#fabMain').innerHTML = IC.qr.replace('width="20" height="20"','width="27" height="27"');
    $$('.nav-it').forEach(function(b){ b.addEventListener('click', function(){ go(b.getAttribute('data-nav')); }); });
    $('#fabMain').addEventListener('click', function(){
      var live = DB.meetings.filter(function(m){ return m.status==='berlangsung'||m.status==='dijeda'; })[0];
      if (live){ qrVisible = true; go('ruang', { meetingId: live.id, tab: 'presensi' }); }
      else if (canManage()){ newWiz(); go('buat'); }
      else go('rapat');
    });
    function updateGreet(){ $('#hdrGreet').textContent = greeting() + (DB.settings.userName ? ', '+DB.settings.userName : ''); }
    updateGreet();

    /* ---------- PWA: service worker + install ---------- */
    if ('serviceWorker' in navigator){
      window.addEventListener('load', function(){
        navigator.serviceWorker.register('./sw.js').catch(function(){ /* SW opsional di pratinjau */ });
      });
    }
    var deferredInstall = null;
    window.addEventListener('beforeinstallprompt', function(e){
      e.preventDefault(); deferredInstall = e;
      if (!sessionStorage.getItem('sr_install_dismissed')) $('#installBanner').classList.add('show');
      var st = $('#installState'); if (st) st.textContent = 'Tombol Install tersedia.';
    });
    window.addEventListener('appinstalled', function(){
      deferredInstall = null; $('#installBanner').classList.remove('show');
      toast('SesiRapat terpasang di layar utama.');
    });
    function runInstallPrompt(){
      if (deferredInstall){
        deferredInstall["prompt"]();
        deferredInstall.userChoice.then(function(c){ if (c.outcome==='accepted') $('#installBanner').classList.remove('show'); deferredInstall = null; });
      } else {
        toast('Prompt install belum tersedia. Di Chrome HP: menu ⋮ › "Tambahkan ke Layar Utama".');
        var st = $('#installState'); if (st) st.textContent = 'Gunakan menu ⋮ Chrome › Tambahkan ke Layar Utama.';
      }
    }
    $('#btnInstall').addEventListener('click', runInstallPrompt);
    $('#btnInstallX').addEventListener('click', function(){ $('#installBanner').classList.remove('show'); try { sessionStorage.setItem('sr_install_dismissed','1'); } catch(e){} });

    /* ---------- Init ---------- */
    render();
    checkReminders();
    setInterval(checkReminders, 60000);
    </script>
  </body>
</html>
