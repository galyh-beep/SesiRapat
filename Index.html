<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif; background: #F4F4FA; color: #191932; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 16px 14px 150px; }
  /* Kepala aplikasi: putih bersih seperti versi Muse — tanpa pita
     indigo tua; logo + nama + keterangan tampil di atas latar terang
     dengan garis bawah tipis saja. */
  header.top { background: #fff; color: #191932; padding: 14px 16px; border-bottom: 1px solid #E3E3F0; }
  header.top .brand { font-size: 20px; font-weight: 800; letter-spacing: .2px; }
  header.top .brandrow { display: flex; align-items: center; gap: 12px; }
  header.top img.applogo { width: 46px; height: 46px; border-radius: 13px; flex: none; box-shadow: 0 2px 8px rgba(30,27,75,.18); }
  header.top .sub { font-size: 12.5px; color: #5B5B78; margin-top: 2px; }
  nav.tabs { display: flex; gap: 8px; margin: 14px 0 4px; flex-wrap: wrap; }
  nav.tabs button { border: 1px solid #D9D9EE; background: #fff; color: #3730A3; font-weight: 700; padding: 9px 14px; border-radius: 999px; cursor: pointer; font-size: 14px; }
  nav.tabs button.active { background: #4F46E5; border-color: #4F46E5; color: #fff; }
  .card { background: #fff; border-radius: 16px; box-shadow: 0 1px 3px rgba(30,27,75,.08); padding: 16px; margin-top: 12px; }
  .card.lewat { border: 2px solid #E8A09C; }
  .card.segera { border: 2px solid #F2D38A; }
  .card h3 { margin: 0 0 6px; font-size: 16.5px; }
  .muted { color: #5B5B78; font-size: 13.5px; }
  .pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
  .pill.indigo { background: #EEF0FF; color: #4338CA; }
  .pill.teal { background: #E6F7F3; color: #0B7A67; }
  .pill.slate { background: #EFEFF5; color: #55556E; }
  .pill.amber { background: #FDF3E3; color: #9A6206; }
  .pill.red { background: #FDECEC; color: #B3261E; }
  .pill.blue { background: #E8F1FE; color: #1D4ED8; }
  button.btn { border: 0; cursor: pointer; font-weight: 700; border-radius: 12px; padding: 11px 16px; font-size: 14.5px; min-height: 44px; white-space: nowrap; max-width: 100%; }
  button.btn[disabled] { opacity: .55; cursor: wait; }
  .spin { display: inline-block; width: 14px; height: 14px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: putar .7s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes putar { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2.4s; } }
  button.btn.primary { background: #4F46E5; color: #fff; }
  button.btn.teal { background: #0D9488; color: #fff; }
  button.btn.ghost { background: #EEF0FF; color: #4338CA; }
  button.btn.danger { background: #FDECEC; color: #B3261E; }
  button.btn:disabled { opacity: .55; cursor: default; }
  button.btn.small { padding: 7px 11px; min-height: 36px; font-size: 13px; border-radius: 10px; }
  button.btn.danger.small { border-radius: 999px; padding: 6px 14px; min-height: 34px; }
  input, select, textarea { width: 100%; border: 1px solid #D9D9EE; border-radius: 12px; padding: 11px 12px; font-size: 15px; font-family: inherit; background: #fff; color: #191932; }
  textarea { min-height: 110px; resize: vertical; }
  label.lbl { display: block; font-size: 13px; font-weight: 700; color: #5B5B78; margin: 12px 0 5px; }
  /* Kotak centang (Fase 5.2): aturan input umum di atas memberi
     width:100% ke SEMUA input — termasuk checkbox — sehingga kotak
     centang melebar selebar baris dan kotaknya tampil jauh di
     tengah, terpisah jauh dari teks labelnya (laporan Ardian pada
     "Aktifkan geofence untuk rapat ini"). Kini checkbox selalu
     berukuran tetap 20px, dan label pembungkusnya (.cek) berupa
     baris flex: kotak menempel di KIRI teks label dengan jarak
     10px yang wajar, sejajar vertikal, target ketuk 44px — persis
     pola versi Muse. Berlaku untuk semua checkbox: geofence,
     template aktif, dan semua tombol Pengingat & Telegram. */
  input[type="checkbox"] { width: 20px; height: 20px; padding: 0; margin: 0; flex: none; accent-color: #4F46E5; }
  label.cek { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; color: #191932; margin: 12px 0 6px; min-height: 44px; cursor: pointer; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } }
  .tblwrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.tbl th, table.tbl td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #ECECF5; vertical-align: top; }
  table.tbl td.email { overflow-wrap: anywhere; }
  table.tbl th.aksi, table.tbl td.aksi { width: 1%; white-space: nowrap; }
  table.tbl th { color: #5B5B78; font-size: 12px; text-transform: uppercase; letter-spacing: .4px; }
  .rowflex { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .err { background: #FDECEC; color: #B3261E; border-radius: 12px; padding: 10px 12px; font-size: 14px; margin-top: 12px; }
  .warnbox { background: #FDF3E3; color: #7A4E05; border-radius: 12px; padding: 10px 12px; font-size: 14px; margin-top: 12px; }
  .warnbox ol { margin: 6px 0 0; padding-left: 20px; }
  .warnbox li { margin: 3px 0; }
  /* Tombol mic dikte bundar besar (Fase 4.7): sama seperti versi Muse —
     lingkaran 96px sebagai pusat kontrol Notulen Studio. */
  .micwrap { display: flex; flex-direction: column; align-items: center; padding: 10px 0 2px; }
  button.btnmic { width: 96px; height: 96px; border-radius: 999px; border: 0; background: #4F46E5; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px rgba(79,70,229,.4); }
  button.btnmic:active { transform: scale(.95); }
  button.btnmic[disabled] { opacity: .55; cursor: default; }
  button.btnmic.rekam { background: #B3261E; animation: micdenyut 1.6s ease-in-out infinite; }
  @keyframes micdenyut { 0%,100% { box-shadow: 0 0 0 0 rgba(179,38,30,.45); } 50% { box-shadow: 0 0 0 14px rgba(179,38,30,0); } }
  @media (prefers-reduced-motion: reduce) { button.btnmic.rekam { animation: none; } }
  .micmeter { height: 12px; border-radius: 999px; background: #EFEFF5; overflow: hidden; flex: 1; min-width: 140px; }
  .micmeter > div { height: 100%; background: #0D9488; border-radius: 999px; transition: width .08s linear; }
  .audiobar { height: 12px; border-radius: 999px; background: #EFEFF5; overflow: hidden; margin-top: 10px; }
  .audiobar > div { height: 100%; background: #0D9488; border-radius: 999px; transition: width .4s ease; }
  .okbox { background: #E6F7F3; color: #0B7A67; border-radius: 12px; padding: 10px 12px; font-size: 14px; margin-top: 12px; font-weight: 600; }
  .qrbox { text-align: center; }
  .qrbox canvas { background: #fff; border-radius: 12px; }
  .bigcode { font-family: monospace; font-size: 30px; font-weight: 800; letter-spacing: .25em; color: #1E1B4B; }
  /* Ringkasan kehadiran kartu QR (Fase 5.3 — disamakan dengan versi
     Muse): bukan lagi baris chip teks polos, melainkan grid KARTU
     rekap — satu kartu per keterangan dengan angka besar berwarna
     sesuai status (Hadir hijau, Belum gelap, Izin biru, Alpa merah,
     Terlambat kuning tua bila ada). Grid 4 kolom; kelas .lima
     memakai 5 kolom saat kartu Terlambat ikut tampil, sama seperti
     grid-cols-5 versi Muse. Tautan presensi stabil yang panjang
     juga dibungkus, tidak meluber. */
  .statgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 12px; }
  .statgrid.lima { grid-template-columns: repeat(5, 1fr); }
  .statcard { background: #FBFBFE; border: 1px solid #E3E3F0; border-radius: 16px; padding: 10px 4px; text-align: center; }
  .statcard .n { font-size: 24px; font-weight: 800; line-height: 1.1; }
  .statcard .l { font-size: 12px; font-weight: 600; color: #5B5B78; margin-top: 2px; }
  .qrbox .tautan { overflow-wrap: anywhere; }
  /* Bilah tombol tampil/sembunyikan QR (Fase 4.9): satu baris penuh
     yang rapi tepat di atas kartu QR — tombol membentang mengikuti
     lebar, teks status kecil yang konsisten duduk di kanannya; tidak
     lagi menempel longgar di kiri atas kartu. Fase 5.2: margin atas
     16px (sama seperti mt-4 versi Muse) supaya bilah ini TIDAK
     menempel ke tab seksi (Presensi/Notulen/Tindak Lanjut/Dokumen)
     yang duduk tepat di atasnya — sebelumnya hanya ada margin
     bawah sehingga bilah birunya mentok ke tab. */
  .qrtogglebar { display: flex; align-items: center; gap: 10px; margin-top: 16px; margin-bottom: 10px; }
  .qrtogglebar .btn { flex: 1 1 auto; }
  .qrstatus { font-size: 12.5px; font-weight: 700; color: #5B5B78; white-space: nowrap; }
  /* Bilah kemajuan hitung mundur kode (Fase 4.9): bergerak mulus
     mengikuti sisa detik dari tenggat token (transisi linear). */
  .qrbar { height: 6px; border-radius: 999px; background: #E3E3F0; overflow: hidden; max-width: 260px; margin: 8px auto 2px; }
  .qrbar > div { height: 100%; background: #0D9488; border-radius: 999px; transition: width 1s linear; }
  .sektabs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px; }
  .sektabs button { border: 1px solid #D9D9EE; background: #fff; padding: 8px 13px; border-radius: 999px; font-weight: 700; cursor: pointer; font-size: 13.5px; color: #3730A3; }
  .sektabs button.active { background: #1E1B4B; color: #fff; border-color: #1E1B4B; }
  canvas.ttd { border: 2px dashed #B9B9D9; border-radius: 12px; background: #fff; touch-action: none; width: 100%; max-width: 420px; }
  a { color: #4F46E5; }
  .hidden { display: none; }
  /* --- Menu bawah + FAB kontekstual: sama seperti versi Muse --- */
  nav.bottomnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: rgba(255,255,255,.96); border-top: 1px solid #E3E3F0; padding-bottom: env(safe-area-inset-bottom); backdrop-filter: blur(6px); }
  .bn-grid { position: relative; display: grid; grid-template-columns: repeat(5, 1fr); max-width: 860px; margin: 0 auto; }
  .bn-tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 62px; padding: 8px 2px; background: none; border: 0; cursor: pointer; font-family: inherit; font-size: 11px; font-weight: 700; color: #5B5B78; }
  .bn-tab.active { color: #4F46E5; }
  .bn-tab svg { display: block; }
  .bn-center { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; min-height: 62px; padding: 8px 2px; }
  .fab { position: absolute; top: -26px; left: 50%; transform: translateX(-50%); width: 56px; height: 56px; border-radius: 999px; border: 0; cursor: pointer; color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 4px #F4F4FA; }
  .fab:active { transform: translateX(-50%) scale(.95); }
  .fab:disabled { opacity: .6; cursor: default; }
  .fab.create, .fab.followup { background: #4F46E5; box-shadow: 0 0 0 4px #F4F4FA, 0 10px 24px rgba(79,70,229,.45); }
  .fab.presensi { background: #0D9488; box-shadow: 0 0 0 4px #F4F4FA, 0 10px 24px rgba(13,148,136,.45); }
  .fab.export { background: #1E1B4B; box-shadow: 0 0 0 4px #F4F4FA, 0 10px 24px rgba(30,27,75,.45); }
  .fab-label { font-size: 11px; font-weight: 700; }
  .fab-label.create, .fab-label.followup { color: #4F46E5; }
  .fab-label.presensi { color: #0B7A67; }
  .fab-label.export { color: #1E1B4B; }
  /* --- Elemen Linimasa & halaman global --- */
  .sectitle { font-size: 17px; font-weight: 800; margin: 22px 0 4px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .sectitle button.link { background: none; border: 0; color: #4F46E5; font-weight: 700; font-size: 14px; cursor: pointer; font-family: inherit; padding: 6px 2px; }
  .hero-live { display: block; width: 100%; text-align: left; background: #0D9488; color: #fff; border: 0; border-radius: 22px; padding: 18px; margin-top: 16px; cursor: pointer; font-family: inherit; box-shadow: 0 8px 20px rgba(13,148,136,.35); }
  .hero-live .livepill { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.22); border-radius: 999px; padding: 4px 10px; font-size: 11.5px; font-weight: 800; letter-spacing: .4px; }
  .hero-live .dot { width: 8px; height: 8px; border-radius: 999px; background: #fff; }
  .hero-live .nama { display: block; font-size: 20px; font-weight: 800; margin-top: 8px; line-height: 1.25; }
  .hero-live .ket { display: block; font-size: 13.5px; opacity: .88; margin-top: 4px; }
  .hero-buat { display: block; width: 100%; text-align: left; background: #1E1B4B; color: #fff; border: 0; border-radius: 22px; padding: 18px; margin-top: 16px; cursor: pointer; font-family: inherit; box-shadow: 0 8px 20px rgba(30,27,75,.3); }
  .hero-buat .nama { display: block; font-size: 20px; font-weight: 800; }
  .hero-buat .ket { display: block; font-size: 13.5px; opacity: .78; margin-top: 4px; max-width: 480px; }
  .hero-buat .cta { display: inline-block; background: #fff; color: #1E1B4B; border-radius: 999px; padding: 8px 16px; font-weight: 800; font-size: 14px; margin-top: 12px; }
  /* Baris "Peran aktif:" di Linimasa — sama seperti versi Muse: pil
     peran solid indigo + keterangan hak per peran; di bawahnya baris
     kecil "Masuk sebagai …" (identitas sesi Google, hanya di
     Linimasa — tidak lagi tampil di setiap halaman). */
  .pill.solid { background: #4F46E5; color: #fff; }
  .peranrow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 14px; }
  .peranrow .peranket { font-size: 14px; font-weight: 700; }
  /* Keadaan kosong bergaris putus-putus (EmptyState versi Muse). */
  .kosong { border: 2px dashed #E3E3F0; border-radius: 22px; padding: 28px 20px; text-align: center; margin-top: 12px; }
  .kosong .t { font-weight: 700; margin: 0; font-size: 15.5px; }
  .kosong .muted { max-width: 400px; margin: 4px auto 0; font-size: 14px; }
  .searchbox { width: 100%; border: 1px solid #E3E3F0; border-radius: 999px; padding: 13px 20px; font-size: 15.5px; background: #fff; box-shadow: 0 1px 3px rgba(30,27,75,.06); margin-top: 14px; }
  .linkgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  @media (max-width: 560px) { .linkgrid { grid-template-columns: 1fr; } }
  .linkcard { background: #fff; border-radius: 16px; box-shadow: 0 1px 3px rgba(30,27,75,.08); padding: 16px; cursor: pointer; border: 0; text-align: left; font-family: inherit; width: 100%; }
  .linkcard .t { font-weight: 800; font-size: 15.5px; color: #191932; }
  .linkcard .d { display: block; font-size: 13px; color: #5B5B78; margin-top: 3px; line-height: 1.45; }
  a.btnlink { display: inline-flex; align-items: center; background: #EEF0FF; color: #4338CA; font-weight: 700; border-radius: 10px; padding: 7px 11px; min-height: 36px; font-size: 13px; text-decoration: none; white-space: nowrap; max-width: 100%; }
  .chiprow { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  .chiprow button { border: 1px solid #D9D9EE; background: #fff; padding: 8px 14px; border-radius: 999px; font-weight: 700; cursor: pointer; font-size: 13.5px; color: #3730A3; font-family: inherit; }
  .chiprow button.active { background: #4F46E5; color: #fff; border-color: #4F46E5; }
</style>

          '<div style="margin-top:8px"><button type="button" class="btn ghost small" id="p-lokasi">Periksa Lokasi Saya</button></div>' +
          '<div id="p-lokasi-hasil" style="margin-top:6px"></div></div>'
        : '') +
      (dijeda ? '<div class="err" style="background:#FDF3E3;color:#9A6206">⏸ Presensi sedang dijeda oleh penyelenggara. Silakan coba lagi setelah rapat dilanjutkan.</div>' : '') +
      '<label class="lbl" for="p-nama">Nama kamu</label>' +
      '<input id="p-nama" list="p-saran" autocomplete="name" placeholder="Ketik namamu — saran muncul dari daftar peserta">' +
      '<datalist id="p-saran">' + saran + '</datalist>' +
      '<p class="muted" style="margin:6px 0 0"><button type="button" class="btn ghost small" id="p-mode-tamu">Saya tidak ada di daftar — isi sebagai Tamu</button></p>' +
      '<div id="p-tamu-box" style="display:none">' +
      '<label class="lbl" for="p-nip">NIP / ID pegawai (opsional)</label><input id="p-nip" autocomplete="off">' +
      '<label class="lbl" for="p-jabatan">Jabatan (opsional)</label><input id="p-jabatan">' +
      '<label class="lbl" for="p-unit">Unit kerja (opsional)</label><input id="p-unit">' +
      '<p class="muted">Sebagai Tamu, kehadiranmu tercatat dengan label <b>Tamu</b>. Setelah presensi, penyelenggara dapat menyimpan datamu ke Buku Peserta.</p>' +
      '</div>';
    html += '<p class="muted" style="margin-top:12px">✓ Kamu membuka tautan presensi resmi rapat ini — kode presensi diambil otomatis oleh sistem di belakang layar, jadi kamu tidak perlu mengetik kode apa pun. Cukup isi nama + tanda tangan.</p>';
    html += '<label class="lbl">Tanda tangan (opsional — gambar di kotak ini)</label>' +
      '<canvas id="p-ttd" class="ttd" width="420" height="150"></canvas>' +
      '<div class="rowflex" style="margin-top:8px"><button type="button" class="btn ghost small" id="p-hapus-ttd">Hapus tanda tangan</button></div>' +
      '<div style="margin-top:14px"><button type="button" class="btn teal" id="p-kirim" data-muat="Mencatat…" style="width:100%"' + (dijeda || statusJ === 'segera' ? ' disabled' : '') + '>Catat Kehadiran Saya</button></div>' +
      '<div id="p-hasil"></div>' +
      '<p class="muted" style="margin-top:12px">Presensi tercatat atas nama yang kamu isi — pastikan namanya benar. Lewat batas tepat waktu, kehadiranmu tetap tercatat sebagai <b>Terlambat</b> beserta jam kedatangannya, selama rapat belum ditutup.</p></div>';
    app.innerHTML = html;
    // Fase 5 — geofence: lokasi peserta diperiksa di perangkat ini
    // untuk umpan balik langsung; penegakan jarak tetap di server
    // (presensiMandiri menghitung ulang dari lat/lng yang dikirim).
    var lokasiSaya = null;
    function jarakM(lat1, lon1, lat2, lon2) {
      var R = 6371000, rad = Math.PI / 180;
      var dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
      var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return Math.round(2 * R * Math.asin(Math.min(1, Math.sqrt(a))));
    }
    var btnLokasi = document.getElementById('p-lokasi');
    if (btnLokasi) btnLokasi.addEventListener('click', function () {
      var kotak = document.getElementById('p-lokasi-hasil');
      if (!navigator.geolocation) { kotak.innerHTML = 'Perangkat/browser ini tidak menyediakan lokasi (GPS).'; return; }
      kotak.innerHTML = '<span class="spin"></span> Mengambil lokasi…';
      navigator.geolocation.getCurrentPosition(function (pos) {
        lokasiSaya = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        var j = jarakM(lokasiSaya.lat, lokasiSaya.lng, res.geofence.lat, res.geofence.lng);
        kotak.innerHTML = j <= res.geofence.radius
          ? '✓ Lokasi kamu di dalam area rapat (±' + j + ' m dari titik rapat, radius ' + res.geofence.radius + ' m). Silakan catat kehadiran.'
          : '✗ Lokasi kamu di luar area rapat (±' + j + ' m dari titik rapat, radius ' + res.geofence.radius + ' m). Mendekatlah ke lokasi rapat lalu periksa lagi.';
      }, function (err) {
        kotak.innerHTML = 'Lokasi tidak bisa diambil: ' + esc(err && err.message ? err.message : 'izin lokasi ditolak') + '. Izinkan akses lokasi untuk situs ini di pengaturan browser, lalu coba lagi.';
      }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 });
    });
    aktifkanTtd(document.getElementById('p-ttd'));
    document.getElementById('p-hapus-ttd').addEventListener('click', function () { bersihkanTtd(document.getElementById('p-ttd')); });
    var modeTamu = false;
    document.getElementById('p-mode-tamu').addEventListener('click', function () {
      modeTamu = !modeTamu;
      document.getElementById('p-tamu-box').style.display = modeTamu ? '' : 'none';
      this.textContent = modeTamu ? 'Saya ada di daftar — pilih dari saran nama' : 'Saya tidak ada di daftar — isi sebagai Tamu';
    });
    document.getElementById('p-kirim').addEventListener('click', function () {
      var hasil = document.getElementById('p-hasil');
      var namaEl = document.getElementById('p-nama');
      var nv = namaEl.value;
      var a0 = 0, a1 = nv.length;
      while (a0 < a1 && nv.charCodeAt(a0) <= 32) a0++;
      while (a1 > a0 && nv.charCodeAt(a1 - 1) <= 32) a1--;
      var nama = nv.substring(a0, a1);
      if (!nama) { hasil.innerHTML = '<div class="err">Isi dulu namamu.</div>'; return; }
      var ttd = ttdKosong(document.getElementById('p-ttd')) ? '' : document.getElementById('p-ttd').toDataURL('image/png');
      var payload;
      if (modeTamu) {
        payload = {
          meetingId: Number(PRESENSI_ID), tamu: true, nama: nama, tandaTangan: ttd,
          nip: document.getElementById('p-nip').value, jabatan: document.getElementById('p-jabatan').value,
          unit: document.getElementById('p-unit').value
        };
      } else {
        var cocok = null, sudah = null, berstatus = null;
        res.peserta.forEach(function (p) {
          if (p.nama.toLowerCase() !== nama.toLowerCase()) return;
          if (p.status === 'Hadir') sudah = p;
          else if (p.status === 'Undangan') cocok = p;
          else berstatus = p;
        });
        if (sudah) { hasil.innerHTML = '<div class="err">Nama ini sudah tercatat hadir (anti-ganda).</div>'; return; }
        if (!cocok) {
          hasil.innerHTML = '<div class="err">' + (berstatus
            ? 'Nama ini berstatus ' + esc(berstatus.status) + ' di rapat ini — hubungi penyelenggara bila ada kekeliruan.'
            : 'Nama tidak ditemukan di daftar peserta rapat ini. Periksa ejaannya, atau gunakan tombol “isi sebagai Tamu”.') + '</div>';
          return;
        }
        payload = { meetingId: Number(PRESENSI_ID), attendanceId: cocok.id, tandaTangan: ttd };
      }
      if (res.geofence && res.geofence.aktif) {
        if (!lokasiSaya) {
          hasil.innerHTML = '<div class="err">Rapat ini memakai geofence presensi — ketuk “Periksa Lokasi Saya” di atas dulu, lalu catat kehadiran.</div>';
          return;
        }
        payload.lat = lokasiSaya.lat;
        payload.lng = lokasiSaya.lng;
      }
      var btn = document.getElementById('p-kirim');
      btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Mencatat…';
      // Kode diambil dari server tepat sebelum mencatat. Bila kode
      // kedaluwarsa di tengah jalan (peserta mengisi lama), JANGAN
      // tampilkan error — ambil kode terbaru dan coba sekali lagi;
      // error hanya tampil untuk penolakan nyata (rapat dijeda /
      // ditutup / belum dibuka / anti-ganda).
      var sudahCoba = false;
      function gagalAkhir(pesan) {
        btn.disabled = false; btn.textContent = 'Catat Kehadiran Saya';
        hasil.innerHTML = '<div class="err">' + esc(pesan) + '</div>';
      }
      function kirim() {
        run('apiPublikKodePresensi', Number(PRESENSI_ID), gagalAkhir, function (k) {
          payload.kode = k.token;
          run('presensiMandiri', payload, function (pesan) {
            if (!sudahCoba && String(pesan).indexOf('kedaluwarsa') !== -1) {
              sudahCoba = true;
              hasil.innerHTML = '<p class="muted"><span class="spin"></span> Kode presensi diperbarui otomatis — mencatat ulang…</p>';
              kirim();
              return;
            }
            gagalAkhir(pesan);
          }, function (r) {
            app.innerHTML = '<div class="card"><h3>Kehadiran tercatat ✓</h3>' +
              '<p class="muted">Terima kasih, <b>' + esc(r.nama) + '</b>. Kehadiranmu sudah masuk papan presensi penyelenggara' +
              (r.late ? ' dengan catatan <b>terlambat</b>.' : ' tepat waktu.') +
              (r.tamu ? ' Kehadiranmu tercatat sebagai <b>Tamu</b>; penyelenggara dapat menyimpan datamu ke Buku Peserta.' : '') + '</p></div>';
          });
        });
      }
      kirim();
    });
  });
}
// Kanvas tanda tangan sederhana (mouse + sentuh)
function aktifkanTtd(canvas) {
  if (!canvas) return;
  var ctx2 = canvas.getContext('2d');
  ctx2.lineWidth = 2.2; ctx2.lineCap = 'round'; ctx2.strokeStyle = '#14122E';
  var gambar = false, terakhir = null;
  function pos(e) {
    var r = canvas.getBoundingClientRect();
    var t = e.touches ? e.touches[0] : e;
    return { x: (t.clientX - r.left) * (canvas.width / r.width), y: (t.clientY - r.top) * (canvas.height / r.height) };
  }
  function mulai(e) { gambar = true; terakhir = pos(e); e.preventDefault(); }
  function gerak(e) { if (!gambar) return; var p = pos(e); ctx2.beginPath(); ctx2.moveTo(terakhir.x, terakhir.y); ctx2.lineTo(p.x, p.y); ctx2.stroke(); terakhir = p; e.preventDefault(); }
  function selesai() { gambar = false; }
  canvas.addEventListener('mousedown', mulai); canvas.addEventListener('mousemove', gerak);
  canvas.addEventListener('mouseup', selesai); canvas.addEventListener('mouseleave', selesai);
  canvas.addEventListener('touchstart', mulai, { passive: false }); canvas.addEventListener('touchmove', gerak, { passive: false });
  canvas.addEventListener('touchend', selesai);
}
function bersihkanTtd(canvas) { if (canvas) canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height); }
function ttdKosong(canvas) {
  if (!canvas) return true;
  var d = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height).data;
  for (var i = 3; i < d.length; i += 4) if (d[i] !== 0) return false;
  return true;
}

// Halaman pengelola
// ---------------------------------------------------------------------
// ---------------------------------------------------------------------
// Kerangka menu bawah + FAB kontekstual — sama seperti versi Muse:
// 5 slot (Linimasa, Rapat, FAB tengah, Tindak Lanjut, Arsip) dan FAB
// berubah mengikuti halaman yang sedang dibuka.
// ---------------------------------------------------------------------
var VIEW = 'linimasa';
var LIVE = null; // rapat berstatus Berlangsung, untuk FAB Presensi
var DETAIL_ID = 0;
var DETAIL_SEKSI = 'presensi';
var BUAT_BARU = false; // FAB Buat Rapat dari Linimasa: buka formulir di halaman Rapat
var EKSPOR_SIBUK = false;

var FAB_ICONS = {
  create: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  presensi: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><path d="M13.5 13.5h3v3h-3zM17.5 17.5h3v3h-3zM20.5 13.5h.01M13.5 20.5h.01"/><path d="M7 7h.01M17 7h.01M7 17h.01" stroke-width="2.8"/></svg>',

  export: '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v10.5M7.5 10.5 12 15l4.5-4.5M4.5 19.5h15"/></svg>'
};

function tabUntuk(view) {
  if (view === 'linimasa') return 'linimasa';
  if (view === 'tindak') return 'tindak';
  if (view === 'arsip' || view === 'template' || view === 'pengaturan') return 'arsip';
  return 'rapat'; // rapat, detail (Ruang Rapat), peserta
}

function fabUntuk() {
  if (VIEW === 'tindak') return { kind: 'followup', label: 'Tambah Tugas', aria: 'Tambah tugas tindak lanjut baru' };
  if (VIEW === 'arsip' || VIEW === 'template' || VIEW === 'pengaturan') return { kind: 'export', label: 'Ekspor', aria: 'Unduh ekspor data SesiRapat (JSON)' };
  if (VIEW === 'detail') return { kind: 'presensi', label: 'Presensi', aria: 'Buka presensi QR rapat ini', target: DETAIL_ID };
  if (LIVE) return { kind: 'presensi', label: 'Presensi', aria: 'Buka presensi QR rapat yang sedang berlangsung', target: LIVE.id };
  return { kind: 'create', label: 'Buat Rapat', aria: 'Buat rapat baru' };
}

function perbaruiFab() {
  var fab = document.getElementById('fab');
  var lbl = document.getElementById('fab-label');
  if (!fab || !lbl) return;
  var f = fabUntuk();
  // FAB mengikuti peran (Fase 4.11): tindakan di luar akses peran
  // tidak dimunculkan sama sekali — slot tengah dibiarkan kosong.
  // Presensi untuk semua peran; Ekspor khusus Admin; Buat Rapat dan
  // Tambah Tugas untuk Admin/Notulis.
  var boleh = f.kind === 'presensi' ? true : f.kind === 'export' ? !!adalahAdmin() : !!bisaKelola();
  fab.style.display = boleh ? '' : 'none';
  lbl.style.display = boleh ? '' : 'none';
  if (!boleh) return;
  fab.className = 'fab ' + f.kind;
  fab.innerHTML = FAB_ICONS[f.kind];
  fab.setAttribute('aria-label', f.aria);
  fab.disabled = f.kind === 'export' && EKSPOR_SIBUK;
  lbl.className = 'fab-label ' + f.kind;
  lbl.textContent = f.kind === 'export' && EKSPOR_SIBUK ? 'Menyiapkan…' : f.label;
}

function perbaruiNav() {
  var nav = document.getElementById('bottomnav');
  if (nav) nav.classList.remove('hidden');
  var tab = tabUntuk(VIEW);
  var tabs = document.querySelectorAll('#bottomnav .bn-tab');
  for (var i = 0; i < tabs.length; i++) {
    var aktif = tabs[i].getAttribute('data-tab') === tab;
    if (aktif) { tabs[i].classList.add('active'); tabs[i].setAttribute('aria-current', 'page'); }
    else { tabs[i].classList.remove('active'); tabs[i].removeAttribute('aria-current'); }
  }
  perbaruiFab();
}

function segarkanLive(selesai) {
  run('apiDaftarRapat', function () { if (selesai) selesai(); }, function (res) {
    LIVE = null;
    (res.meetings || []).forEach(function (m) { if ((m.status === 'Berlangsung' || m.status === 'Dijeda') && !LIVE) LIVE = m; });
    perbaruiFab();
    if (selesai) selesai();
  });
}

function klikFab() {
  var f = fabUntuk();
  if (f.kind === 'create') {
    if (!bisaKelola()) { tampilDaftarRapat(); return; }
    if (VIEW === 'rapat') {
      var b = document.getElementById('btn-buat');
      if (b) b.click();
    } else {
      BUAT_BARU = true;
      tampilDaftarRapat();
    }
    return;
  }
  if (f.kind === 'followup') {
    var form = document.getElementById('gt-form');
    if (form) {
      form.scrollIntoView({ behavior: 'smooth', block: 'center' });
      var u = document.getElementById('gt-uraian');
      if (u) u.focus();
    }
    return;
  }
  if (f.kind === 'export') {
    if (EKSPOR_SIBUK) return;
    if (!USER || USER.peran !== 'Admin') { gagal('Ekspor data hanya untuk peran Admin.'); return; }
    EKSPOR_SIBUK = true; perbaruiFab();
    run('apiEksporJson', function (pesan) {
      EKSPOR_SIBUK = false; perbaruiFab(); gagal(pesan);
    }, function (r) {
      EKSPOR_SIBUK = false; perbaruiFab();
      var blob = new Blob([r.json], { type: 'application/json' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'sesirapat-ekspor-google-' + String(r.exportedAt).slice(0, 10) + '.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    });
    return;
  }
  // presensi
  if (!f.target) { tampilDaftarRapat(); return; }
  if (VIEW === 'detail' && DETAIL_ID === f.target && DETAIL_SEKSI === 'presensi') {
    // Sudah di seksi Presensi rapat ini: tampilkan panel QR (Fase
    // 4.8 — QR kini mulai tersembunyi, jadi FAB menampilkannya dulu,
    // sama seperti versi Muse) lalu gulir ke area QR.
    var btnQrFab = document.getElementById('btn-toggle-qr');
    if (btnQrFab && btnQrFab.getAttribute('aria-expanded') !== 'true') btnQrFab.click();
    var areaQr = document.getElementById('qr-area');
    if (areaQr) areaQr.scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  tampilDetail(f.target, 'presensi');
}

function renderShell(view) {
  hentikanTimer();
  VIEW = view;
  perbaruiNav();
  app.innerHTML = '<div id="view"></div>';
  window.scrollTo({ top: 0 });
  return document.getElementById('view');
}

function kartuRapatHtml(m) {
  return '<div class="card"><div class="rowflex" style="justify-content:space-between"><h3 style="margin:0">' + esc(m.nama) + '</h3>' + pillStatus(m.status) + '</div>' +
    '<p class="muted">' + esc(m.tanggalPanjang) + ' · ' + esc(m.jamMulai) + (m.jamSelesai ? ' – ' + esc(m.jamSelesai) : '') + ' WIB' + (m.tempat ? ' · ' + esc(m.tempat) : '') + '<br>' +
    'Hadir ' + m.counts.hadir + ' dari ' + m.counts.undangan + ' undangan' + (m.counts.terlambat ? ' · ' + m.counts.terlambat + ' terlambat' : '') + '</p>' +
    '<button type="button" class="btn ghost small" data-buka="' + m.id + '">Buka Ruang Rapat</button></div>';
}

function ikatBuka(wadah) {
  var buka = wadah.querySelectorAll('[data-buka]');
  for (var i = 0; i < buka.length; i++) buka[i].addEventListener('click', function () {
    tampilDetail(Number(this.getAttribute('data-buka')), 'presensi');
  });
}

function tampilDaftarRapat() {
  var view = renderShell('rapat');
  view.innerHTML = memuatHtml('Memuat daftar rapat…');
  run('apiDaftarRapat', gagal, function (res) {
    LIVE = null;
    res.meetings.forEach(function (m) { if ((m.status === 'Berlangsung' || m.status === 'Dijeda') && !LIVE) LIVE = m; });
    perbaruiFab();
    var html = '<h2 style="margin:14px 0 0;font-size:23px;font-weight:800">Rapat</h2>' +
      '<input id="cari-rapat2" class="searchbox" type="search" placeholder="Cari rapat, tempat, pimpinan…" aria-label="Cari rapat, tempat, pimpinan">' +
      '<div class="rowflex" style="margin-top:12px">';
    if (bisaKelola()) html += '<button type="button" class="btn primary" id="btn-buat">+ Buat Rapat Baru</button>';
    html += '<button type="button" class="btn teal" id="btn-presensi-cepat">Presensi Cepat</button>' +
      (bisaKelola() ? '<button type="button" class="btn ghost" id="btn-peserta">Buku Peserta</button>' : '') + '</div>' +
      '<div id="form-buat"></div><div id="daftar-rapat"></div>';
    view.innerHTML = html;
    function gambar(q) {
      var rows = res.meetings.filter(function (m) {
        return !q || (m.nama + ' ' + (m.tempat || '') + ' ' + (m.pimpinan || '')).toLowerCase().indexOf(q) !== -1;
      });
      var h = '';
      if (!rows.length) {
        h = '<div class="card"><h3>' + (q ? 'Tidak ada rapat yang cocok' : 'Belum ada rapat') + '</h3><p class="muted">' +
          (q ? 'Coba kata kunci lain — nama rapat, tempat, atau pimpinan rapat.' : 'Buat rapat pertama, undang peserta dari Buku Peserta, lalu mulai presensi.') + '</p></div>';
      }
      rows.forEach(function (m) { h += kartuRapatHtml(m); });
      var wadah = document.getElementById('daftar-rapat');
      wadah.innerHTML = h;
      ikatBuka(wadah);
    }
    gambar('');
    document.getElementById('cari-rapat2').addEventListener('input', function () { gambar(this.value.toLowerCase()); });
    var btnPesertaEl = document.getElementById('btn-peserta');
    if (btnPesertaEl) btnPesertaEl.addEventListener('click', tampilPeserta);
    document.getElementById('btn-presensi-cepat').addEventListener('click', function () {
      // Presensi cepat: rapat yang sedang berlangsung didahulukan, lalu
      // rapat terjadwal terdekat, lalu rapat pertama di daftar.
      var target = LIVE;
      if (!target) {
        var terjadwal = res.meetings.filter(function (x) { return x.status === 'Terjadwal'; });
        terjadwal.sort(function (a, b) {
          var ka = a.tanggal + ' ' + a.jamMulai, kb = b.tanggal + ' ' + b.jamMulai;
          return ka < kb ? -1 : ka > kb ? 1 : 0;
        });
        target = terjadwal[0] || res.meetings[0] || null;
      }
      if (target) tampilDetail(target.id, 'presensi');
      else gagal('Belum ada rapat — buat rapat dulu untuk membuka presensi.');
    });
    var btnBuat = document.getElementById('btn-buat');
    if (btnBuat) btnBuat.addEventListener('click', function () { tampilFormRapat(null); });
    if (BUAT_BARU) { BUAT_BARU = false; if (btnBuat) tampilFormRapat(null); }
  });
}

// Wizard rapat 3 langkah — sama seperti versi Muse:
//   1 Detail rapat → 2 Penyelenggara (+ surat undangan PDF) → 3 Selesai
// (ringkasan lalu simpan). Dipakai untuk buat baru dan ubah rapat.
function tampilFormRapat(meeting) {
  var wadah = meeting ? document.getElementById('form-edit') : document.getElementById('form-buat');
  if (!wadah) return;
  var data = meeting ? {
    nama: meeting.nama, jenis: meeting.jenis, tanggal: meeting.tanggal, jamMulai: meeting.jamMulai,
    jamSelesai: meeting.jamSelesai, tempat: meeting.tempat, pimpinan: meeting.pimpinan,
    notulis: meeting.notulis, agenda: meeting.agenda, nomorUndangan: meeting.nomorUndangan
  } : { nama: '', jenis: 'Rapat Koordinasi', tanggal: '', jamMulai: '', jamSelesai: '', tempat: '', pimpinan: '', notulis: '', agenda: '', nomorUndangan: '' };
  var langkah = 1;
  var suratPick = null;
  var suratAda = !!(meeting && meeting.suratUrl);
  var jenisList = ['Rapat Koordinasi', 'Rapat Pimpinan', 'Rapat Evaluasi', 'Sosialisasi', 'Pelatihan', 'Musyawarah', 'Lainnya'];

  function indikator() {
    var label = ['Detail rapat', 'Penyelenggara', 'Selesai'];
    var h = '<div class="rowflex" style="margin-bottom:12px">';
    for (var i = 0; i < 3; i++) {
      h += '<span class="pill ' + (langkah >= i + 1 ? 'indigo' : 'slate') + '">' + (i + 1) + '. ' + label[i] + '</span>';
    }
    return h + '</div>';
  }
  function err(pesan) {
    var e = document.getElementById('f-err');
    if (e) e.innerHTML = '<div class="err">' + esc(pesan) + '</div>';
  }
  function bacaLangkah() {
    if (langkah === 1) {
      data.nama = document.getElementById('f-nama').value;
      data.jenis = document.getElementById('f-jenis').value;
      data.tanggal = document.getElementById('f-tanggal').value;
      data.tempat = document.getElementById('f-tempat').value;
      data.jamMulai = document.getElementById('f-mulai').value;
      data.jamSelesai = document.getElementById('f-selesai').value;
      data.agenda = document.getElementById('f-agenda').value;
    } else if (langkah === 2) {
      data.pimpinan = document.getElementById('f-pimpinan').value;
      data.notulis = document.getElementById('f-notulis').value;
      data.nomorUndangan = document.getElementById('f-nomor').value;
    }
  }
  function gambar() {
    var h = '<div class="card"><h3>' + (meeting ? 'Ubah Rapat' : 'Buat Rapat Baru') + '</h3>' + indikator();
    if (langkah === 1) {
      var opsiJenis = '';
      jenisList.forEach(function (j) { opsiJenis += '<option ' + (data.jenis === j ? 'selected' : '') + '>' + esc(j) + '</option>'; });
      h += '<label class="lbl">Nama rapat *</label><input id="f-nama" value="' + esc(data.nama) + '">' +
        '<div class="grid2"><div><label class="lbl">Jenis</label><select id="f-jenis">' + opsiJenis + '</select></div>' +
        '<div><label class="lbl">Tanggal *</label><input id="f-tanggal" type="date" value="' + esc(data.tanggal) + '"></div></div>' +
        '<div class="grid2"><div><label class="lbl">Jam mulai *</label><input id="f-mulai" type="time" value="' + esc(data.jamMulai) + '"></div>' +
        '<div><label class="lbl">Jam selesai</label><input id="f-selesai" type="time" value="' + esc(data.jamSelesai) + '"></div></div>' +
        '<label class="lbl">Tempat</label><input id="f-tempat" value="' + esc(data.tempat) + '">' +
        '<label class="lbl">Agenda / maksud rapat</label><textarea id="f-agenda" style="min-height:70px">' + esc(data.agenda) + '</textarea>' +
        '<div class="rowflex" style="margin-top:14px"><button type="button" class="btn primary" id="f-lanjut">Lanjut: Penyelenggara →</button>' +
        '<button type="button" class="btn ghost" id="f-batal">Batal</button></div>';
    } else if (langkah === 2) {
      h += '<div class="grid2"><div><label class="lbl">Pimpinan rapat</label><input id="f-pimpinan" value="' + esc(data.pimpinan) + '"></div>' +
        '<div><label class="lbl">Notulis</label><input id="f-notulis" value="' + esc(data.notulis) + '"></div></div>' +
        '<label class="lbl">Nomor undangan (opsional)</label><input id="f-nomor" value="' + esc(data.nomorUndangan) + '">' +
        '<label class="lbl">Surat undangan resmi (PDF, opsional, maks 10 MB)</label>';
      if (suratAda && !suratPick) {
        h += '<div class="okbox">Surat tersimpan: <a href="' + esc(meeting.suratUrl) + '" target="_blank" rel="noopener">' + esc(meeting.suratFileName || 'surat-undangan.pdf') + '</a>' +
          ' <button type="button" class="btn danger small" id="f-surat-hapus">Hapus surat</button></div>';
      }
      if (suratPick) {
        h += '<div class="okbox">Berkas dipilih: <b>' + esc(suratPick.namaBerkas) + '</b> (' + suratPick.ukuranKB + ' KB) — tersimpan saat rapat disimpan. ' +
          '<button type="button" class="btn ghost small" id="f-surat-batal">Batalkan</button></div>';
      }
      h += '<label class="btn ghost small" style="display:inline-flex;cursor:pointer">Unggah surat undangan (PDF)' +
        '<input type="file" id="f-surat" accept="application/pdf,.pdf" class="sr-only" style="display:none" aria-label="Unggah surat undangan resmi dalam bentuk PDF"></label>' +
        '<p class="muted">PDF surat resmi tersimpan per rapat di Drive SesiRapat_Arsip: bisa dibuka dari Ruang Rapat dan ikut dibagikan dari panel Bagikan Undangan. Tanpa PDF, undangan dibagikan sebagai teks + surat yang dibuat otomatis dari kop lembaga.</p>' +
        '<div class="rowflex" style="margin-top:14px"><button type="button" class="btn ghost" id="f-kembali">← Kembali</button>' +
        '<button type="button" class="btn primary" id="f-lanjut">Lanjut: Ringkasan →</button>' +
        '<button type="button" class="btn ghost" id="f-batal">Batal</button></div>';
    } else {
      var baris = [
        ['Nama rapat', data.nama], ['Jenis', data.jenis],
        ['Tanggal', data.tanggal], ['Jam', data.jamMulai + (data.jamSelesai ? ' – ' + data.jamSelesai : '') + ' WIB'],
        ['Tempat', data.tempat || '—'], ['Pimpinan', data.pimpinan || '—'], ['Notulis', data.notulis || '—'],
        ['Nomor undangan', data.nomorUndangan || '—'], ['Agenda', data.agenda || '—'],
        ['Surat undangan', suratPick ? suratPick.namaBerkas + ' (baru)' : (suratAda ? (meeting.suratFileName || 'Sudah terunggah') : 'Tidak ada — memakai teks + surat generate')]
      ];
      h += '<div class="tblwrap"><table class="tbl">';
      baris.forEach(function (b) { h += '<tr><td style="width:40%"><b>' + esc(b[0]) + '</b></td><td>' + esc(b[1]) + '</td></tr>'; });
      h += '</table></div>' +
        '<p class="muted">Setelah disimpan, rapat terbuka di Ruang Rapat — di sana kamu menambahkan peserta undangan dari Buku Peserta, membuka presensi QR, dan menyusun notulen.</p>' +
        '<div class="rowflex" style="margin-top:14px"><button type="button" class="btn ghost" id="f-kembali">← Kembali</button>' +
        '<button type="button" class="btn primary" id="f-simpan" data-muat="Menyimpan…">' + (meeting ? 'Simpan Perubahan' : 'Buat Rapat') + '</button>' +
        '<button type="button" class="btn ghost" id="f-batal">Batal</button></div>';
    }
    h += '<div id="f-err"></div></div>';
    wadah.innerHTML = h;

    var btnBatal = document.getElementById('f-batal');
    if (btnBatal) btnBatal.addEventListener('click', function () { wadah.innerHTML = ''; });
    var btnKembali = document.getElementById('f-kembali');
    if (btnKembali) btnKembali.addEventListener('click', function () { bacaLangkah(); langkah--; gambar(); });
    var btnLanjut = document.getElementById('f-lanjut');
    if (btnLanjut) btnLanjut.addEventListener('click', function () {
      bacaLangkah();
      if (langkah === 1) {
        if (!data.nama.replace(/^s+|s+$/g, '')) { err('Nama rapat wajib diisi.'); return; }
        if (!data.tanggal) { err('Tanggal rapat wajib diisi.'); return; }
        if (!data.jamMulai) { err('Jam mulai wajib diisi.'); return; }
      }
      langkah++;
      gambar();
    });
    var inputSurat = document.getElementById('f-surat');
    if (inputSurat) inputSurat.addEventListener('change', function () {
      var berkas = this.files && this.files[0];
      this.value = '';
      if (!berkas) return;
      var namaKecil = berkas.name.toLowerCase();
      if (namaKecil.slice(-4) !== '.pdf' && berkas.type !== 'application/pdf') { err('Berkas harus berupa PDF.'); return; }
      if (berkas.size > 10 * 1024 * 1024) { err('Ukuran berkas ' + (berkas.size / 1048576).toFixed(1) + ' MB — melebihi batas 10 MB.'); return; }
      var pembaca = new FileReader();
      pembaca.onload = function () {
        var hasil = String(pembaca.result || '');
        var koma = hasil.indexOf(',');
        suratPick = {
          namaBerkas: berkas.name,
          base64: koma >= 0 ? hasil.slice(koma + 1) : '',
          ukuranKB: Math.max(1, Math.round(berkas.size / 1024))
        };
        gambar();
      };
      pembaca.onerror = function () { err('Berkas tidak bisa dibaca. Coba berkas PDF lain.'); };
      pembaca.readAsDataURL(berkas);
    });
    var btnSuratBatal = document.getElementById('f-surat-batal');
    if (btnSuratBatal) btnSuratBatal.addEventListener('click', function () { suratPick = null; gambar(); });
    var btnSuratHapus = document.getElementById('f-surat-hapus');
    if (btnSuratHapus) btnSuratHapus.addEventListener('click', function () {
      run('apiHapusSuratUndangan', meeting.id, err, function () { suratAda = false; gambar(); });
    });
    var btnSimpan = document.getElementById('f-simpan');
    if (btnSimpan) btnSimpan.addEventListener('click', function () {
      btnSimpan.disabled = true;
      btnSimpan.textContent = 'Menyimpan…';
      var selesai = function (idRapat) {
        if (suratPick) {
          run('apiUploadSuratUndangan', idRapat, suratPick.namaBerkas, suratPick.base64, function (pesan) {
            gagal('Rapat tersimpan, tetapi surat undangan gagal diunggah: ' + pesan);
            tampilDetail(idRapat, 'presensi');
          }, function () { tampilDetail(idRapat, 'presensi'); });
        } else {
          tampilDetail(idRapat, 'presensi');
        }
      };
      if (meeting) {
        var kirim = {};
        for (var k in data) kirim[k] = data[k];
        kirim.id = meeting.id;
        run('apiUbahRapat', kirim, function (pesan) { btnSimpan.disabled = false; btnSimpan.textContent = 'Simpan Perubahan'; err(pesan); }, function () { selesai(meeting.id); });
      } else {
        run('apiBuatRapat', data, function (pesan) { btnSimpan.disabled = false; btnSimpan.textContent = 'Buat Rapat'; err(pesan); }, function (r) { selesai(r.id); });
      }
    });
  }
  gambar();
  wadah.scrollIntoView({ behavior: 'smooth' });
}

var DETAIL = null;
function tampilDetail(id, seksi) {
  hentikanTimer();
  DETAIL_ID = id;
  DETAIL_SEKSI = seksi;
  var view = renderShell('detail');
  view.innerHTML = memuatHtml('Memuat Ruang Rapat…');
  run('apiDetailRapat', id, gagal, function (res) {
    DETAIL = res;
    segarkanLive();
    var m = res.meeting;
    var html = '<div style="margin-top:12px"><button type="button" class="btn ghost small" id="btn-kembali">← Semua Rapat</button></div>' +
      '<div class="card"><div class="rowflex" style="justify-content:space-between"><h3 style="margin:0">' + esc(m.nama) + '</h3>' + pillStatus(m.status) + '</div>' +
      '<p class="muted">' + esc(m.jenis) + ' · ' + esc(m.tanggalPanjang) + ' · ' + esc(m.jamMulai) + (m.jamSelesai ? ' – ' + esc(m.jamSelesai) : '') + ' WIB' +
      (m.tempat ? '<br>Tempat: ' + esc(m.tempat) : '') + (m.pimpinan ? '<br>Pimpinan: ' + esc(m.pimpinan) : '') + (m.notulis ? '<br>Notulis: ' + esc(m.notulis) : '') +
      (m.agenda ? '<br>Agenda: ' + esc(m.agenda) : '') + (m.nomorUndangan ? '<br>Nomor undangan: ' + esc(m.nomorUndangan) : '') +
      (m.suratUrl ? '<br>Surat undangan: <a href="' + esc(m.suratUrl) + '" target="_blank" rel="noopener">' + esc(m.suratFileName || 'surat-undangan.pdf') + '</a>' : '') + '</p>' +
      '<p class="muted"><b>' + esc(durasiLabel(m)) + '</b> · Hadir ' + m.counts.hadir + ' dari ' + m.counts.undangan + ' undangan</p>' +
      (m.jendela ? '<p class="muted">🕘 ' + esc(m.jendela.label) + '<br>Status jendela presensi: <b>' + esc(m.jendela.statusText) + '</b></p>' : '') +
      '<div class="rowflex">';
    if (bisaKelola()) {
      if (m.status === 'Terjadwal') html += '<button type="button" class="btn teal small" data-status="Berlangsung" data-muat="Memulai…">Mulai Rapat</button>';
      if (m.status === 'Berlangsung') html += '<button type="button" class="btn small" id="btn-jeda" style="background:#F59E0B;color:#fff">⏸ Jeda Rapat</button>';
      if (m.status === 'Dijeda') html += '<button type="button" class="btn teal small" data-status="Berlangsung" data-muat="Melanjutkan…">▶ Lanjutkan Rapat</button>';
      if (m.status === 'Berlangsung' || m.status === 'Dijeda') html += '<button type="button" class="btn primary small" data-status="Selesai" data-muat="Menyelesaikan…">Selesaikan Rapat</button>';
      if (m.status === 'Selesai') html += '<button type="button" class="btn ghost small" data-status="Berlangsung" data-muat="Membuka…">Buka Lagi</button>';
      html += '<button type="button" class="btn ghost small" id="btn-edit">Ubah Rapat</button>';
      html += '<button type="button" class="btn danger small" id="btn-hapus-rapat">Hapus Rapat</button>';
    }
    html += '</div><div id="form-edit"></div><div id="jeda-box"></div>';
    if (m.status === 'Dijeda') {
      html += '<p style="margin:10px 0 0;padding:10px 12px;border-radius:12px;background:#FDF3E3;color:#9A6206;font-weight:600">⏸ Rapat sedang dijeda — ' + esc(m.pauseReason || 'Istirahat') + ' sejak ' + esc(formatWaktuIso(m.pausedAt)) + '. Durasi berhenti dan presensi tidak menerima kehadiran baru sampai dilanjutkan.</p>';
    }
    // Riwayat jeda: pasangan Dijeda → Berlangsung/Selesai dari jejak status.
    var jedaList = [];
    var jedaBuka = null;
    (res.statusLog || []).slice().reverse().forEach(function (l) {
      if (l.ke === 'Dijeda') { jedaBuka = { mulai: l.waktu, alasan: l.catatan || 'Jeda' }; jedaList.push(jedaBuka); }
      else if (jedaBuka && (l.ke === 'Berlangsung' || l.ke === 'Selesai')) { jedaBuka.selesai = l.waktu; jedaBuka = null; }
    });
    if (jedaList.length) {
      html += '<div style="margin-top:12px"><p class="muted" style="margin:0 0 4px"><b>Riwayat jeda</b> (tidak dihitung dalam durasi)</p>';
      jedaList.forEach(function (p) {
        var menit = p.selesai ? Math.max(1, Math.round((new Date(p.selesai).getTime() - new Date(p.mulai).getTime()) / 60000)) + ' menit' : 'sedang jeda';
        html += '<p class="muted" style="margin:2px 0">⏸ <b>' + esc(p.alasan) + '</b> · ' + esc(formatWaktuIso(p.mulai)) + (p.selesai ? ' – ' + esc(formatWaktuIso(p.selesai)) : '') + ' · ' + menit + '</p>';
      });
      html += '</div>';
    }
    if (res.statusLog && res.statusLog.length) {
      html += '<div style="margin-top:12px"><p class="muted" style="margin:0 0 4px"><b>Jejak status</b></p>';
      res.statusLog.forEach(function (l) {
        html += '<p class="muted" style="margin:2px 0">' + esc(formatWaktuIso(l.waktu)) + ' — ' + (l.dari ? esc(l.dari) + ' → ' : '') + '<b>' + esc(l.ke) + '</b>' + (l.catatan ? ' · ' + esc(l.catatan) : '') + '</p>';
      });
      html += '</div>';
    }
    html += '</div>';
    var seksis = [['presensi', 'Presensi'], ['notulen', 'Notulen'], ['tindak', 'Tindak Lanjut'], ['dokumen', 'Dokumen']];
    html += '<div class="sektabs">';
    seksis.forEach(function (s) { html += '<button type="button" data-seksi="' + s[0] + '" class="' + (seksi === s[0] ? 'active' : '') + '">' + s[1] + '</button>'; });
    html += '</div><div id="seksi"></div>';
    view.innerHTML = html;
    document.getElementById('btn-kembali').addEventListener('click', tampilDaftarRapat);
    var st = view.querySelectorAll('[data-status]');
    for (var i = 0; i < st.length; i++) st[i].addEventListener('click', function () {
      var target = this.getAttribute('data-status');
      run('apiUbahStatusRapat', m.id, target, gagal, function () { tampilDetail(m.id, seksi); });
    });
    var btnJeda = document.getElementById('btn-jeda');
    if (btnJeda) btnJeda.addEventListener('click', function () {
      var box = document.getElementById('jeda-box');
      if (box.innerHTML) { box.innerHTML = ''; return; }
      var alasanPilihan = 'Makan siang';
      box.innerHTML = '<div class="card" style="margin-top:12px"><h3 style="margin-top:0">Jeda rapat — pilih alasan</h3>' +
        '<p class="muted">Selama jeda, penghitung durasi berhenti dan presensi (QR/kode/tautan) tidak menerima kehadiran baru. Jeda tercatat di jejak status.</p>' +
        '<div class="rowflex" id="jeda-alasan">' +
        ['Makan siang', 'Coffee break', 'Istirahat', 'Lainnya'].map(function (r) {
          return '<button type="button" class="btn ' + (r === alasanPilihan ? 'primary' : 'ghost') + ' small" data-alasan="' + r + '">' + r + '</button>';
        }).join('') + '</div>' +
        '<div id="jeda-lainnya-box"></div>' +
        '<div class="rowflex" style="margin-top:10px"><button type="button" class="btn" id="jeda-ok" data-muat="Menjeda…" style="background:#F59E0B;color:#fff">Jeda Sekarang</button>' +
        '<button type="button" class="btn ghost" id="jeda-batal">Batal</button></div></div>';
      box.querySelectorAll('[data-alasan]').forEach(function (b) {
        b.addEventListener('click', function () {
          alasanPilihan = this.getAttribute('data-alasan');
          box.querySelectorAll('[data-alasan]').forEach(function (x) { x.className = 'btn ' + (x.getAttribute('data-alasan') === alasanPilihan ? 'primary' : 'ghost') + ' small'; });
          document.getElementById('jeda-lainnya-box').innerHTML = alasanPilihan === 'Lainnya'
            ? '<label class="lbl" for="jeda-lainnya">Alasan jeda (singkat)</label><input id="jeda-lainnya" maxlength="120" placeholder="cth. Menunggu pimpinan rapat">'
            : '';
        });
      });
      document.getElementById('jeda-batal').addEventListener('click', function () { box.innerHTML = ''; });
      document.getElementById('jeda-ok').addEventListener('click', function () {
        var alasan = alasanPilihan;
        if (alasan === 'Lainnya') {
          var isi = document.getElementById('jeda-lainnya');
          alasan = isi && isi.value ? isi.value.trim() : '';
          if (!alasan) { gagal('Isi dulu alasan jedanya, atau pilih alasan yang tersedia.'); return; }
        }
        run('apiUbahStatusRapat', m.id, 'Dijeda', alasan, gagal, function () { tampilDetail(m.id, seksi); });
      });
    });
    var btnEdit = document.getElementById('btn-edit');
    if (btnEdit) btnEdit.addEventListener('click', function () { tampilFormRapat(m); });
    var btnHapusRapat = document.getElementById('btn-hapus-rapat');
    if (btnHapusRapat) btnHapusRapat.addEventListener('click', function () {
      if (this.getAttribute('data-yakin') === '1') {
        run('apiHapusRapat', m.id, gagal, tampilDaftarRapat);
      } else {
        this.setAttribute('data-yakin', '1');
        this.textContent = 'Yakin hapus rapat + semua datanya?';
      }
    });
    var tabs = view.querySelectorAll('[data-seksi]');
    for (var j = 0; j < tabs.length; j++) tabs[j].addEventListener('click', function () { tampilDetail(m.id, this.getAttribute('data-seksi')); });
    var wadah = document.getElementById('seksi');
    if (seksi === 'presensi') seksiPresensi(wadah, res);
    else if (seksi === 'notulen') seksiNotulen(wadah, res);
    else if (seksi === 'tindak') seksiTindak(wadah, res);
    else seksiDokumen(wadah, res);
  });
}

// Teks undangan gaya admin grup WhatsApp — sama seperti versi Muse,
// dengan tambahan tautan presensi mandiri khas versi Google.
function teksUndanganWa(m, catatan, tautan) {
  var NL = String.fromCharCode(10);
  var lines = [
    '📋 *UNDANGAN RAPAT*',
    '*' + m.nama + '*',
    '',
    'Yth. Bapak/Ibu peserta rapat,',
    'mengharap kehadiran Bapak/Ibu pada:',
    '',
    '🗓️ Hari/Tanggal : ' + m.tanggalPanjang,
    '🕘 Waktu : ' + m.jamMulai + (m.jamSelesai ? ' – ' + m.jamSelesai : '') + ' WIB'
  ];
  if (m.tempat) lines.push('📍 Tempat : ' + m.tempat);
  if (m.pimpinan) lines.push('👤 Pimpinan Rapat : ' + m.pimpinan);
  if (m.agenda) lines.push('📝 Agenda : ' + m.agenda);
  if (m.nomorUndangan) lines.push('✉️ Nomor Undangan : ' + m.nomorUndangan);
  var cat = (catatan || '').replace(/^s+|s+$/g, '');
  if (cat) lines.push('', cat);
  lines.push('', 'Presensi mandiri: ' + tautan);
  if (m.jendela) {
    lines.push('🕘 ' + m.jendela.label + ' — lewat batas tepat waktu tetap bisa presensi, tercatat Terlambat. Cukup isi nama + tanda tangan, tanpa mengetik kode.');
  }
  lines.push(
    '',
    'Kehadiran Bapak/Ibu sangat diharapkan. Mohon hadir tepat waktu — presensi lewat tautan di atas atau memindai QR di ruang rapat.',
    '',
    '_Dibagikan melalui SesiRapat_'
  );
  return lines.join(NL);
}

// Notifikasi perangkat hanya untuk perangkat penyelenggara sendiri
// (peserta tidak punya akun SesiRapat; mereka menerima undangan lewat
// grup WhatsApp/Telegram yang dibagikan).
function notifPerangkat(judul, isi) {
  try {
    if ('Notification' in window && Notification.permission === 'granted') {
      new Notification(judul, { body: isi, tag: 'sesirapat-undangan' });
    }
  } catch (e) { /* notifikasi tidak wajib */ }
}

// Surat undangan generate (.doc) dari kop lembaga — versi bawaan sistem
// bila tidak ada PDF resmi yang diunggah, sama seperti versi Muse.
function unduhSuratDoc(m, catatan, kopLines, namaPeserta) {
  var NL = String.fromCharCode(10);
  var kop = '<div style="text-align:center">';
  kopLines.forEach(function (l, i) {
    kop += i === 0
      ? '<div style="font-size:16pt;font-weight:bold">' + esc(l) + '</div>'
      : '<div>' + esc(l) + '</div>';
  });
  kop += '</div><hr>';
  var pesertaHtml = '';
  if (namaPeserta.length) {
    pesertaHtml = '<p style="margin-top:10pt">Peserta yang diundang (' + namaPeserta.length + ' orang):</p>' +
      namaPeserta.map(function (n) { return '<p style="margin:1pt 0">' + esc(n) + '</p>'; }).join('');
  }
  var cat = (catatan || '').replace(/^s+|s+$/g, '');
  var html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><title>Undangan ' + esc(m.nama) + '</title></head><body style="font-family:Georgia,serif">' +
    kop +
    '<table style="border:none;width:100%"><tr>' +
    '<td style="border:none;width:70%">Nomor&nbsp;&nbsp;&nbsp;: ' + esc(m.nomorUndangan || '—') + '<br>Lampiran : —<br>Perihal&nbsp;&nbsp;&nbsp;&nbsp;: <b>Undangan ' + esc(m.jenis) + '</b></td>' +
    '<td style="border:none;text-align:right">' + esc(m.tanggalPanjang) + '</td></tr></table>' +
    '<p style="margin-top:14pt">Yth. Bapak/Ibu Peserta Rapat<br>di tempat</p>' +
    '<p>Dengan hormat, mengharap kehadiran Bapak/Ibu pada rapat yang akan diselenggarakan pada:</p>' +
    '<table style="border:none">' +
    '<tr><td style="border:none;width:150px">Acara</td><td style="border:none">: <b>' + esc(m.nama) + '</b></td></tr>' +
    '<tr><td style="border:none">Hari/Tanggal</td><td style="border:none">: ' + esc(m.tanggalPanjang) + '</td></tr>' +
    '<tr><td style="border:none">Waktu</td><td style="border:none">: ' + esc(m.jamMulai) + (m.jamSelesai ? ' – ' + esc(m.jamSelesai) : '') + ' WIB</td></tr>' +
    '<tr><td style="border:none">Tempat</td><td style="border:none">: ' + esc(m.tempat || '') + '</td></tr>' +
    '<tr><td style="border:none">Pimpinan Rapat</td><td style="border:none">: ' + esc(m.pimpinan || '') + '</td></tr>' +
    (m.agenda ? '<tr><td style="border:none">Agenda</td><td style="border:none">: ' + esc(m.agenda) + '</td></tr>' : '') +
    '</table>' +
    pesertaHtml +
    (cat ? '<p style="margin-top:10pt">' + esc(cat) + '</p>' : '') +
    '<p style="margin-top:10pt">Demikian undangan ini disampaikan. Kehadiran Bapak/Ibu tepat waktu sangat diharapkan. Atas perhatian dan kehadirannya diucapkan terima kasih.</p>' +
    '<table style="border:none;width:100%"><tr><td style="border:none;width:55%"></td>' +
    '<td style="border:none">Pimpinan Rapat,<br><br><br><br><b>' + esc(m.pimpinan || '') + '</b></td></tr></table>' +
    '</body></html>';
  var blob = new Blob([html], { type: 'application/msword' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'Undangan ' + m.nama + '.doc';
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
}

function seksiPresensi(wadah, res) {
  var m = res.meeting;
  var c = m.counts;
  var dijeda = m.status === 'Dijeda';
  // Kartu rekap kehadiran (Fase 5.3) — persis versi Muse: satu
  // kartu per keterangan, angka besar berwarna sesuai status
  // (Hadir hijau, Belum gelap, Izin biru, Alpa merah); kartu
  // Terlambat (kuning tua) hanya muncul bila ada yang terlambat.
  var statKartu = [
    { n: c.hadir, label: 'Hadir', warna: '#0B7A67' },
    { n: c.belum, label: 'Belum', warna: '#191932' },
    { n: c.izin, label: 'Izin', warna: '#1D4ED8' },
    { n: c.alpa, label: 'Alpa', warna: '#B3261E' }
  ];
  if (c.terlambat > 0) statKartu.push({ n: c.terlambat, label: 'Terlambat', warna: '#9A6206' });
  var statHtml = '<div class="statgrid' + (statKartu.length > 4 ? ' lima' : '') + '" role="status" aria-label="Ringkasan kehadiran">' +
    statKartu.map(function (s) {
      return '<div class="statcard"><div class="n" style="color:' + s.warna + '">' + s.n + '</div><div class="l">' + s.label + '</div></div>';
    }).join('') + '</div>';
  var html = (dijeda
    ? '<div class="card" style="background:#FDF3E3;border-color:#F2D38A"><h3 style="color:#9A6206">⏸ Presensi sedang dijeda</h3><p class="muted" style="color:#7A5205">Rapat dijeda — ' + esc(m.pauseReason || 'Istirahat') + '. QR, kode, kios, dan tautan presensi tidak menerima kehadiran baru sampai rapat dilanjutkan dari kepala rapat ini.</p></div>'
    : '') +
    // Tombol Tampilkan/Sembunyikan QR Presensi (Fase 4.8, dirapikan
    // Fase 4.9) — persis versi Muse: bilah satu baris penuh DI ATAS
    // kartu QR; tombolnya membentang rapi (bukan menempel longgar di
    // kiri atas), labelnya berganti mengikuti status, dan teks status
    // kecil yang konsisten duduk di kanannya. QR + kode 6 karakter +
    // hitung mundur berganti (di dalam #qr-area) mulai tersembunyi.
    // Info jendela, tautan stabil, tombol Salin, dan ringkasan
    // kehadiran selalu terlihat walau QR disembunyikan.
    '<div class="qrtogglebar"><button type="button" class="btn primary" id="btn-toggle-qr" aria-expanded="false" aria-controls="qr-area">Tampilkan QR Presensi</button>' +
    '<span class="qrstatus" id="qr-status" role="status">QR presensi tersembunyi</span></div>' +
    '<div class="card qrbox"><h3>Presensi peserta</h3>' +
    '<p class="muted">QR membuka tautan presensi STABIL rapat ini — hanya berisi ID rapat, tanpa kode, jadi tidak kedaluwarsa. Kode 6 karakter di bawah QR tetap berputar tiap 60 detik untuk presensi manual cadangan di ruangan. Peserta memindai dari HP masing-masing, mengisi nama + tanda tangan (kode diambil otomatis oleh sistem), lalu kehadirannya tercatat (anti-ganda, cap terlambat otomatis).</p>' +
    '<div id="qr-area" class="hidden">' +
    '<canvas id="qr"></canvas>' +
    '<div class="bigcode" id="kode">······</div>' +
    '<p class="muted" id="sisa">Kode berganti dalam … detik</p>' +
    '<div class="qrbar" aria-hidden="true"><div id="qr-bar-isi" style="width:100%"></div></div>' +
    '</div>' +
    (m.jendela ? '<p class="muted">🕘 ' + esc(m.jendela.label) + '<br>Status jendela: <b id="jendela-status">' + esc(m.jendela.statusText) + '</b></p>' : '') +
    '<p class="muted tautan">Tautan presensi stabil: <a href="' + esc(res.tautanPresensi) + '" target="_blank" rel="noopener">' + esc(res.tautanPresensi) + '</a></p>' +
    '<div class="rowflex" style="justify-content:center"><button type="button" class="btn ghost small" id="btn-salind">Salin Tautan Presensi</button></div>' +
    statHtml + '</div>';

  // Panel Bagikan Undangan — sama seperti versi Muse: teks gaya admin
  // grup WA + catatan + pratinjau yang bisa disunting, kanal WhatsApp /
  // Telegram / Salin / Share sistem, surat undangan (.doc generate atau
  // PDF resmi yang diunggah), status sudah/belum dibagikan, dan riwayat
  // pembagian. Setiap pembagian tercatat ke sheet Pembagian_Undangan.
  // Panel Bagikan Undangan hanya untuk peran kelola (Admin/Notulis) —
  // Pimpinan tidak melihatnya sama sekali (Fase 4.11).
  if (bisaKelola()) {
  var belumBg = m.belumDibagikan || 0;
  var tercakup = Math.max(0, c.undangan - belumBg);
  html += '<div class="card"><h3>Bagikan Undangan</h3>' +
    '<p class="muted">' + c.undangan + ' peserta terundang · <b>' + tercakup + ' sudah tercakup pembagian</b> · <b>' + belumBg + ' belum dibagikan undangannya</b>. Peserta menerima undangan lewat kanal yang kamu bagikan (grup WhatsApp/Telegram) — SesiRapat tidak mengirim notifikasi langsung ke HP peserta.</p>' +
    '<label class="lbl" for="bg-catatan">Catatan tambahan (opsional)</label><input id="bg-catatan" placeholder="cth. Mohon membawa laporan triwulan">' +
    '<label class="lbl" for="bg-teks">Teks undangan — pratinjau (bisa disunting)</label>' +
    '<textarea id="bg-teks" style="min-height:180px" aria-label="Pratinjau teks undangan"></textarea>' +
    '<div class="rowflex" style="margin-top:10px">' +
    '<button type="button" class="btn primary small" id="bg-wa">WhatsApp</button>' +
    '<button type="button" class="btn ghost small" id="bg-tg">Telegram</button>' +
    '<button type="button" class="btn ghost small" id="bg-salin">Salin Teks</button>' +
    '<button type="button" class="btn ghost small" id="bg-share">Bagikan…</button>' +
    '<button type="button" class="btn ghost small" id="bg-doc">Unduh Surat (.doc)</button></div>';
  if (m.suratUrl) {
    html += '<p class="muted" style="margin-top:10px">Surat undangan resmi (PDF): <a href="' + esc(m.suratUrl) + '" target="_blank" rel="noopener">' + esc(m.suratFileName || 'surat-undangan.pdf') + '</a> — unduh lalu lampirkan saat membagikan, atau pakai surat .doc generate di atas.</p>';
  } else {
    html += '<p class="muted" style="margin-top:10px">Belum ada PDF surat undangan resmi untuk rapat ini (unggah lewat Ubah Rapat → langkah Penyelenggara). Undangan tetap bisa dibagikan sebagai teks + surat .doc yang dibuat otomatis dari kop lembaga.</p>';
  }
  html += '<div id="bg-notif"></div><div id="bg-hasil"></div>';
  if (res.shares && res.shares.length) {
    html += '<p class="muted" style="margin:12px 0 4px"><b>Riwayat pembagian</b></p>';
    res.shares.slice(0, 8).forEach(function (s) {
      html += '<p class="muted" style="margin:2px 0">' + esc(formatWaktuIso(s.createdAt)) + ' — ' + esc(s.kanal) + ' (' + s.jumlahPenerima + ' penerima)</p>';
    });
  }
  html += '</div>';
  }

  if (bisaKelola()) {
    html += '<div class="card"><h3>Undang peserta</h3>' +
      '<label class="lbl">Dari Buku Peserta</label><div class="rowflex"><select id="u-peserta" style="flex:1"></select><button type="button" class="btn primary small" id="u-tambah">Undang</button></div>' +
      '<label class="lbl">Undang satu kelompok</label><div class="rowflex"><select id="u-kelompok" style="flex:1"></select><button type="button" class="btn ghost small" id="u-tambah-kel" data-muat="Mengundang…">Undang Semua</button></div>' +
      '<label class="lbl">Atau ketik manual</label><div class="rowflex"><input id="u-nama" placeholder="Nama peserta" style="flex:2"><input id="u-jabatan" placeholder="Jabatan" style="flex:1"><button type="button" class="btn ghost small" id="u-tambah-manual" data-muat="Mengundang…">Tambah</button></div>' +
      '<div id="u-hasil"></div></div>';
  }

  // Kartu Presensi Tamu / Peserta Baru (Fase 5.3) — persis alur versi
  // Muse yang berdampingan dengan Tambah/Undang Peserta: tamu yang
  // TIDAK ada di daftar undangan dicatat kehadirannya dari sini oleh
  // penyelenggara (nama dengan saran otomatis dari Buku Peserta, NIP /
  // jabatan / unit opsional, tanda tangan opsional), tercatat dengan
  // label Tamu + anti-ganda, lalu bisa disimpan ke Buku Peserta dari
  // Papan hadir. Tamu juga bisa presensi mandiri lewat tautan stabil
  // (mode Tamu di halaman publik) — keduanya masuk Papan hadir yang
  // sama. Kartu disembunyikan bila jendela presensi sudah ditutup,
  // sama seperti versi Muse.
  if (bisaKelola() && !(m.jendela && m.jendela.status === 'ditutup')) {
    html += '<div class="card"><h3>Presensi Tamu / Peserta Baru</h3>' +
      '<p class="muted">Untuk peserta yang <b>tidak ada di daftar undangan</b> — isi nama (saran otomatis dari Buku Peserta), NIP, jabatan, dan unit seperlunya. Kehadirannya tercatat dengan label <span class="pill" style="background:#FDF3E3;color:#9A6206">Tamu</span> dan anti-ganda tetap berlaku; setelah tercatat, tamu bisa disimpan ke Buku Peserta dari papan hadir.</p>' +
      '<div class="grid2"><div><label class="lbl" for="gt-nama">Nama tamu</label><input id="gt-nama" list="gt-saran" placeholder="Nama lengkap" autocomplete="off"><datalist id="gt-saran"></datalist></div>' +
      '<div><label class="lbl" for="gt-nip">NIP / ID pegawai (opsional)</label><input id="gt-nip" autocomplete="off"></div>' +
      '<div><label class="lbl" for="gt-jabatan">Jabatan (opsional)</label><input id="gt-jabatan"></div>' +
      '<div><label class="lbl" for="gt-unit">Unit kerja (opsional)</label><input id="gt-unit"></div></div>' +
      '<label class="lbl">Tanda tangan (opsional — gambar di kotak ini)</label>' +
      '<canvas id="gt-ttd" class="ttd" width="420" height="150"></canvas>' +
      '<div class="rowflex" style="margin-top:8px"><button type="button" class="btn ghost small" id="gt-hapus-ttd">Hapus tanda tangan</button></div>' +
      '<div id="gt-hasil"></div>' +
      '<div style="margin-top:12px"><button type="button" class="btn primary" id="gt-kirim" data-muat="Mencatat…" style="width:100%"' + (dijeda ? ' disabled' : '') + '>' + (dijeda ? 'Presensi Dijeda' : 'Catat Kehadiran Tamu') + '</button></div></div>';
  }

  // Kartu Geofence presensi (Fase 5, opsional — mati bawaan): titik
  // lokasi rapat + radius; presensi mandiri peserta hanya diterima
  // dari perangkat di dalam radius itu. Hanya peran kelola.
  if (bisaKelola()) {
    html += '<div class="card"><h3>Geofence presensi (opsional)</h3>' +
      '<p class="muted">Status: <b>' + (m.geofenceAktif ? 'AKTIF — radius ' + m.geofenceRadius + ' m dari titik (' + m.geofenceLat + ', ' + m.geofenceLng + ')' : 'Mati (bawaan)') + '</b>. Bila aktif, peserta yang presensi mandiri lewat tautan/QR wajib berada di dalam radius titik rapat — lokasi HP-nya diperiksa saat mencatat kehadiran dan penolakan menampilkan jaraknya. Presensi kios/manual oleh penyelenggara tidak dibatasi geofence. Koordinat hanya dipakai untuk pemeriksaan ini.</p>' +
      '<label class="cek"><input type="checkbox" id="gf-aktif" ' + (m.geofenceAktif ? 'checked' : '') + '> Aktifkan geofence untuk rapat ini</label>' +
      '<div class="grid2"><div><label class="lbl">Latitude titik rapat</label><input id="gf-lat" inputmode="decimal" value="' + (m.geofenceLat === null || m.geofenceLat === undefined ? '' : esc(String(m.geofenceLat))) + '" placeholder="cth. -1.6108"></div>' +
      '<div><label class="lbl">Longitude titik rapat</label><input id="gf-lng" inputmode="decimal" value="' + (m.geofenceLng === null || m.geofenceLng === undefined ? '' : esc(String(m.geofenceLng))) + '" placeholder="cth. 103.6108"></div></div>' +
      '<label class="lbl">Radius (meter, 10–5000)</label><input id="gf-radius" type="number" min="10" max="5000" step="10" value="' + esc(String(m.geofenceRadius || 100)) + '">' +
      '<div class="rowflex" style="margin-top:10px"><button type="button" class="btn ghost small" id="gf-lokasi">Pakai Lokasi Perangkat Ini sebagai Titik Rapat</button>' +
      '<button type="button" class="btn primary small" id="gf-simpan" data-muat="Menyimpan…">Simpan Geofence</button></div>' +
      '<div id="gf-hasil"></div></div>';
  }

  html += '<div class="card"><h3>Papan hadir</h3>';
  if (!res.kehadiran.length) html += '<p class="muted">Belum ada peserta diundang.</p>';
  else {
    html += '<div class="tblwrap"><table class="tbl"><tr><th>Nama</th><th>Status</th><th>Jam</th><th></th></tr>';
    res.kehadiran.forEach(function (a) {
      html += '<tr><td><b>' + esc(a.nama) + '</b>' + (a.tamu ? ' <span class="pill" style="background:#FDF3E3;color:#9A6206">Tamu</span>' : '') + (a.jabatan ? '<br><span class="muted">' + esc(a.jabatan) + (a.unit ? ' · ' + esc(a.unit) : '') + '</span>' : '') + '</td>' +
        '<td>' + pillKehadiran(a) + (a.method ? '<br><span class="muted">' + esc(a.method) + '</span>' : '') + (a.signatureUrl ? '<br><a href="' + esc(a.signatureUrl) + '" target="_blank" rel="noopener">Tanda tangan</a>' : '') + '</td>' +
        '<td>' + esc(a.jamHadir || '—') + '</td><td><div class="rowflex">';
      if (bisaKelola()) {
        if (a.tamu && !a.personId) html += '<button type="button" class="btn primary small" data-simpan-tamu="' + a.id + '">Simpan ke Buku Peserta</button>';
        if (a.status !== 'Hadir' && !dijeda) html += '<button type="button" class="btn teal small" data-kios="' + a.id + '">Hadirkan (Kios)</button>';
        if (a.status === 'Undangan') html += '<button type="button" class="btn ghost small" data-st="Izin" data-id="' + a.id + '">Izin</button><button type="button" class="btn ghost small" data-st="Alpa" data-id="' + a.id + '">Alpa</button>';
        if (a.status !== 'Undangan') html += '<button type="button" class="btn ghost small" data-st="Undangan" data-id="' + a.id + '">Ulangi</button>';
        html += '<button type="button" class="btn danger small" data-hapus-und="' + a.id + '">Hapus</button>';
      }
      html += '</div></td></tr>';
    });
    html += '</table></div>';
  }
  html += '<div id="kios-box"></div></div>';
  wadah.innerHTML = html;

  // --- Geofence presensi (Fase 5): ambil lokasi perangkat ini sebagai
  // titik rapat + simpan setelan geofence rapat ini.
  var gfHasil = document.getElementById('gf-hasil');
  var btnGfLokasi = document.getElementById('gf-lokasi');
  if (btnGfLokasi) btnGfLokasi.addEventListener('click', function () {
    if (!navigator.geolocation) { gfHasil.innerHTML = '<div class="err">Perangkat/browser ini tidak menyediakan lokasi (GPS).</div>'; return; }
    gfHasil.innerHTML = '<p class="muted"><span class="spin"></span> Mengambil lokasi perangkat ini…</p>';
    navigator.geolocation.getCurrentPosition(function (pos) {
      document.getElementById('gf-lat').value = String(Math.round(pos.coords.latitude * 1e7) / 1e7);
      document.getElementById('gf-lng').value = String(Math.round(pos.coords.longitude * 1e7) / 1e7);
      gfHasil.innerHTML = '<div class="okbox">Titik rapat terisi dari lokasi perangkat ini (±' + Math.round(pos.coords.accuracy || 0) + ' m akurasi) — periksa lalu Simpan Geofence.</div>';
    }, function (err) {
      gfHasil.innerHTML = '<div class="err">Lokasi tidak bisa diambil: ' + esc(err && err.message ? err.message : 'izin lokasi ditolak') + '. Izinkan akses lokasi untuk situs ini, atau isi latitude/longitude manual.</div>';
    }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 });
  });
  var btnGfSimpan = document.getElementById('gf-simpan');
  if (btnGfSimpan) btnGfSimpan.addEventListener('click', function () {
    var latV = document.getElementById('gf-lat').value.replace(/^s+|s+$/g, '');
    var lngV = document.getElementById('gf-lng').value.replace(/^s+|s+$/g, '');
    run('apiSimpanGeofence', m.id, {
      aktif: document.getElementById('gf-aktif').checked,
      lat: latV === '' ? null : Number(latV),
      lng: lngV === '' ? null : Number(lngV),
      radiusM: Number(document.getElementById('gf-radius').value) || 100
    }, gagal, function () {
      gfHasil.innerHTML = '<div class="okbox">Geofence tersimpan ✓</div>';
      setTimeout(function () { tampilDetail(m.id, 'presensi'); }, 900);
    });
  });

  // --- Hitung mundur kode dari tenggat token yang sebenarnya
  // (Fase 4.9). Dulu #sisa menampilkan secondsLeft mentah dari hasil
  // polling tiap 5 detik: angka diam beberapa detik lalu melompat
  // mengejar (macet-macet, lompat-lompat). Kini server mengirim
  // expiresAt — tenggat nyata akhir jendela token (ms epoch) — dan
  // tampilan menghitung sisa = tenggat − jam sistem, diperbarui
  // dengan timeout yang selaras batas detik jam sistem, jadi angka
  // turun tepat satu per satu tiap detik. Polling token dijadwalkan
  // ulang tepat di tenggat (+ jeda kecil), bukan interval buta,
  // sehingga refresh tidak pernah me-reset atau melompati hitungan;
  // saat token berganti, tenggat baru membuat hitungan kembali ke
  // 60 dengan mulus. Selama dijeda, polling cadangan 15 detik tetap
  // memeriksa apakah rapat sudah dilanjutkan.
  var tenggatToken = 0;
  var tickToken = null;
  var muatBerjalan = false;
  function berhentiTick() {
    if (tickToken) { clearTimeout(tickToken); tickToken = null; }
  }
  function gambarSisa() {
    var el = document.getElementById('sisa');
    if (!el) { berhentiTick(); return; }
    if (!tenggatToken) return;
    var sisaMs = Math.max(0, tenggatToken - Date.now());
    var s = Math.min(60, Math.ceil(sisaMs / 1000));
    el.textContent = 'Kode berganti dalam ' + s + ' detik';
    var bar = document.getElementById('qr-bar-isi');
    if (bar) bar.style.width = (sisaMs / 60000 * 100) + '%';
  }
  function jadwalTick() {
    berhentiTick();
    if (!qrTampil) return;
    // Bangun tepat setelah batas detik berikutnya (+30 ms) supaya
    // angka yang digambar selalu detik yang baru saja berganti.
    tickToken = setTimeout(function () {
      tickToken = null;
      if (!qrTampil || !document.getElementById('sisa')) return;
      gambarSisa();
      jadwalTick();
    }, 1000 - (Date.now() % 1000) + 30);
  }
  function jadwalUlangPoll(jedaMs) {
    hentikanTimer();
    if (!qrTampil) return;
    timerQr = setTimeout(function () {
