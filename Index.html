        var i1 = Math.min(i0 + 1, len - 1);
        var fr = src - i0;
        var v = mono[i0] * (1 - fr) + mono[i1] * fr;
        v = Math.max(-1, Math.min(1, v));
        pcm[j] = v < 0 ? Math.round(v * 0x8000) : Math.round(v * 0x7fff);
      }
      return pcm;
    }, function () {
      throw new Error('Berkas audio tidak bisa dibaca peramban ini (format tidak didukung atau memori tidak cukup untuk rekaman sepanjang ini). Jalan keluarnya: pecah rekaman menjadi beberapa bagian di bawah 14 MB per bagian lalu unggah satu per satu, atau ubah formatnya menjadi .mp3 — hasil transkrip tiap bagian tinggal digabung di kolom transkrip.');
    });
  });
}
// Menghasilkan { total, cara, ambil(i) -> Promise<{mime, b64}> }.
function audioRencana_(file) {
  if (file.size > AUDIO_MAKS_BERKAS) {
    return Promise.reject(new Error('Berkas terlalu besar: ' + audioUkuran_(file.size) + ' (maksimum ' + audioUkuran_(AUDIO_MAKS_BERKAS) + '). Pecah rekaman menjadi beberapa berkas yang lebih kecil — misalnya per 1 jam — lalu unggah dan transkrip satu per satu; hasilnya bisa digabung di kolom transkrip.'));
  }
  var mime = audioMime_(file.name);
  if (file.size <= AUDIO_BATAS_LANGSUNG) {
    return Promise.resolve({
      total: 1, cara: 'berkas utuh',
      ambil: function () {
        return file.arrayBuffer().then(function (buf) {
          return { mime: mime, b64: audioB64_(new Uint8Array(buf)) };
        });
      }
    });
  }
  return file.arrayBuffer().then(function (buf) {
    var bytes = new Uint8Array(buf);
    var wav = audioParseWav_(bytes);
    if (wav) {
      var rentang = audioRentangWav_(wav);
      return {
        total: rentang.length, cara: 'dipecah per bagian (WAV)',
        ambil: function (i) {
          var r = rentang[i];
          return Promise.resolve({ mime: 'audio/wav', b64: audioB64_(audioBangunWav_(wav.fmt, bytes.slice(r.start, r.end))) });
        }
      };
    }
    var mp3 = audioMp3Rentang_(bytes);
    if (mp3) {
      return {
        total: mp3.length, cara: 'dipecah per bagian (MP3)',
        ambil: function (i) {
          var r = mp3[i];
          return Promise.resolve({ mime: 'audio/mp3', b64: audioB64_(bytes.slice(r.start, r.end)) });
        }
      };
    }
    var adts = audioAdtsRentang_(bytes);
    if (adts) {
      return {
        total: adts.length, cara: 'dipecah per bagian (AAC)',
        ambil: function (i) {
          var r = adts[i];
          return Promise.resolve({ mime: 'audio/aac', b64: audioB64_(bytes.slice(r.start, r.end)) });
        }
      };
    }
    return audioDekodePcm16_(file).then(function (pcm) {
      var total = Math.max(1, Math.ceil(pcm.length / AUDIO_SEGMEN_SAMPEL));
      return {
        total: total, cara: 'dipecah per bagian (dibaca & dipadatkan peramban)',
        ambil: function (i) {
          var potong = pcm.slice(i * AUDIO_SEGMEN_SAMPEL, Math.min(pcm.length, (i + 1) * AUDIO_SEGMEN_SAMPEL));
          return Promise.resolve({ mime: 'audio/wav', b64: audioB64_(audioEncodeWav16_(potong, AUDIO_SR_TARGET)) });
        }
      };
    });
  });
}

          elAudioHasil.innerHTML = '<div class="err">' + esc(pesan) + '</div>';
          elAudioStatus.textContent = '';
        }, function () {
          run('apiBuatJobTranskrip', m.id, berkas.name, rencana.total, function (pesan) {
            AUDIO.sibuk = false;
            elAudioHasil.innerHTML = '<div class="err">' + esc(pesan) + '</div>';
            elAudioStatus.textContent = '';
          }, function (resJob) {
            AUDIO.rencana = rencana;
            AUDIO.jobId = resJob.jobId;
            AUDIO.terunggah = 0;
            elAudioStatus.textContent = rencana.total > 1 ? 'Rekaman ' + rencana.cara + ' menjadi ' + rencana.total + ' segmen.' : '';
            audioUnggahBerikut();
          });
        });
      }, function (errR) {
        AUDIO.sibuk = false;
        elAudioBar.style.display = 'none';
        elAudioStatus.textContent = '';
        elAudioHasil.innerHTML = '<div class="err">' + esc(errR && errR.message ? errR.message : String(errR)) + '</div>';
      });
    });
    elAudioLanjut.addEventListener('click', function () {
      if (AUDIO.sibuk || !AUDIO.rencana) return;
      AUDIO.sibuk = true;
      elAudioLanjut.style.display = 'none';
      elAudioHasil.innerHTML = '';
      audioUnggahBerikut();
    });
    // Tampilkan job terakhir rapat ini — misalnya halaman dibuka lagi
    // setelah tab ditutup — dan mulai polling bila masih berjalan.
    audioMuatStatus();
    // --- Mikrofon & dikte (Fase 4.7 — perbaikan izin mic) ---------------
    // Akar bug lama: dikte hanya memakai SpeechRecognition tanpa pernah
    // memanggil getUserMedia, jadi prompt izin Chrome TIDAK PERNAH muncul
    // dan status izin selamanya "Tanya". Kini tombol mic dan Tes Mikrofon
    // memanggil getUserMedia({audio:true}) DULU dari gestur ketukan —
    // itulah pemicu prompt izin yang sesungguhnya — baru SpeechRecognition
    // (id-ID) dimulai. Semua error diterjemahkan ke Bahasa Indonesia.
    var btnDikte = document.getElementById('n-dikte');
    var statusDikte = document.getElementById('n-dikte-status');
    var pillMic = document.getElementById('n-mic-pill');
    var btnTesMic = document.getElementById('n-tes-mic');
    var micMsg = document.getElementById('n-mic-msg');
    var micMeter = document.getElementById('n-mic-meter');
    var micMeterIsi = document.getElementById('n-mic-meter-isi');
    var micNote = document.getElementById('n-mic-note');
    var micPanduan = document.getElementById('n-mic-panduan');
    var KUNCI_STATUS_MIC = 'sesirapat-status-mic';
    var LABEL_MIC = {
      belum: 'Belum diminta (Chrome: Tanya)',
      diizinkan: 'Diizinkan',
      ditolak: 'Ditolak',
      'tidak-ada': 'Tidak ada mikrofon',
      dipakai: 'Mikrofon sedang dipakai aplikasi lain',
      'tidak-aman': 'Butuh koneksi aman (HTTPS)',
      'tidak-didukung': 'Tidak didukung peramban ini'
    };
    var statusMicKini = 'belum';
    try {
      var tersimpanMic = window.localStorage.getItem(KUNCI_STATUS_MIC);
      if (tersimpanMic && LABEL_MIC[tersimpanMic]) statusMicKini = tersimpanMic;
    } catch (eMic0) { /* localStorage tidak tersedia — abaikan */ }
    function setStatusMic(s) {
      statusMicKini = s;
      try { window.localStorage.setItem(KUNCI_STATUS_MIC, s); } catch (eMic1) { /* abaikan */ }
      if (pillMic) {
        pillMic.textContent = 'Status izin: ' + (LABEL_MIC[s] || s);
        pillMic.className = 'pill ' + (s === 'diizinkan' ? 'teal' : (s === 'ditolak' || s === 'tidak-ada' || s === 'tidak-aman' || s === 'tidak-didukung') ? 'red' : s === 'dipakai' ? 'amber' : 'slate');
      }
      if (micPanduan) {
        micPanduan.style.display = (s === 'belum' || s === 'ditolak') ? '' : 'none';
        if (s === 'ditolak') {
          var jdl = document.getElementById('n-mic-panduan-judul');
          if (jdl) jdl.textContent = 'Izin mikrofon sedang tertolak — prompt izin tidak akan muncul lagi sampai diizinkan manual:';
        }
      }
    }
    setStatusMic(statusMicKini);
    // Segarkan status dari Permissions API (tanpa memicu prompt).
    if (navigator.permissions && navigator.permissions.query) {
      navigator.permissions.query({ name: 'microphone' }).then(function (hasilIzin) {
        var petakan = function (st) { return st === 'granted' ? 'diizinkan' : st === 'denied' ? 'ditolak' : 'belum'; };
        setStatusMic(petakan(hasilIzin.state));
        hasilIzin.onchange = function () { setStatusMic(petakan(hasilIzin.state)); };
      }).catch(function () { /* query microphone tak didukung — abaikan */ });
    }
    var btnMuatUlang = document.getElementById('n-muat-ulang');
    if (btnMuatUlang) btnMuatUlang.addEventListener('click', function () { window.location.reload(); });
    function micTersedia() {
      return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
    }
    function galatMic(err) {
      var nama = (err && err.name) || '';
      if (nama === 'NotAllowedError' || nama === 'PermissionDeniedError') return { status: 'ditolak', pesan: 'Izin mikrofon ditolak. Ketuk ikon gembok di address bar Chrome › Izin situs › Mikrofon › Izinkan, lalu muat ulang halaman dan coba lagi.' };
      if (nama === 'NotFoundError' || nama === 'DevicesNotFoundError' || nama === 'OverconstrainedError') return { status: 'tidak-ada', pesan: 'Tidak ada mikrofon yang terdeteksi di perangkat ini. Pasang mikrofon/headset, lalu coba lagi.' };
      if (nama === 'NotReadableError' || nama === 'TrackStartError') return { status: 'dipakai', pesan: 'Mikrofon tidak bisa dibuka — kemungkinan sedang dipakai aplikasi lain (mis. panggilan atau perekam lain). Tutup aplikasi itu, lalu coba lagi.' };
      if (nama === 'SecurityError') return { status: 'tidak-aman', pesan: 'Mikrofon diblokir karena halaman tidak berjalan di konteks aman. Buka halaman ini lewat HTTPS di Chrome, lalu coba lagi.' };
      if (nama === 'AbortError') return { status: 'belum', pesan: 'Permintaan mikrofon dibatalkan sebelum selesai. Ketuk lagi tombolnya dan izinkan saat Chrome bertanya.' };
      return { status: 'belum', pesan: 'Mikrofon tidak bisa dibuka (' + (nama || 'kesalahan tidak dikenal') + '). Periksa izin mikrofon di Chrome, lalu coba lagi.' };
    }
    function galatMicTakTersedia() {
      if (!window.isSecureContext) return { status: 'tidak-aman', pesan: 'Halaman ini tidak berjalan di konteks aman (HTTPS), jadi peramban memblokir mikrofon. Buka SesiRapat lewat alamat HTTPS resminya di Chrome, lalu coba lagi.' };
      return { status: 'tidak-didukung', pesan: 'Peramban ini tidak menyediakan akses mikrofon (mediaDevices tidak tersedia). Buka halaman ini di Chrome versi terbaru — bukan browser di dalam aplikasi WhatsApp/Telegram — lalu coba lagi.' };
    }
    // Minta mic lewat getUserMedia; sukses -> callback(stream) menerima
    // stream (pemanggil menghentikannya), gagal -> pesan tampil sendiri.
    function mintaMic(sukses) {
      if (!micTersedia()) {
        var g0 = galatMicTakTersedia();
        setStatusMic(g0.status);
        micMsg.textContent = g0.pesan;
        return;
      }
      navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
        setStatusMic('diizinkan');
        sukses(stream);
      }).catch(function (err) {
        var g = galatMic(err);
        setStatusMic(g.status);
        micMsg.textContent = g.pesan;
      });
    }
    function hentikanStream(stream) {
      if (!stream) return;
      var tracks = stream.getTracks();
      for (var ti = 0; ti < tracks.length; ti++) tracks[ti].stop();
    }
    // --- Tes Mikrofon: getUserMedia + meteran level hidup (WebAudio) ---
    var tesStream = null, tesCtx = null, tesRaf = 0;
    function berhentiTesMic(pesan) {
      if (tesRaf) cancelAnimationFrame(tesRaf);
      tesRaf = 0;
      hentikanStream(tesStream);
      tesStream = null;
      if (tesCtx) { tesCtx.close(); tesCtx = null; }
      if (micMeter) micMeter.style.display = 'none';
      if (micNote) micNote.style.display = '';
      btnTesMic.textContent = 'Tes Mikrofon';
      if (pesan) micMsg.textContent = pesan;
    }
    btnTesMic.addEventListener('click', function () {
      if (tesStream) { berhentiTesMic('Tes mikrofon berhenti.'); return; }
      micMsg.textContent = 'Meminta izin mikrofon… izinkan saat Chrome bertanya.';
      mintaMic(function (stream) {
        tesStream = stream;
        btnTesMic.textContent = 'Berhenti Tes';
        micMsg.textContent = 'Mikrofon aktif — bicara sekarang dan lihat meterannya bergerak. Ketuk “Berhenti Tes” bila selesai.';
        if (micMeter) micMeter.style.display = '';
        if (micNote) micNote.style.display = 'none';
        try {
          var AC = window.AudioContext || window.webkitAudioContext;
          if (AC) {
            tesCtx = new AC();
            var analyser = tesCtx.createAnalyser();
            analyser.fftSize = 512;
            tesCtx.createMediaStreamSource(stream).connect(analyser);
            var data = new Uint8Array(analyser.fftSize);
            var tick = function () {
              analyser.getByteTimeDomainData(data);
              var sum = 0;
              for (var i = 0; i < data.length; i++) { var v = (data[i] - 128) / 128; sum += v * v; }
              var lvl = Math.min(1, Math.sqrt(sum / data.length) * 3.2);
              micMeterIsi.style.width = Math.round(lvl * 100) + '%';
              tesRaf = requestAnimationFrame(tick);
            };
            tick();
          }
        } catch (eMic2) { /* meteran gagal — status mic tetap terdeteksi */ }
      });
    });
    // --- Dikte suara Bahasa Indonesia (Web Speech API, di perangkat ini) ---
    function galatDikte(kode) {
      if (kode === 'not-allowed' || kode === 'service-not-allowed') return 'Dikte ditolak: izin mikrofon belum diberikan ke situs ini. Jalankan Tes Mikrofon sampai statusnya “Diizinkan” — atau ketuk ikon gembok di address bar Chrome › Izin situs › Mikrofon › Izinkan — lalu muat ulang halaman dan mulai dikte lagi.';
      if (kode === 'no-speech') return 'Dikte berhenti: tidak ada suara yang terdengar. Dekatkan mikrofon, bicara sedikit lebih keras dan jelas, lalu mulai dikte lagi.';
      if (kode === 'audio-capture') return 'Dikte gagal: mikrofon tidak tertangkap. Pastikan ada mikrofon terpasang dan tidak sedang dipakai aplikasi lain, jalankan Tes Mikrofon, lalu coba lagi.';
      if (kode === 'network') return 'Dikte gagal karena jaringan: pengenalan suara Chrome butuh koneksi internet. Periksa koneksimu, lalu mulai dikte lagi.';
      if (kode === 'aborted') return 'Dikte dibatalkan sebelum selesai. Mulai lagi bila kamu memang belum selesai bicara.';
      if (kode === 'language-not-supported') return 'Dikte gagal: Bahasa Indonesia (id-ID) tidak didukung di peramban ini. Ketik atau tempel transkrip sebagai gantinya.';
      return 'Dikte berhenti karena kendala' + (kode ? ' (' + kode + ')' : '') + '. Jalankan Tes Mikrofon untuk memastikan mic menyala, lalu mulai dikte lagi — atau ketik/tempel transkrip.';
    }
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      btnDikte.disabled = true;
      statusDikte.textContent = 'Peramban ini tidak mendukung dikte suara (SpeechRecognition tidak tersedia), jadi tombol mikrofon tidak berfungsi di sini. Penggantinya: ketik atau tempel transkrip langsung di kolom Transkrip di bawah, atau unggah berkas .txt hasil transkripsi — hasilnya sama-sama bisa disusun AI.';
    } else {
      var rekam = null;
      btnDikte.addEventListener('click', function () {
        if (rekam) { rekam.stop(); return; }
        if (tesStream) berhentiTesMic('');
        statusDikte.textContent = 'Meminta izin mikrofon… izinkan saat Chrome bertanya.';
        // getUserMedia DULU (pemicu prompt izin), baru SpeechRecognition.
        mintaMic(function (stream) {
          hentikanStream(stream);
          rekam = new SR();
          rekam.lang = 'id-ID';
          rekam.continuous = true;
          rekam.interimResults = false;
          rekam.onresult = function (ev) {
            var ta = document.getElementById('n-transkrip');
            for (var i = ev.resultIndex; i < ev.results.length; i++) {
              if (ev.results[i].isFinal) {
                var kalimat = ev.results[i][0].transcript.trim();
                if (kalimat) {
                  var awal = ta.value;
                  while (awal.length && awal.charAt(awal.length - 1) === ' ') awal = awal.slice(0, -1);
                  ta.value = (awal ? awal + ' ' : '') + kalimat;
                }
              }
            }
          };
          rekam.onend = function () {
            rekam = null;
            btnDikte.classList.remove('rekam');
            btnDikte.setAttribute('aria-label', 'Mulai merekam suara rapat');
            statusDikte.textContent = 'Dikte berhenti. Transkrip bisa disunting sebelum disusun.';
          };
          rekam.onerror = function (ev) {
            if (ev.error === 'not-allowed' || ev.error === 'service-not-allowed') setStatusMic('ditolak');
            // Jangan gagal diam-diam: tampilkan arti error + perbaikannya.
            statusDikte.textContent = galatDikte(ev.error);
          };
          try {
            rekam.start();
            btnDikte.classList.add('rekam');
            btnDikte.setAttribute('aria-label', 'Berhenti merekam');
            statusDikte.textContent = 'Sedang mendengarkan… bicara sekarang, hasil dikte masuk ke kolom Transkrip.';
          } catch (eDikte) {
            rekam = null;
            statusDikte.textContent = 'Dikte tidak bisa dimulai saat ini. Tunggu sebentar, lalu ketuk tombol mikrofon lagi.';
          }
        });
      });
    }
  }
  var btnSetujui = document.getElementById('n-setujui');
  if (btnSetujui) btnSetujui.addEventListener('click', function () {
    run('apiSetStatusNotulen', m.id, 'Disetujui', document.getElementById('n-catatan').value, gagal, selesai);
  });
  var btnKembali = document.getElementById('n-kembalikan');
  if (btnKembali) btnKembali.addEventListener('click', function () {
    run('apiSetStatusNotulen', m.id, 'Dikembalikan', document.getElementById('n-catatan').value, gagal, selesai);
  });
}

function seksiTindak(wadah, res) {
  var m = res.meeting;

  else {
    html += '<div class="tblwrap"><table class="tbl"><tr><th>Uraian</th><th>PJ</th><th>Tenggat</th><th>Status</th><th class="aksi"></th></tr>';
    res.tindakLanjut.forEach(function (f) {
      html += '<tr><td>' + esc(f.uraian) + '</td><td>' + esc(f.penanggungJawab || '—') + '</td><td>' + esc(f.tenggatText || f.tenggatDate || '—') + '</td>' +
        '<td>' + (f.status === 'Selesai' ? '<span class="pill teal">Selesai</span>' : f.status === 'Proses' ? '<span class="pill amber">Proses</span>' : '<span class="pill slate">Belum</span>') + '</td><td class="aksi"><div class="rowflex">';
      if (bisaKelola()) {
        if (f.status !== 'Proses') html += '<button type="button" class="btn ghost small" data-tl="Proses" data-id="' + f.id + '">Proses</button>';
        if (f.status !== 'Selesai') html += '<button type="button" class="btn teal small" data-tl="Selesai" data-id="' + f.id + '">Selesai</button>';
        if (f.status !== 'Belum') html += '<button type="button" class="btn ghost small" data-tl="Belum" data-id="' + f.id + '">Belum</button>';
        html += '<button type="button" class="btn ghost small" data-tl-edit="' + f.id + '">Edit</button>';
        html += '<button type="button" class="btn danger small" data-tl-hapus="' + f.id + '">Hapus</button>';
      }
      html += '</div></td></tr>';
    });
    html += '</table></div>';
  }
  if (bisaKelola()) {
    html += '<label class="lbl" id="t-judul">Uraian baru</label><input id="t-uraian">' +
      '<div class="grid2"><div><label class="lbl">Penanggung jawab</label><input id="t-pj"></div>' +
      '<div><label class="lbl">Tenggat (teks)</label><input id="t-tenggat" placeholder="cth. Jumat depan"></div></div>' +
      '<label class="lbl">Tenggat (tanggal)</label><input id="t-tanggal" type="date">' +
      '<div class="rowflex" style="margin-top:12px"><button type="button" class="btn primary small" id="t-tambah">Tambah Tugas</button>' +
      '<button type="button" class="btn ghost small" id="t-batal-edit" style="display:none">Batal Edit</button></div>';
  }
  html += '</div>';
  wadah.innerHTML = html;
  var btns = wadah.querySelectorAll('[data-tl]');
  for (var i = 0; i < btns.length; i++) btns[i].addEventListener('click', function () {
    run('apiUbahStatusTindakLanjut', Number(this.getAttribute('data-id')), this.getAttribute('data-tl'), gagal, function () { tampilDetail(m.id, 'tindak'); });
  });
  var hps = wadah.querySelectorAll('[data-tl-hapus]');
  for (var j = 0; j < hps.length; j++) hps[j].addEventListener('click', function () {
    run('apiHapusTindakLanjut', Number(this.getAttribute('data-tl-hapus')), gagal, function () { tampilDetail(m.id, 'tindak'); });
  });
  var editTlId = null;
  var eds = wadah.querySelectorAll('[data-tl-edit]');
  for (var e = 0; e < eds.length; e++) eds[e].addEventListener('click', function () {
    var fid = Number(this.getAttribute('data-tl-edit'));
    var f = null;
    res.tindakLanjut.forEach(function (x) { if (x.id === fid) f = x; });
    if (!f) return;
    editTlId = fid;
    document.getElementById('t-uraian').value = f.uraian;
    document.getElementById('t-pj').value = f.penanggungJawab || '';
    document.getElementById('t-tenggat').value = f.tenggatText || '';
    document.getElementById('t-tanggal').value = f.tenggatDate || '';
    document.getElementById('t-judul').textContent = 'Sunting tugas';
    document.getElementById('t-tambah').textContent = 'Simpan Perubahan';
    document.getElementById('t-batal-edit').style.display = '';
    document.getElementById('t-uraian').scrollIntoView({ behavior: 'smooth' });
  });
  var btnBatalEdit = document.getElementById('t-batal-edit');
  if (btnBatalEdit) btnBatalEdit.addEventListener('click', function () { tampilDetail(m.id, 'tindak'); });
  var btnTambah = document.getElementById('t-tambah');
  if (btnTambah) btnTambah.addEventListener('click', function () {
    var dataTl = {
      uraian: document.getElementById('t-uraian').value,
      penanggungJawab: document.getElementById('t-pj').value,
      tenggatText: document.getElementById('t-tenggat').value,
      tenggatDate: document.getElementById('t-tanggal').value
    };
    if (editTlId) {
      run('apiUbahTindakLanjut', editTlId, dataTl, gagal, function () { tampilDetail(m.id, 'tindak'); });
    } else {
      run('apiTambahTindakLanjut', m.id, dataTl, gagal, function () { tampilDetail(m.id, 'tindak'); });
    }
  });
}

function rekapHtml(r) {
  var h = '<div class="card"><div class="rowflex" style="justify-content:space-between"><b>' + esc(r.nama) + '</b><span class="pill teal">Rekap otomatis</span></div>' +
    '<p class="muted">' + esc(r.tanggalPanjang) + ' · ' + esc(r.jamMulai) + ' WIB' + (r.tempat ? ' · ' + esc(r.tempat) : '') + '</p>' +
    '<p style="margin:8px 0 0"><span class="pill teal">Hadir ' + r.hadir + '</span> <span class="pill amber">Terlambat ' + r.terlambat + '</span> <span class="pill indigo">Izin ' + r.izin + '</span> <span class="pill red">Alpa ' + r.alpa + '</span> <span class="pill slate">dari ' + r.undangan + ' undangan</span></p>';
  if (r.keputusan && r.keputusan.length) {
    h += '<p style="margin:10px 0 0"><b>Keputusan</b></p><ul style="margin:4px 0 0;padding-left:20px">';
    r.keputusan.slice(0, 4).forEach(function (k) { h += '<li>' + esc(k) + '</li>'; });
    if (r.keputusan.length > 4) h += '<li>…dan ' + (r.keputusan.length - 4) + ' keputusan lain</li>';
    h += '</ul>';
  } else {
    h += '<p class="muted" style="margin-top:10px">Keputusan belum tercatat di notulen rapat ini.</p>';
  }
  h += '<p class="muted">' + (r.tindakTerbuka && r.tindakTerbuka.length
    ? r.tindakTerbuka.length + ' tindak lanjut belum selesai — paling dekat: ' + esc(r.tindakTerbuka[0].uraian)
    : 'Semua tindak lanjut sudah selesai.') + '</p>' +
    '<div class="rowflex"><button type="button" class="btn teal small" data-bagikan-rekap="' + r.meetingId + '">Bagikan Rekap</button>' +
    '<button type="button" class="btn ghost small" data-buka="' + r.meetingId + '">Buka Ruang Rapat</button></div>' +
    '<div id="rekap-hasil-' + r.meetingId + '"></div></div>';
  return h;
}

// Mengikat tombol Bagikan Rekap di dalam wadah: share sistem bila
// tersedia, cadangan salin teks — teksnya siap tempel ke grup
// WhatsApp/Telegram.
function ikatBagikanRekap(wadah, daftarRekap) {
  var peta = {};
  (daftarRekap || []).forEach(function (r) { peta[r.meetingId] = r; });
  var btns = wadah.querySelectorAll('[data-bagikan-rekap]');
  for (var i = 0; i < btns.length; i++) {
    btns[i].addEventListener('click', function () {
      var r = peta[Number(this.getAttribute('data-bagikan-rekap'))];
      if (!r) return;
      var kotak = document.getElementById('rekap-hasil-' + r.meetingId);
      function selesai(teks) { if (kotak) kotak.innerHTML = '<div class="okbox">' + esc(teks) + '</div>'; }
      if (navigator.share) {
        navigator.share({ title: 'Rekap Rapat — ' + r.nama, text: r.teks }).then(function () {
          selesai('Rekap dibagikan ✓');
        }).catch(function () { /* dibatalkan pengguna */ });
      } else if (navigator.clipboard) {
        navigator.clipboard.writeText(r.teks).then(function () {
          selesai('Teks rekap tersalin — tempel ke WhatsApp/Telegram ✓');
        }).catch(function () { selesai('Gagal menyalin — salin manual dari Arsip versi Muse.'); });
      } else {
        selesai('Perangkat ini tidak mendukung Bagikan/Salin.');
      }
    });
  }
}

function tampilLinimasa() {
  var view = renderShell('linimasa');
  view.innerHTML = memuatHtml('Memuat linimasa…');
  run('apiBeranda', gagal, function (res) {
    LIVE = res.liveMeeting || null;
    perbaruiFab();
    var jam = new Date().getHours();
    var salam = jam < 11 ? 'Selamat pagi' : jam < 15 ? 'Selamat siang' : jam < 19 ? 'Selamat sore' : 'Selamat malam';
    var peranKet = USER.peran === 'Admin' ? 'Admin melihat & mengelola semuanya.'
      : USER.peran === 'Notulis' ? 'Notulis mengelola rapat, presensi, notulen & dokumen — tanpa Pengaturan & Template.'
      : 'Pimpinan membaca rapat & notulen dan menyetujui notulen — tanpa tombol kelola.';
    var html = '<p style="margin:14px 0 0;font-size:14px;font-weight:600;color:#5B5B78">' + salam + ',</p>' +
      '<h2 style="margin:2px 0 0;font-size:24px;font-weight:800;line-height:1.3">Rapat rapi, presensi tercatat, notulen jadi.</h2>' +
      '<div class="peranrow"><span class="peranket">Peran aktif:</span><span class="pill solid">' + esc(USER.peran) + '</span><span class="muted" style="font-size:12.5px">' + peranKet + '</span></div>' +
      '<p class="muted" style="font-size:12.5px;margin:6px 0 0">Masuk sebagai ' + esc(USER.nama && USER.nama !== USER.email ? USER.nama + ' · ' : '') + esc(USER.email) + '</p>' +
      '<input id="cari-rapat" class="searchbox" type="search" placeholder="Cari rapat, tempat, pimpinan…" aria-label="Cari rapat, tempat, pimpinan">' +
      '<div id="hasil-cari"></div><div id="beranda-isi">';
    if (res.liveMeeting) {
      var lm = res.liveMeeting;
      var dijeda = lm.status === 'Dijeda';
      html += '<button type="button" class="hero-live" data-buka="' + lm.id + '"><span class="livepill"><span class="dot"></span>' + (dijeda ? 'DIJEDA' : 'SEDANG BERLANGSUNG') + '</span>' +
        '<span class="nama">' + esc(lm.nama) + '</span>' +
        '<span class="ket">' + (dijeda ? 'Sedang dijeda' + (lm.pauseReason ? ' — ' + esc(lm.pauseReason) : '') + ' · ' : '') + lm.counts.hadir + ' dari ' + lm.counts.undangan + ' undangan sudah hadir · ketuk untuk masuk Ruang Rapat Live</span></button>';
    }
    if (bisaKelola()) {
      html += '<button type="button" class="hero-buat" id="hero-buat"><span class="nama">Buat Rapat Baru</span>' +
        '<span class="ket">Siapkan presensi QR berputar, tanda tangan peserta, dan notulen AI dalam satu sesi.</span>' +
        '<span class="cta">Buat Sekarang →</span></button>';
    }
    if (res.undanganBelum.length) {
      html += '<div class="sectitle">Undangan belum dibagikan</div>';
      res.undanganBelum.forEach(function (p) {
        html += '<div class="card"><div class="rowflex" style="justify-content:space-between"><b>' + esc(p.nama) + '</b><span class="pill amber">' + p.belumDibagikan + ' peserta belum menerima</span></div>' +
          '<p class="muted">' + esc(p.tanggalPanjang) + ' · ' + esc(p.jamMulai) + ' WIB</p>' +
          '<p class="muted">Undangan rapat ini belum dibagikan ke semua peserta — kirim teks undangan atau tautan presensinya ke grup WhatsApp/Telegram agar peserta menerima pemberitahuan.</p>' +
          (bisaKelola() ? '<button type="button" class="btn primary small" data-bagikan="' + p.meetingId + '">Bagikan Undangan</button>' : '') + '</div>';
      });
    }
    // Fase 5 — Pengingat: rapat H-3/H-1/hari-H + tindak lanjut yang
    // lewat/mendekati tenggat, dengan tombol langsung ke tugasnya.
    if ((res.pengingatRapat && res.pengingatRapat.length) || (res.pengingatTindak && res.pengingatTindak.length)) {
      html += '<div class="sectitle">Pengingat</div>';
      (res.pengingatRapat || []).forEach(function (p) {
        var barisHh = '';
        if (p.tonggak === 'Hari-H' && p.hariH && p.hariH.length) {
          var bagianHh = p.hariH.map(function (h) {
            return h.kode === 'PAGI' ? 'pagi pukul ' + h.pukul
              : h.kode === 'H-5J' ? '5 jam sebelum (pukul ' + h.pukul + ')'
              : '2 jam sebelum (pukul ' + h.pukul + ')';
          });
          barisHh = '<p class="muted">Pengingat hari ini: ' + esc(bagianHh.join(' · ')) + ' — masing-masing terkirim sekali.</p>';
        }
        html += '<div class="card' + (p.tonggak === 'Hari-H' ? ' segera' : '') + '"><div class="rowflex" style="justify-content:space-between"><b>' + esc(p.nama) + '</b>' +
          '<span class="pill ' + (p.tonggak === 'Hari-H' ? 'teal' : p.tonggak === 'H-1' ? 'red' : 'amber') + '">' +
          (p.tonggak === 'Hari-H' ? 'Hari ini' : p.tonggak === 'H-1' ? 'Besok (H-1)' : '3 hari lagi (H-3)') + '</span></div>' +
          '<p class="muted">' + esc(p.tanggalPanjang) + ' · ' + esc(p.jamMulai) + ' WIB' + (p.tempat ? ' · ' + esc(p.tempat) : '') + '</p>' + barisHh +
          '<div class="rowflex"><button type="button" class="btn primary small" data-buka="' + p.meetingId + '">Buka Rapat</button>' +
          (bisaKelola() ? '<button type="button" class="btn ghost small" data-bagikan="' + p.meetingId + '">Bagikan Undangan</button>' : '') + '</div></div>';
      });
      (res.pengingatTindak || []).forEach(function (f) {
        var ts = f.tenggatStatus || {};
        html += '<div class="card' + (ts.jenis === 'lewat' ? ' lewat' : ' segera') + '"><div class="rowflex" style="justify-content:space-between"><b>' + esc(f.uraian) + '</b>' +
          '<span class="pill ' + (ts.jenis === 'lewat' || ts.jenis === 'hari-ini' ? 'red' : ts.jenis === 'h-1' ? 'amber' : 'slate') + '">' + esc(f.tenggatLabel || '') + '</span></div>' +
          '<p class="muted">' + esc(f.meetingNama) + (f.penanggungJawab ? ' · PJ: ' + esc(f.penanggungJawab) : '') + '</p>' +
          '<div class="rowflex"><button type="button" class="btn primary small" id="ke-tindak-' + f.id + '">Buka Tugasnya</button></div></div>';
      });
      html += '<p class="muted" style="margin-top:8px">Pengingat tampil di Linimasa ini sepanjang hari. Pada hari-H rapat diingatkan tiga kali: pagi pukul ' + esc((res.pengingatSetelan || {}).jam || '07:00') + ' WIB (diatur Admin di Pengaturan), 5 jam sebelum mulai, dan 2 jam sebelum mulai — masing-masing sekali, sebagai notifikasi sistem di perangkat penyelenggara bila izinnya aktif dan lewat Telegram bila kanal Telegram dihidupkan. Setiap jenis bisa dimatikan di Pengaturan. Peserta dijangkau lewat teks undangan WhatsApp/Telegram dari tombol Bagikan Undangan.</p>';
    }
    html += '<div class="sectitle">Rapat hari ini <button type="button" class="link" id="semua-rapat">Semua rapat</button></div>';
    if (!res.rapatHariIni.length) html += '<div class="kosong"><p class="t">Tidak ada rapat hari ini</p><p class="muted">Rapat yang dijadwalkan untuk hari ini akan muncul di sini, lengkap dengan tombol masuk Ruang Rapat.</p></div>';
    res.rapatHariIni.forEach(function (m) { html += kartuRapatHtml(m); });
    if (res.rapatAkanDatang.length) {
      html += '<div class="sectitle">Akan datang</div>';
      res.rapatAkanDatang.forEach(function (m) { html += kartuRapatHtml(m); });
    }
    if (res.jumlahTindakTerbuka > 0) {
      html += '<div class="sectitle">Tindak lanjut belum selesai <button type="button" class="link" id="semua-tindak">Lihat semua</button></div>' +
        '<div class="card"><p class="muted" style="margin-top:0">' + res.jumlahTindakTerbuka + ' tugas belum selesai dari semua rapat.</p>';
      res.tindakTerbuka.forEach(function (f) {
        html += '<p style="margin:10px 0 0"><b>' + esc(f.uraian) + '</b>' +
          (f.tenggatStatus ? ' <span class="pill ' + (f.tenggatStatus.jenis === 'lewat' || f.tenggatStatus.jenis === 'hari-ini' ? 'red' : f.tenggatStatus.jenis === 'h-1' ? 'amber' : 'slate') + '">' + esc(f.tenggatLabel) + '</span>' : '') +
          '<br><span class="muted">' + esc(f.meetingNama) +
          (f.penanggungJawab ? ' · PJ: ' + esc(f.penanggungJawab) : '') +
          (f.tenggatText || f.tenggatDate ? ' · Tenggat: ' + esc(f.tenggatText || f.tenggatDate) : '') + '</span></p>';
      });
      html += '</div>';
    }
    if (res.rekapTerbaru && res.rekapTerbaru.length) {
      html += '<div class="sectitle">Rekap rapat selesai <button type="button" class="link" id="semua-rekap">Semua rekap di Arsip</button></div>';
      res.rekapTerbaru.forEach(function (r) { html += rekapHtml(r); });
    }
    var tglFmt = (res.tanggalHariIni || '').split('-').reverse().join('-');
    html += '<p class="muted" style="text-align:center;margin-top:24px;font-size:12.5px">Hari ini: ' + esc(tglFmt) + '</p>' +
      '<p class="muted" style="text-align:center;margin-top:6px;font-size:12.5px">SesiRapat · versi tools yang berjalan: <b style="color:#191932">' + esc(res.versi || '') + '</b> (versi Google) — termasuk pengingat hari-H 5 jam &amp; 2 jam sebelum mulai.</p>';
    html += '</div>';
    view.innerHTML = html;
    ikatBuka(view);
    ikatBagikanRekap(view, res.rekapTerbaru || []);
    var srk = document.getElementById('semua-rekap');
    if (srk) srk.addEventListener('click', tampilArsip);
    (res.pengingatTindak || []).forEach(function (f) {
      var b = document.getElementById('ke-tindak-' + f.id);
      if (b) b.addEventListener('click', tampilTindakLanjut);
    });
    // Fase 5 — notifikasi sistem di perangkat penyelenggara: sekali
    // per item per hari, hanya bila izin notifikasi sudah diberikan
    // (permintaan izin ada di panel Bagikan Undangan / keterangan
    // Pengaturan). Dedupe localStorage. Item biasa menunggu jam
    // pengingat; pengingat hari-H 5 jam & 2 jam sebelum mulai
    // (Fase 5.1) membawa waktu kirimnya sendiri (sejak).
    try {
      if ('Notification' in window && Notification.permission === 'granted' && res.pengingatSetelan) {
        var jamNow = ('0' + new Date().getHours()).slice(-2) + ':' + ('0' + new Date().getMinutes()).slice(-2);
        var jamLewatN = jamNow >= (res.pengingatSetelan.jam || '07:00');
        var hariKey = res.tanggalHariIni || '';
        var calon = [];
        (res.pengingatRapat || []).forEach(function (p) {
          if (p.tonggak !== 'Hari-H') {
            calon.push({
              kunci: 'rapat-' + p.meetingId + '-' + p.tonggak,
              judul: '⏰ Pengingat rapat ' + p.tonggak + ': ' + p.nama,
              isi: p.tanggalPanjang + ' · ' + p.jamMulai + ' WIB' + (p.tempat ? ' · ' + p.tempat : '')
            });
            return;
          }
          (p.hariH || []).forEach(function (h) {
            if (h.kode === 'PAGI') {
              calon.push({
                kunci: 'rapat-' + p.meetingId + '-Hari-H',
                judul: '⏰ Rapat hari ini: ' + p.nama,
                isi: p.tanggalPanjang + ' · ' + p.jamMulai + ' WIB' + (p.tempat ? ' · ' + p.tempat : '')
              });
            } else {
              calon.push({
                kunci: 'rapat-' + p.meetingId + '-' + h.kode,
                sejak: h.sejak,
                judul: '⏰ ' + (h.kode === 'H-5J' ? '5 jam lagi: ' : '2 jam lagi: ') + p.nama,
                isi: 'Rapat mulai pukul ' + p.jamMulai + ' WIB' + (p.tempat ? ' · ' + p.tempat : '')
              });
            }
          });
        });
        (res.pengingatTindak || []).forEach(function (f) {
          calon.push({
            kunci: 'tindak-' + f.id + '-' + (f.tenggatStatus ? f.tenggatStatus.jenis : ''),
            judul: '📌 Tindak lanjut — ' + (f.tenggatLabel || 'mendekati tenggat'),
            isi: f.uraian + (f.penanggungJawab ? ' · ' + f.penanggungJawab : '') + ' · dari ' + f.meetingNama
          });
        });
        var sekarangMs = new Date().getTime();
        calon.filter(function (c) {
          return c.sejak ? sekarangMs >= Date.parse(c.sejak) : jamLewatN;
        }).slice(0, 6).forEach(function (c) {
          var kunci = 'sesirapat.pengingat.' + hariKey + ':' + c.kunci;
          try { if (localStorage.getItem(kunci) === '1') return; } catch (eL) { /* lanjut */ }
          try {
            new Notification(c.judul, { body: c.isi, tag: 'sesirapat-pengingat-' + c.kunci });
            try { localStorage.setItem(kunci, '1'); } catch (eL2) { /* abaikan */ }
          } catch (eN) { /* notifikasi tidak tersedia di konteks ini */ }
        });
      }
    } catch (eNotif) { /* abaikan — pengingat tetap tampil di Linimasa */ }
    var hb = document.getElementById('hero-buat');
    if (hb) hb.addEventListener('click', function () { BUAT_BARU = true; tampilDaftarRapat(); });
    var sr = document.getElementById('semua-rapat');
    if (sr) sr.addEventListener('click', tampilDaftarRapat);
    var st = document.getElementById('semua-tindak');
    if (st) st.addEventListener('click', tampilTindakLanjut);
    var bag = view.querySelectorAll('[data-bagikan]');
    for (var i = 0; i < bag.length; i++) bag[i].addEventListener('click', function () {
      tampilDetail(Number(this.getAttribute('data-bagikan')), 'presensi');
    });
    var cari = document.getElementById('cari-rapat');
    cari.addEventListener('input', function () {
      var q = cari.value.toLowerCase();
      var kotak = document.getElementById('hasil-cari');
      var isi = document.getElementById('beranda-isi');
      if (!q) { kotak.innerHTML = ''; isi.classList.remove('hidden'); return; }
      isi.classList.add('hidden');
      var cocok = (res.semuaRapat || []).filter(function (m) {
        return (m.nama + ' ' + (m.tempat || '') + ' ' + (m.pimpinan || '')).toLowerCase().indexOf(q) !== -1;
      });
      var h = '<div class="sectitle">Hasil pencarian</div>';
      if (!cocok.length) h += '<div class="card"><h3>Tidak ada rapat yang cocok</h3><p class="muted">Coba kata kunci lain — nama rapat, tempat, atau pimpinan rapat.</p></div>';
      cocok.forEach(function (m) { h += kartuRapatHtml(m); });
      kotak.innerHTML = h;
      ikatBuka(kotak);
    });
  });
}

// Tindak Lanjut global — semua tugas lintas rapat

var TL_FILTER = 'Semua';
function tampilTindakLanjut() {
  var view = renderShell('tindak');
  view.innerHTML = memuatHtml('Memuat tindak lanjut…');
  run('apiSemuaTindakLanjut', gagal, function (res) {
    var lewatN = res.items.filter(function (f) { return f.tenggatStatus && f.tenggatStatus.jenis === 'lewat'; }).length;
    var dekatN = res.items.filter(function (f) { return f.tenggatStatus && f.tenggatStatus.jenis !== 'lewat'; }).length;
    var html = '<h2 style="margin:14px 0 0;font-size:23px;font-weight:800">Tindak Lanjut</h2>' +
      '<p class="muted">Semua tugas dari seluruh rapat — pantau yang belum selesai, tandai selesai saat tuntas.</p>' +
      (lewatN || dekatN
        ? '<div class="err" role="status">⚠ ' + (lewatN ? lewatN + ' tugas sudah lewat tenggat' : 'Tidak ada tugas lewat tenggat') +
          (dekatN ? ' · ' + dekatN + ' tugas mendekati tenggat (H-3/H-1/hari ini)' : '') +
          ' — ditandai merah/kuning, diurutkan paling atas, dan pengingatnya muncul di Linimasa' + (USER.peran !== 'Pimpinan' ? ' serta dikirim ke Telegram bila kanal Telegram aktif di Pengaturan' : '') + '.</div>'
        : '') +
      '<div class="chiprow">' +
      ['Semua', 'Belum', 'Proses', 'Selesai'].map(function (s) {
        return '<button type="button" data-filter="' + s + '" class="' + (TL_FILTER === s ? 'active' : '') + '">' + s + '</button>';
      }).join('') + '</div><div id="tl-daftar"></div>';
    if (bisaKelola()) {
      var opsi = res.meetings.map(function (m) { return '<option value="' + m.id + '">' + esc(m.nama) + '</option>'; }).join('');
      html += '<div class="card" id="gt-form"><h3>Tambah tugas</h3>' +
        '<label class="lbl">Rapat</label><select id="gt-rapat">' + opsi + '</select>' +
        '<label class="lbl">Uraian *</label><input id="gt-uraian">' +
        '<div class="grid2"><div><label class="lbl">Penanggung jawab</label><input id="gt-pj"></div>' +
        '<div><label class="lbl">Tenggat (teks)</label><input id="gt-tenggat" placeholder="cth. Jumat depan"></div></div>' +
        '<label class="lbl">Tenggat (tanggal)</label><input id="gt-tanggal" type="date">' +
        '<div style="margin-top:12px"><button type="button" class="btn primary small" id="gt-tambah">Tambah Tugas</button></div></div>';
    }
    view.innerHTML = html;
    function gambar() {
      var rows = res.items.filter(function (f) { return TL_FILTER === 'Semua' || f.status === TL_FILTER; });
      var h = '';
      if (!rows.length) h = '<div class="card"><p class="muted">Tidak ada tugas pada saringan ini.</p></div>';
      rows.forEach(function (f) {
        var ts = f.tenggatStatus;
        h += '<div class="card' + (ts && ts.jenis === 'lewat' ? ' lewat' : ts ? ' segera' : '') + '"><div class="rowflex" style="justify-content:space-between"><b>' + esc(f.uraian) + '</b>' +
          '<span>' + (ts ? '<span class="pill ' + (ts.jenis === 'lewat' || ts.jenis === 'hari-ini' ? 'red' : ts.jenis === 'h-1' ? 'amber' : 'slate') + '">' + esc(f.tenggatLabel) + '</span> ' : '') +
          (f.status === 'Selesai' ? '<span class="pill teal">Selesai</span>' : f.status === 'Proses' ? '<span class="pill amber">Proses</span>' : '<span class="pill slate">Belum</span>') + '</span></div>' +
          '<p class="muted">' + esc(f.meetingNama) + (f.penanggungJawab ? ' · PJ: ' + esc(f.penanggungJawab) : '') +
          (f.tenggatText || f.tenggatDate ? ' · Tenggat: ' + esc(f.tenggatText || f.tenggatDate) : '') + '</p>' +
          '<div class="rowflex"><button type="button" class="btn ghost small" data-ke-rapat="' + f.meetingId + '">Buka Rapat</button>';
        if (bisaKelola()) {
          if (f.status !== 'Proses') h += '<button type="button" class="btn ghost small" data-tl="Proses" data-id="' + f.id + '">Proses</button>';
          if (f.status !== 'Selesai') h += '<button type="button" class="btn teal small" data-tl="Selesai" data-id="' + f.id + '">Selesai</button>';

        h += '</div></div>';
      });
      var wadah = document.getElementById('tl-daftar');
      wadah.innerHTML = h;

      for (var i = 0; i < bs.length; i++) bs[i].addEventListener('click', function () {

      });
      var hs = wadah.querySelectorAll('[data-tl-hapus]');
      for (var j = 0; j < hs.length; j++) hs[j].addEventListener('click', function () {
        run('apiHapusTindakLanjut', Number(this.getAttribute('data-tl-hapus')), gagal, tampilTindakLanjut);
      });
      var kr = wadah.querySelectorAll('[data-ke-rapat]');
      for (var k = 0; k < kr.length; k++) kr[k].addEventListener('click', function () {
        tampilDetail(Number(this.getAttribute('data-ke-rapat')), 'tindak');
      });
      var ed = wadah.querySelectorAll('[data-tl-edit]');
      for (var n = 0; n < ed.length; n++) ed[n].addEventListener('click', function () {
        tampilDetail(Number(this.getAttribute('data-tl-edit')), 'tindak');
      });
    }
    gambar();
    var chips = view.querySelectorAll('[data-filter]');
    for (var c = 0; c < chips.length; c++) chips[c].addEventListener('click', function () {
      TL_FILTER = this.getAttribute('data-filter');
      var semuaChip = view.querySelectorAll('[data-filter]');
      for (var x = 0; x < semuaChip.length; x++) {
        if (semuaChip[x] === this) semuaChip[x].classList.add('active');
        else semuaChip[x].classList.remove('active');
      }
      gambar();
    });
    var btnT = document.getElementById('gt-tambah');
    if (btnT) btnT.addEventListener('click', function () {
      var mid = document.getElementById('gt-rapat').value;
      if (!mid) { gagal('Belum ada rapat — buat rapat dulu sebelum menambah tugas.'); return; }
      run('apiTambahTindakLanjut', Number(mid), {
        uraian: document.getElementById('gt-uraian').value,
        penanggungJawab: document.getElementById('gt-pj').value,

        tenggatDate: document.getElementById('gt-tanggal').value
      }, gagal, tampilTindakLanjut);
    });
  });
}

      var id = this.getAttribute('data-hapus-dok');

      if (kotak.innerHTML) { kotak.innerHTML = ''; return; }
      kotak.innerHTML = '<div class="warnbox" style="margin-top:10px"><b>Hapus dokumen ' + esc(reg) + '?</b><br>' +
        '<span class="muted">Dokumen hilang dari arsip dan berkasnya di Drive (PDF, Docs, DOCX) dipindah ke sampah. Nomor register ini tidak dipakai ulang.</span>' +
        '<div class="rowflex" style="margin-top:8px"><button type="button" class="btn danger small" id="konf-dok-ya-' + id + '">Ya, Hapus Dokumen</button>' +

// --- Impor spreadsheet (.xlsx/.csv) — port dari versi Muse
// (client/src/lib/spreadsheet.ts + ZIP reader docx.ts): berkas dibaca di
// peramban, kolom Nama/NIP/Jabatan/Unit/Kelompok dideteksi dari header
// dan bisa disesuaikan, lalu baris bersih dikirim ke apiImporPeserta
// untuk disimpan ke sheet Peserta + Kelompok SesiRapat_DB.
function imporU16(b, o) { return (b[o] || 0) | ((b[o + 1] || 0) << 8); }
function imporU32(b, o) { return ((b[o] || 0) | ((b[o + 1] || 0) << 8) | ((b[o + 2] || 0) << 16) | ((b[o + 3] || 0) << 24)) >>> 0; }
function imporInflate(data) {
  var ds = new DecompressionStream('deflate-raw');
  var stream = new Blob([data]).stream().pipeThrough(ds);
  return new Response(stream).arrayBuffer().then(function (buf) { return new Uint8Array(buf); });
}
function imporZipBaca(buf) {
  var b = new Uint8Array(buf);
  var eocd = -1;
  var min = Math.max(0, b.length - 66000);
  for (var i = b.length - 22; i >= min; i--) {
    if (imporU32(b, i) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) return Promise.reject(new Error('File tidak valid: akhir arsip ZIP tidak ditemukan.'));
  var count = imporU16(b, eocd + 10);
  var off = imporU32(b, eocd + 16);
  var entries = [];
  var decoder = new TextDecoder();
  var chain = Promise.resolve();
  for (var n = 0; n < count; n++) {
    if (imporU32(b, off) !== 0x02014b50) break;
    var method = imporU16(b, off + 10);
    var compSize = imporU32(b, off + 20);
    var nameLen = imporU16(b, off + 28);
    var extraLen = imporU16(b, off + 30);
    var commentLen = imporU16(b, off + 32);
    var localOff = imporU32(b, off + 42);
    var name = decoder.decode(b.slice(off + 46, off + 46 + nameLen));
    var lNameLen = imporU16(b, localOff + 26);
    var lExtraLen = imporU16(b, localOff + 28);
    var dataStart = localOff + 30 + lNameLen + lExtraLen;
    var raw = b.slice(dataStart, dataStart + compSize);
    (function (namaEntri, metode, dataMentah) {
      chain = chain.then(function () {
        if (metode === 0) { entries.push({ name: namaEntri, data: dataMentah }); return null; }
        if (metode === 8) {
          return imporInflate(dataMentah).then(function (data) {
            entries.push({ name: namaEntri, data: data });
          });
        }
        throw new Error('Metode kompresi ZIP tidak didukung: ' + metode);
      });
    })(name, method, raw);
    off += 46 + nameLen + extraLen + commentLen;
  }
  return chain.then(function () { return entries; });
}
function imporXmlUnescape(s) {
  return s.split('&lt;').join('<').split('&gt;').join('>').split('&quot;').join('"').split('&apos;').join("'").split('&amp;').join('&');
}
function imporSharedStrings(xml) {
  var out = [];
  var siRe = /<si>([\s\S]*?)<\/si>/g;
  var m;
  while ((m = siRe.exec(xml)) !== null) {
    var inner = m[1] || '';
    var text = '';
    var tRe = /<t(?:\s[^>]*)?>([\s\S]*?)<\/t>/g;
    var tm;
    while ((tm = tRe.exec(inner)) !== null) text += imporXmlUnescape(tm[1] || '');
    out.push(text);
  }
  return out;
}
function imporKolomIdx(ref) {
  var huruf = /^[A-Z]+/.exec(ref);
  var s = huruf ? huruf[0] : '';
  var idx = 0;
  for (var i = 0; i < s.length; i++) idx = idx * 26 + (s.charCodeAt(i) - 64);
  return idx - 1;
}
function imporSheetGrid(xml, shared) {
  var rows = [];
  var rowRe = /<row[^>]*>([\s\S]*?)<\/row>/g;
  var rm;
  while ((rm = rowRe.exec(xml)) !== null) {
    var rowXml = rm[1] || '';
    var cells = [];
    var cellRe = /<c\b([^>]*)>([\s\S]*?)<\/c>|<c\b([^>]*)\/>/g;
    var cm;
    while ((cm = cellRe.exec(rowXml)) !== null) {
      var attrs = cm[1] || cm[3] || '';
      var inner = cm[2] || '';
      var refM = /r="([A-Z]+\d+)"/.exec(attrs);
      var typeM = /t="([a-zA-Z]+)"/.exec(attrs);
      var type = typeM ? typeM[1] : '';
      var value = '';
      if (type === 'inlineStr') {
        var tRe2 = /<t(?:\s[^>]*)?>([\s\S]*?)<\/t>/g;
        var tm2;
        while ((tm2 = tRe2.exec(inner)) !== null) value += imporXmlUnescape(tm2[1] || '');
      } else {
        var vM = /<v>([\s\S]*?)<\/v>/.exec(inner);
        var v = vM ? vM[1] : '';
        if (type === 's') value = shared[Number(v)] || '';
        else if (type === 'b') value = v === '1' ? 'TRUE' : 'FALSE';
        else value = imporXmlUnescape(v);
      }
      var idx = refM ? imporKolomIdx(refM[1]) : cells.length;
      while (cells.length < idx) cells.push('');
      cells[idx] = value.replace(/^\s+|\s+$/g, '');
    }

}
function imporXlsxGrid(buf) {
  return imporZipBaca(buf).then(function (entries) {
    var byName = {};
    entries.forEach(function (e) { byName[e.name] = e; });
    var shared = byName['xl/sharedStrings.xml']
      ? imporSharedStrings(new TextDecoder().decode(byName['xl/sharedStrings.xml'].data))
      : [];
    var sheetName = '';
    entries.forEach(function (e) {
      if (!sheetName && /^xl\/worksheets\/sheet\d+\.xml$/.test(e.name)) sheetName = e.name;
    });
    var wb = byName['xl/workbook.xml'];
    var rels = byName['xl/_rels/workbook.xml.rels'];
    if (wb && rels) {
      var wbXml = new TextDecoder().decode(wb.data);
      var relsXml = new TextDecoder().decode(rels.data);
      var fsM = /<sheet[^>]*r:id="(rId\d+)"/.exec(wbXml);
      if (fsM) {
        var tM = new RegExp('Id="' + fsM[1] + '"[^>]*Target="([^"]+)"').exec(relsXml);
        if (tM) {
          var target = tM[1].charAt(0) === '/' ? tM[1].slice(1) : tM[1];
          var norm = target.indexOf('xl/') === 0 ? target : 'xl/' + target;
          if (byName[norm]) sheetName = norm;
        }
      }
    }
    if (!sheetName || !byName[sheetName]) throw new Error('File .xlsx tidak berisi lembar kerja (worksheet).');
    return imporSheetGrid(new TextDecoder().decode(byName[sheetName].data), shared);
  });
}
function imporCsvGrid(text) {

  var delim = firstLine.indexOf(';') >= 0 ? ';' : (firstLine.indexOf(TAB) >= 0 ? TAB : ',');
  var rows = [];
  var row = [];
  var cell = '';
  var inQ = false;
  for (var i = 0; i < clean.length; i++) {
    var ch = clean.charAt(i);
    if (inQ) {
      if (ch === '"') {
        if (clean.charAt(i + 1) === '"') { cell += '"'; i++; } else inQ = false;
      } else cell += ch;
    } else if (ch === '"') {
      inQ = true;
    } else if (ch === delim) {
      row.push(cell.replace(/^\s+|\s+$/g, ''));
      cell = '';

          (IMPOR_HASIL ? '<div class="okbox">' + esc(IMPOR_HASIL) + '</div>' : '') +
          '<div class="rowflex"><label class="btn primary small" style="cursor:pointer">Pilih Berkas Excel / CSV' +
          '<input type="file" id="imp-file" accept=".xlsx,.csv,.tsv,.txt,.xls" style="display:none" aria-label="Pilih berkas Excel atau CSV daftar peserta"></label>' +
          '<button type="button" class="btn ghost small" id="imp-contoh">Unduh Contoh Format (.xlsx)</button></div>' +
          '<div id="imp-status"></div>';
        document.getElementById('imp-contoh').addEventListener('click', function () {
          unduhBytesImpor(imporContohXlsx(), 'contoh-format-peserta.xlsx', 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
        });
        document.getElementById('imp-file').addEventListener('change', function () {
          var berkas = this.files && this.files[0];
          this.value = '';
          if (!berkas) return;
          var status = document.getElementById('imp-status');
          status.innerHTML = '<p class="muted"><span class="spin"></span> Membaca berkas…</p>';
          imporBacaBerkas(berkas).then(function (hasil) {
            IMP = { fileName: berkas.name, rows: hasil.rows, headerIndex: hasil.headerIndex, mapping: hasil.mapping, tujuan: '' };
            IMPOR_HASIL = null;
            gambarImpor();
          }, function (e) {
            status.innerHTML = '<div class="err">' + esc(e && e.message ? e.message : String(e)) + '</div>';
          });
        });
        return;
      }
      var baris = imporBaris(IMP.rows, IMP.headerIndex, IMP.mapping);
      var headerRow = IMP.rows[IMP.headerIndex] || [];
      var kolomOpsi = headerRow.map(function (h, i) {
        return { idx: i, label: String(h).replace(/^s+|s+$/g, '') || ('Kolom ' + (i + 1)) };
      });
      var h = '<p><b>' + esc(IMP.fileName) + '</b> — ' + baris.length + ' baris peserta terbaca</p>' +
        '<p class="muted">Pemetaan kolom (cek &amp; sesuaikan bila perlu)</p><div class="grid2">';
      IMPOR_FIELD.forEach(function (f) {
        h += '<div><label class="lbl" for="imp-map-' + f.key + '">' + f.label + (f.key === 'nama' ? ' *' : '') + '</label>' +
          '<select id="imp-map-' + f.key + '" data-imp-map="' + f.key + '"><option value="-1">— tidak ada —</option>' +
          kolomOpsi.map(function (c) {
            return '<option value="' + c.idx + '"' + (IMP.mapping[f.key] === c.idx ? ' selected' : '') + '>' + esc(c.label) + '</option>';
          }).join('') + '</select></div>';
      });
      h += '<div><label class="lbl" for="imp-tujuan">Kelompok tujuan (untuk baris tanpa kolom Kelompok)</label>' +
        '<select id="imp-tujuan"><option value="">Tanpa kelompok</option>' +
        buku.kelompok.map(function (k) {
          return '<option' + (IMP.tujuan === k ? ' selected' : '') + '>' + esc(k) + '</option>';
        }).join('') + '</select></div></div>';
      var grupBerkas = {};
      baris.forEach(function (r) {
        String(r.kelompok || '').split(/[;,]/).forEach(function (s) {
          var n = s.trim();
          if (n) grupBerkas[n] = true;
        });
      });
      var daftarGrup = [];
      for (var gk in grupBerkas) daftarGrup.push(gk);
      if (daftarGrup.length) {
        h += '<p class="muted" style="margin-top:8px">Kelompok dari berkas: ' +
          daftarGrup.map(function (g) { return '<span class="pill indigo">' + esc(g) + '</span>'; }).join(' ') +
          ' — yang belum ada akan dibuat otomatis.</p>';
      }
      h += '<div class="tblwrap" style="margin-top:10px"><table class="tbl"><tr><th>Nama</th><th>NIP</th><th>Jabatan</th><th>Unit</th><th>Kelompok</th></tr>';
      baris.slice(0, 5).forEach(function (r) {
        h += '<tr><td><b>' + esc(r.nama) + '</b></td><td>' + esc(r.nip || '—') + '</td><td>' + esc(r.jabatan || '—') + '</td><td>' + esc(r.unit || '—') + '</td><td>' + esc(r.kelompok || '—') + '</td></tr>';
      });
      h += '</table></div>';
      if (baris.length > 5) h += '<p class="muted">…dan ' + (baris.length - 5) + ' baris lainnya.</p>';
      h += '<div class="rowflex" style="margin-top:12px"><button type="button" class="btn primary small" id="imp-kirim" data-muat="Mengimpor…"' + (baris.length ? '' : ' disabled') + '>Impor ' + baris.length + ' Peserta</button>' +
        '<button type="button" class="btn ghost small" id="imp-batal">Batal</button></div><div id="imp-status"></div>';
      boxImpor.innerHTML = h;
      var maps = boxImpor.querySelectorAll('[data-imp-map]');
      for (var mi = 0; mi < maps.length; mi++) maps[mi].addEventListener('change', function () {
        IMP.mapping[this.getAttribute('data-imp-map')] = Number(this.value);
        gambarImpor();
      });
      document.getElementById('imp-tujuan').addEventListener('change', function () { IMP.tujuan = this.value; });
      document.getElementById('imp-batal').addEventListener('click', function () { IMP = null; gambarImpor(); });
      document.getElementById('imp-kirim').addEventListener('click', function () {
        var kirim = imporBaris(IMP.rows, IMP.headerIndex, IMP.mapping);
        run('apiImporPeserta', kirim, IMP.tujuan, function (pesan) {
          document.getElementById('imp-status').innerHTML = '<div class="err">' + esc(pesan) + '</div>';
        }, function (resImp) {
          IMPOR_HASIL = 'Impor selesai: ' + resImp.added + ' peserta ditambahkan' +
            (resImp.skippedDuplicates > 0 ? ', ' + resImp.skippedDuplicates + ' dilewati karena sudah ada' : '') +
            (resImp.groupsCreated.length > 0 ? '. Kelompok baru dibuat: ' + resImp.groupsCreated.join(', ') : '') + '.';
          tampilPeserta();
        });
      });
    }
    gambarImpor();
  });
}

        });
      });
      var btnPgTes = document.getElementById('pg-tes');
      if (btnPgTes) btnPgTes.addEventListener('click', function () {
        // Simpan dulu agar token/chat terbaru yang dipakai tes.
        run('apiSimpanPengaturan', {
          pengingatRapat: document.getElementById('pg-rapat').checked,
          pengingatTindak: document.getElementById('pg-tindak').checked,
          pengingatRekap: document.getElementById('pg-rekap').checked,
          pengingatJam: document.getElementById('pg-jam').value || '07:00',
          pengingatHariHPagi: document.getElementById('pg-hh-pagi').checked,
          pengingatHariH5Jam: document.getElementById('pg-hh-5').checked,
          pengingatHariH2Jam: document.getElementById('pg-hh-2').checked,
          telegramAktif: document.getElementById('pg-tg-aktif').checked,
          telegramBotToken: document.getElementById('pg-tg-token').value,
          telegramChatId: document.getElementById('pg-tg-chat').value
        }, gagal, function () {
          run('apiTesTelegram', gagal, function (r) {
            pgHasil.innerHTML = '<div class="' + (r.ok ? 'okbox' : 'err') + '">' + esc(r.detail) + '</div>';
          });
        });
      });
      var btnPgHapus = document.getElementById('pg-hapus-tg');
      if (btnPgHapus) btnPgHapus.addEventListener('click', function () {
        if (this.getAttribute('data-konfirm') !== '1') {
          this.setAttribute('data-konfirm', '1');
          this.textContent = 'Yakin hapus? Klik sekali lagi';
          return;
        }
        run('apiSimpanPengaturan', { hapusTelegram: true }, gagal, tampilPengaturan);
      });
      muatPengguna();
      muatImpor();
    }
  });
}

      '<div><label class="lbl">Nama</label><input id="u-nama"></div></div>' +
      '<label class="lbl">Peran</label><select id="u-peran"><option>Admin</option><option>Notulis</option><option>Pimpinan</option></select>' +
      '<p class="muted">Admin: semua, termasuk pengguna, pengaturan, dan impor. Notulis: rapat, peserta, presensi, notulen, tindak lanjut, terbitkan dokumen. Pimpinan: melihat semua + menyetujui/mengembalikan notulen + terbitkan dokumen.</p>' +
      '<div style="margin-top:10px"><button type="button" class="btn primary small" id="u-simpan">Simpan Pengguna</button></div><div id="u-hasil2"></div></div>';
    box.innerHTML = html;
    var hps = box.querySelectorAll('[data-user-hapus]');
    for (var i = 0; i < hps.length; i++) hps[i].addEventListener('click', function () {
      run('apiHapusPengguna', this.getAttribute('data-user-hapus'), gagal, muatPengguna);
    });
    document.getElementById('u-simpan').addEventListener('click', function () {
      run('apiSimpanPengguna', {
        email: document.getElementById('u-email').value, nama: document.getElementById('u-nama').value,
        peran: document.getElementById('u-peran').value
      }, function (pesan) {
        document.getElementById('u-hasil2').innerHTML = '<div class="err">' + esc(pesan) + '</div>';
      }, muatPengguna);
    });
  });
}

function muatImpor() {
  var box = document.getElementById('impor-box');
  if (!box) return;
  box.innerHTML = '<div class="card"><h3>Impor data dari SesiRapat versi Muse</h3>' +
    '<p class="muted">Unduh ekspor JSON dari versi Muse (Pengaturan &gt; Data &amp; migrasi), lalu tempel seluruh isinya di sini. Cara lain: unggah berkasnya ke folder Drive SesiRapat_Arsip dengan nama sesirapat-ekspor.json, lalu jalankan imporDataDariDrive() dari editor Apps Script. Baris yang ID-nya sudah ada dilewati — impor aman diulang. Berkas template .docx dan gambar tanda tangan versi Muse tidak ikut pindah.</p>' +
    '<label class="lbl">Isi berkas JSON ekspor</label><textarea id="i-json" style="min-height:130px" placeholder="Tempel isi berkas sesirapat-ekspor-YYYY-MM-DD.json di sini"></textarea>' +
    '<div style="margin-top:10px"><button type="button" class="btn primary small" id="i-jalankan">Impor Sekarang</button></div><div id="i-hasil"></div></div>';
  document.getElementById('i-jalankan').addEventListener('click', function () {
    var teks = document.getElementById('i-json').value;
    if (!teks) { document.getElementById('i-hasil').innerHTML = '<div class="err">Tempel dulu isi JSON-nya.</div>'; return; }
    var btn = this;
    btn.disabled = true; btn.textContent = 'Mengimpor…';
    run('apiImporJson', teks, function (pesan) {
      btn.disabled = false; btn.textContent = 'Impor Sekarang';
      document.getElementById('i-hasil').innerHTML = '<div class="err">' + esc(pesan) + '</div>';
    }, function (r) {
      btn.disabled = false; btn.textContent = 'Impor Sekarang';
      document.getElementById('i-hasil').innerHTML = '<div class="okbox">Impor selesai. Baris baru: ' + esc(JSON.stringify(r.hasil)) + '</div>';
    });
  });
}

// ---------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------
if (PRESENSI_ID) {
  renderPublik();
} else {
  run('apiInfoPengguna', function () {
    app.innerHTML = '<div class="card"><h3>Tidak bisa memuat</h3><p class="muted">Pastikan fungsi buatDatabase() sudah dijalankan sekali dari editor Apps Script, lalu muat ulang halaman ini.</p></div>';
  }, function (u) {
    USER = u;
    if (!u.terdaftar) {
      app.innerHTML = '<div class="card"><h3>Akses belum terdaftar</h3>' +
        '<p class="muted">Kamu masuk dengan email <b>' + esc(u.email || '(tidak terbaca — buka dari browser yang sudah login akun Google)') + '</b>, tetapi email ini belum ada di sheet <b>Pengguna</b> pada SesiRapat_DB.</p>' +
        '<p class="muted">Minta Admin menambahkan email ini dengan peran Admin, Notulis, atau Pimpinan — atau tambahkan sendiri lewat sheet Pengguna bila kamu pemilik spreadsheet-nya — lalu muat ulang halaman ini.</p>' +
        '<p class="muted">Halaman presensi peserta tidak butuh login: buka tautan presensi rapat (URL Web App + ?presensi=&lt;ID rapat&gt;).</p></div>';
      return;
    }
    var navTabs = document.querySelectorAll('#bottomnav .bn-tab');
    for (var nt = 0; nt < navTabs.length; nt++) navTabs[nt].addEventListener('click', function () {
      var t = this.getAttribute('data-tab');
      if (t === 'linimasa') tampilLinimasa();
      else if (t === 'rapat') tampilDaftarRapat();
      else if (t === 'tindak') tampilTindakLanjut();
      else tampilArsip();
    });
    document.getElementById('fab').addEventListener('click', klikFab);
    segarkanLive();
    tampilLinimasa();
  });
}
</script>
</body>
</html>
